  ] },

{ id: 'st5-mantsoe', grade: 5, outcome: 'LO 20, 21, 22, 23', title: L(`Opposites, synonyms and idioms`, `Mantsoe a hananang, a tšoanang ka moelelo le maelana`),
  sections: [
    S(`Opposites`, `Mantsoe a hananang`, `*holimo – tlase* (up – down), *chesa – bata* (hot – cold), *hōla – nyenyane* (big – small), *khanya – lefifi* (light – dark), *pele – morao* (front – back), *thabile – hlomohile* (happy – sad), *nka – fa* (take – give).`, `*holimo – tlase*, *chesa – bata*, *e kholo – e nyenyane*, *khanya – lefifi*, *pele – morao*, *thabile – hlomohile*, *nka – fa*.\nMohlala: *Metsi a chesa, leqhoa le **bata**.*`),
    S(`Words with the same meaning`, `Mantsoe a tšoanang ka moelelo`, `*potlaka – akofa* (hurry), *bua – re* (say), *ntle – motle* (beautiful), *ngoana – lesea* (baby/child), *tsamaea – sepela* (walk/go).`, `*potlaka – akofa*, *ntle – motle*, *ngoana – lesea*, *tsamaea – sepela*.\nMohlala: *Akofa, re tla siuoa ke bese!* = *Potlaka, re tla siuoa ke bese!*`),
    S(`Words with several meanings`, `Mantsoe a nang le meelelo e fapaneng`, `*Letsatsi* = the sun, or a day. *Khoeli* = the moon, or a month. *Leleme* = the tongue, or a language. The sentence tells us which meaning: *Letsatsi le chabile* (the sun has risen) / *Ke tla tla letsatsing la Moqebelo* (on Saturday).`, `*Letsatsi* = letsatsi le chabang, kapa letsatsi la beke. *Khoeli* = khoeli ea leholimo, kapa khoeli ea selemo. *Leleme* = setho sa molomo, kapa puo. Polelo e re bolella moelelo.`),
    S(`Idioms (maelana)`, `Maelana`, `Idioms say something in a picture way:\n- *Ho ja bohobe ka meno a pele* – to eat in a hurry, carelessly\n- *Ho ba le pelo e telele* – to be patient\n- *Ho otla mohatla* – to show off\n- *Ho ba le letsoho le bulehileng* – to be generous`, `Maelana a bua ka tsela ea setšoantšo:\n- *Ho ba le pelo e telele* – ho ba mamello\n- *Ho ba le letsoho le bulehileng* – ho fana habonolo\n- *Ho ja ka meno a pele* – ho ja kapele ntle le hloko`)
  ],
  words: [['opposite', 'e hananang'], ['up', 'holimo'], ['down', 'tlase'], ['patient', 'pelo e telele'], ['day / sun', 'letsatsi'], ['month / moon', 'khoeli']],
  quiz: [
    Q(`The opposite of "chesa" is…`, `E hananang le "chesa" ke…`, ['bata', 'potlaka', 'holimo', 'ja'], 0),
    Q(`Which word has the same meaning as "potlaka"?`, `Ke lentsoe lefe le tšoanang ka moelelo le "potlaka"?`, ['akofa', 'robala', 'lula', 'lieha'], 0),
    Q(`"Khoeli" can mean…`, `"Khoeli" e ka bolela…`, [['the moon or a month', 'khoeli ea leholimo kapa khoeli ea selemo'], ['a cow', 'khomo'], ['water', 'metsi'], ['a song', 'pina']], 0),
    Q(`"Ho ba le pelo e telele" means…`, `"Ho ba le pelo e telele" ho bolela…`, [['to be patient', 'ho ba mamello'], ['to be tall', 'ho ba molelele'], ['to be sick', 'ho kula'], ['to be angry', 'ho halefa']], 0)
  ] },

{ id: 'st5-lijo', grade: 5, outcome: 'LO 16, 17, 18', title: L(`Sesotho food and describing animals`, `Lijo tsa Sesotho le ho hlalosa liphoofolo`),
  sections: [
    S(`Our food`, `Lijo tsa rona`, `- **Papa** – stiff porridge of maize meal, eaten with *moroho* (cooked greens) or meat\n- **Motoho** – soft sour porridge of sorghum (*mabele*)\n- **Leqebekoane** – steamed bread\n- **Likhobe** – samp or maize and beans boiled together\n- **Lipabi** – roasted maize meal\n- **Nama ea khomo, ea nku** – beef, mutton (eaten at feasts – *mokete*)`, `- **Papa** – e phehoang ka phofo ea poone, e jeoa le *moroho* kapa nama\n- **Motoho** – lesheleshele le bolila la *mabele*\n- **Leqebekoane** – bohobe bo phehiloeng ka mouoane\n- **Likhobe** – poone le linaoa tse phehiloeng hammoho\n- **Lipabi** – phofo ea poone e halikiloeng\n- **Nama ea khomo, ea nku** – e jeoa meketeng`),
    S(`Describing animals with colours`, `Ho hlalosa liphoofolo ka mebala`, `Basotho describe cattle by colour: *khomo e ntšo* (black), *e tšoeu* (white), *e khubelu* (red-brown), *e tšehla* (yellow-brown), *e putsoa* (grey), *e matheba* (spotted). Notice: the colour word agrees with the noun: *nku e tšoeu*, *lipere tse ntšo*, *ntja e sootho*.`, `Basotho ba hlalosa likhomo ka mebala: *khomo e ntšo*, *e tšoeu*, *e khubelu*, *e tšehla*, *e putsoa*, *e matheba*. Hlokomela: lentsoe la 'mala le lumellana le lereho: *nku e tšoeu*, *lipere tse ntšo*, *ntja e sootho*.`),
    S(`Describing animals by their marks and sounds`, `Ho hlalosa liphoofolo ka matšoao le melumo`, `*Pere* has a mane (*moetse*) and hooves. *Khomo* has horns (*linaka*) and *ea lla: mooo*. *Nku* has wool (*boea*). *Ntja e bohola* (barks). *Katse e lla: meu*. *Mokoko o lla hoseng*.`, `*Pere* e na le moetse le litlhako. *Khomo* e na le linaka 'me ea lla. *Nku* e na le boea. *Ntja ea bohola*. *Katse e re: meu*. *Mokoko o lla hoseng.*`)
  ],
  words: [['porridge', 'papa'], ['sorghum', 'mabele'], ['feast', 'mokete'], ['horns', 'linaka'], ['wool', 'boea'], ['black', 'e ntšo'], ['white', 'e tšoeu']],
  quiz: [

{ id: 'st5-sebopeho', grade: 5, outcome: 'LO 27, 28, 30, 32, 34, 36', title: L(`Grammar: nouns, pronouns, qualificatives, conjunctions`, `Sebopeho sa puo: lereho, seemeli, sehlakisi, sehokelo`),
  sections: [
    S(`Nouns (mareho) and their classes`, `Mareho le lihlopha tsa ona`, `Sesotho nouns have pairs of prefixes for one and many:\n- **mo-/ba-**: *motho – batho*, *moithuti – baithuti*\n- **mo-/me-**: *molamu – melamu*, *motse – metse*\n- **le-/ma-**: *lejoe – majoe*, *lebese*\n- **se-/li-**: *setulo – litulo*, *sefate – lifate*\n- **(n)-/li-**: *ntja – lintja*, *pere – lipere*\nA noun can be the **doer** (*Ngoana o ja*) or the **receiver** (*'Mè o fepa ngoana*).`, `Mareho a Sesotho a na le lihlomathiso tsa bonngoe le bongata:\n- **mo-/ba-**: *motho – batho*\n- **mo-/me-**: *molamu – melamu*\n- **le-/ma-**: *lejoe – majoe*\n- **se-/li-**: *setulo – litulo*\n- **(n)-/li-**: *ntja – lintja*\nLereho le ka ba **moetsi** (*Ngoana o ja*) kapa **moetsuoa** (*'Mè o fepa ngoana*).`),
    S(`Pronouns (seemeli)`, `Liemeli`, `Absolute pronouns: *nna, uena, eena, rona, lona, bona*. *Ke **nna** ea ngotseng.* Demonstratives point: *motho **enoa*** (this person), *batho **bana*** (these people), *setulo **sena***, *litulo **tsena***.`, `Seemeli-tu: *nna, uena, eena, rona, lona, bona*. *Ke **nna** ea ngotseng.* Tse supang: *motho **enoa***, *batho **bana***, *setulo **sena***, *litulo **tsena***.`),
    S(`Qualificatives of colour and number`, `Sehlakisi sa 'mala le sa palo`, `Colour: *khomo e **ntšo***, *lipere tse **tšoeu***. Number: *likhomo tse **peli***, *batho ba **bararo***, *lifate tse **hlano***. The qualificative agrees with its noun!`, `'Mala: *khomo e **ntšo***, *lipere tse **tšoeu***. Palo: *likhomo tse **peli***, *batho ba **bararo***, *lifate tse **hlano***. Sehlakisi se lumellana le lereho la sona!`),
    S(`Conjunctions and adverbs of place`, `Lihokelo le maeketsi a sebaka`, `Conjunctions join: *le* (and), *empa* (but), *hobane* (because), *kahoo* (so), *ha* (when). Adverbs of place: *mona* (here), *moo* (there), *ka hare* (inside), *ka ntle* (outside), *holimo*, *tlase*. *Ke tla bapala ka **ntle** **hobane** letsatsi le chabile.*`, `Lihokelo: *le*, *empa*, *hobane*, *kahoo*, *ha*. Maeketsi a sebaka: *mona*, *moo*, *ka hare*, *ka ntle*, *holimo*, *tlase*. *Ke tla bapala ka **ntle** **hobane** letsatsi le chabile.*`),
    S(`Building words from syllables`, `Ho bopa mantsoe ka melumo`, `Sesotho words are made of syllables: *ba-na*, *ngoa-na*, *ko-lo-be*, *me-tsi*, *pe-re*. Tap the syllables to build a word. When you make a real word, Leseli tells you!`, `Mantsoe a Sesotho a entsoe ka melumo: *ba-na*, *ngoa-na*, *ko-lo-be*, *me-tsi*, *pe-re*. Tobetsa melumo ho bopa lentsoe. Ha u bopa lentsoe la 'nete, Leseli e tla u bolella!`, { tool: 'syllables', toolOpts: { parts: ['ba', 'na', 'ngoa', 'ko', 'lo', 'be', 'me', 'tsi', 'pe', 're', 'li', 'jo', 'ntja', 'ho'] } })
  ],
  words: [['noun', 'lereho'], ['pronoun', 'seemeli'], ['conjunction', 'sehokelo'], ['adverb', 'leeketsi'], ['person / people', 'motho / batho'], ['chair / chairs', 'setulo / litulo']],
  quiz: [
    Q(`The plural of "setulo" is…`, `Bongata ba "setulo" ke…`, ['litulo', 'matulo', 'betulo', 'metulo'], 0),
    Q(`The plural of "molamu" is…`, `Bongata ba "molamu" ke…`, ['melamu', 'balamu', 'lilamu', 'malamu'], 0),

{ id: 'st5-lengolo', grade: 5, outcome: 'LO 5, 8, 24, 25, 26', title: L(`Writing: a letter, an essay, an advertisement; weather words`, `Ho ngola: lengolo, moqoqo, papatso; mantsoe a leholimo`),
  sections: [
    S(`A friendly letter that persuades`, `Lengolo la setsoalle le kholisang`, `Write your address and date at the top right. Greet: *Motsoalle oa ka Neo,* Ask about their health, then give your news and **persuade**: *Ke kopa hore u tle moketeng oa sekolo hobane…* End: *Ke nna motsoalle oa hau, Lerato.*`, `Ngola aterese ea hau le letsatsi holimo ka ho le letona. Lumelisa: *Motsoalle oa ka Neo,* Botsa ka bophelo, ebe u fana ka litaba 'me u **kholise**: *Ke kopa hore u tle moketeng oa sekolo hobane…* Qetella: *Ke nna motsoalle oa hau, Lerato.*`),
    S(`Weather words`, `Mantsoe a boemo ba leholimo`, `*Letsatsi le chabile* (sunny), *ho na le maru* (cloudy), *pula e na* (raining), *lehloa le khetheha* (snowing), *sefako* (hail), *lehalima* (lightning), *moea o matla* (strong wind), *serame* (frost), *ho chesa* (hot), *ho bata* (cold). In winter there is snow on the Maloti mountains.`, `*Letsatsi le chabile*, *ho na le maru*, *pula e na*, *lehloa le khetheha*, *sefako*, *lehalima*, *moea o matla*, *serame*, *ho chesa*, *ho bata*. Mariha ho na le lehloa lithabeng tsa Maloti.`, { tool: 'thermometer' }),
    S(`An advertisement and checking your work`, `Papatso le ho lokisa mosebetsi oa hau`, `An advertisement is short and catches the eye: **what** is sold, **where**, **when**, **price**, and a nice slogan: *"Lijo tse monate tsa 'Mè Mpho – Mantaha ho isa Labohlano, M10 feela!"* Then read your writing again and **correct your mistakes**: spelling, capital letters, full stops.`, `Papatso e khutšoanyane ebile e hohela mahlo: ho rekisoa **eng**, **hokae**, **neng**, **theko**, le polelo e monate: *"Lijo tse monate tsa 'Mè Mpho – Mantaha ho isa Labohlano, M10 feela!"* Ebe u bala mongolo oa hau hape 'me u **lokise liphoso**: mopeleto, litlhaku tse kholo, likhutlo.`)
  ],
  words: [['letter', 'lengolo'], ['essay', 'moqoqo'], ['advertisement', 'papatso'], ['snow', 'lehloa'], ['hail', 'sefako'], ['lightning', 'lehalima']],
  quiz: [

{ id: 'st6-tsomo', grade: 6, outcome: 'LO 14', title: L(`Folktales (litšomo)`, `Litšomo`),
  sections: [
    S(`What is a tšomo?`, `Tšomo ke eng?`, `A tšomo is a traditional story, told in the evening by grandmothers around the fire. It begins: *"Ka nako e 'ngoe…"* or *"Ho ne ho le…"* and ends: *"Ke tšomo ka mathetho!"* Animals often talk, and the story teaches a lesson, such as working together or not being greedy.`, `Tšomo ke pale ea setso, e phetoang mantsiboea ke bo-nkhono ho pota mollo. E qala ka: *"Ka nako e 'ngoe…"* kapa *"Ho ne ho le…"* 'me e fela ka: *"Ke tšomo ka mathetho!"* Hangata liphoofolo lia bua, 'me pale e ruta thuto, joalo ka ho sebetsa hammoho kapa ho se be meharo.`),
    S(`Parts of a tšomo`, `Likarolo tsa tšomo`, `1. **Opening**: who, where (*Ho ne ho le mohlankana ea bitsoang…*)\n2. **Problem**: something goes wrong\n3. **Events**: often in threes, with a song repeated\n4. **Ending**: the problem is solved; the lesson is clear\nRead "Mmutla le Tau" and other stories in the Library!`, `1. **Qalo**: mang, hokae\n2. **Bothata**: ho na le ho sa tsamaeng hantle\n3. **Liketsahalo**: hangata ka makhetlo a mararo, le pina e phetoang\n4. **Qetello**: bothata bo rarolloa; thuto ea hlaka\nBala "Mmutla le Tau" le lipale tse ling Laeboraring!`)
  ],
  words: [['folktale', 'tšomo'], ['story', 'pale'], ['lesson', 'thuto'], ['grandmother', 'nkhono'], ['hare', 'mmutla']],

{ id: 'st6-maele', grade: 6, title: L(`Proverbs (maele)`, `Maele`),
  sections: [
    S(`What are maele?`, `Maele ke eng?`, `Proverbs are short wise sayings from our elders. They teach how to live well.`, `Maele ke lipolelo tse khutšoanyane tsa bohlale tse tsoang ho baholo ba rona. A ruta mokhoa oa ho phela hantle.`),
    S(`Proverbs and their meanings`, `Maele le meelelo ea ona`, `- *Ngoana ea sa lleng o shoela tharing* – if you do not ask for help, nobody will know you need it\n- *Kopano ke matla* – unity is strength\n- *Letsoho le hlatsoa le leng* – we help each other\n- *Thupa e kojoa e sa le metsi* – teach children while they are young\n- *Motho ke motho ka batho* – we are people through other people\n- *Pelo e ja serati* – the heart wants what it loves\n- *Mphemphe o a lapisa* – begging tires people; work for yourself`, `- *Ngoana ea sa lleng o shoela tharing* – haeba u sa kope thuso, ha ho motho ea tla tseba hore u ea e hloka\n- *Kopano ke matla*\n- *Letsoho le hlatsoa le leng* – rea thusana\n- *Thupa e kojoa e sa le metsi* – ruta bana ha ba sa le banyenyane\n- *Motho ke motho ka batho*\n- *Pelo e ja serati*\n- *Mphemphe o a lapisa* – ho kopa ho khathatsa batho; iphelise`)
  ],
  words: [['proverb', 'seele (maele)'], ['wisdom', 'bohlale'], ['unity', 'kopano'], ['strength', 'matla']],
  quiz: [
    Q(`"Kopano ke matla" means…`, `"Kopano ke matla" e bolela…`, [['unity is strength', 'ha re kopane re matla'], ['money is power', 'chelete ke matla'], ['run fast', 'matha kapele'], ['eat well', 'ja hantle']], 0),
    Q(`Which proverb says we should ask for help when we need it?`, `Ke seele sefe se reng re lokela ho kopa thuso ha re e hloka?`, ['Ngoana ea sa lleng o shoela tharing', 'Pelo e ja serati', 'Thupa e kojoa e sa le metsi', 'Mphemphe o a lapisa'], 0),

{ id: 'st6-thothokiso', grade: 6, outcome: 'LO 6, 7', title: L(`Poetry (lithoko) and debate (phehisano)`, `Lithothokiso le phehisano`),
  sections: [
    S(`Praise poetry (lithoko)`, `Lithoko`, `Basotho have praise poems (*lithoko*) for chiefs, heroes, cattle and even oneself. They use **repetition**, **comparison** (the hero is a lion, a storm) and strong rhythm. When you read a poem, ask: Who or what is praised? Which comparisons are used? How does it make me feel?`, `Basotho ba na le *lithoko* tsa marena, bahale, likhomo esita le motho ka boeena. Li sebelisa **phetapheto**, **papiso** (mohale ke tau, sefefo) le morethetho o matla. Ha u bala thothokiso, botsa: Ho rorisoa mang kapa eng? Ho sebelisoa lipapiso life? E nketsa hore ke ikutloe joang?`),
    S(`Debating (phehisano)`, `Phehisano`, `Two teams argue for (*ba lumelang*) and against (*ba hananang*) a topic, e.g. *"Bana ba lokela ho ba le lifono sekolong."* Speak in turn, give reasons and examples, listen with respect, and never insult the other side.`, `Lihlopha tse peli li phehisana ka taba: ba **lumelang** le ba **hananang**, mohl. *"Bana ba lokela ho ba le lifono sekolong."* Buang ka ho latellana, fanang ka mabaka le mehlala, mamelang ka tlhompho, 'me le se ke la nyelisa lehlakore le leng.`)
  ],
  words: [['poem', 'thothokiso'], ['praise poem', 'lithoko'], ['debate', 'phehisano'], ['reason', 'lebaka'], ['hero', 'mohale']],
  quiz: [
    Q(`In a debate the team that disagrees is…`, `Phehisanong sehlopha se sa lumelleng ke…`, ['ba hananang', 'ba lumelang', 'ba binang', 'ba robetseng'], 0),
    Q(`Lithoko are…`, `Lithoko ke…`, [['praise poems', 'lithothokiso tsa thoriso'], ['riddles', 'lilotho'], ['letters', 'mangolo'], ['games', 'lipapali']], 0)

{ id: 'st7-maetsi', grade: 7, outcome: 'LO 33, 35', title: L(`Verbs and time: past, present, future`, `Maetsi le nako: e fetileng, ea joale, e tlang`),
  sections: [
    S(`Tenses in Sesotho`, `Linako ka Sesotho`, `- Present: *Ke **ja** papa.* (I eat)\n- Recent past: *Ke **jele** papa.* (I ate)\n- Future: *Ke **tla ja** papa.* (I will eat)\n- Negative: *Ha ke **je**.* (I do not eat) – *Ha ke a **ja**.* (I did not eat)`, `- Nako ea joale: *Ke **ja** papa.*\n- Nako e fetileng: *Ke **jele** papa.*\n- Nako e tlang: *Ke **tla ja** papa.*\n- Kganyetso: *Ha ke **je**.* – *Ha ke a **ja**.*`),
    S(`Time phrases`, `Lipoleloana tsa nako`, `*Maobane* (yesterday), *kajeno* (today), *hosane* (tomorrow), *hoseng* (morning), *motšehare* (afternoon), *mantsiboea* (evening), *bosiu* (night), *selemong se tlang* (next year), *ha khale* (long ago).`, `*Maobane*, *kajeno*, *hosane*, *hoseng*, *motšehare*, *mantsiboea*, *bosiu*, *selemong se tlang*, *ha khale*.\nMohlala: *Maobane ke **ile** ka ea Maseru; hosane ke **tla** ea Leribe.*`),
    S(`Days and months`, `Matsatsi le likhoeli`, `Days: *Sontaha, Mantaha, Labobeli, Laboraro, Labone, Labohlano, Moqebelo*.\nMonths: *Pherekhong, Hlakola, Hlakubele, 'Mesa, Motšeanong, Phupjane, Phupu, Phato, Loetse, Mphalane, Pulungoana, Tšitoe*.`, `Matsatsi: *Sontaha, Mantaha, Labobeli, Laboraro, Labone, Labohlano, Moqebelo*.\nLikhoeli: *Pherekhong, Hlakola, Hlakubele, 'Mesa, Motšeanong, Phupjane, Phupu, Phato, Loetse, Mphalane, Pulungoana, Tšitoe*.`)
  ],
  words: [['yesterday', 'maobane'], ['today', 'kajeno'], ['tomorrow', 'hosane'], ['Monday', 'Mantaha'], ['January', 'Pherekhong'], ['December', 'Tšitoe']],
  quiz: [
    Q(`"Ke tla ja" is in the…`, `"Ke tla ja" e nakong…`, [['future', 'e tlang'], ['past', 'e fetileng'], ['present', 'ea joale'], ['negative', 'ea kganyetso']], 0),
    Q(`Which month is October?`, `Ke khoeli efe e leng October?`, ['Mphalane', 'Phupu', 'Hlakola', 'Tšitoe'], 0),
    Q(`The day after Labobeli is…`, `Letsatsi le latelang Labobeli ke…`, ['Laboraro', 'Mantaha', 'Labone', 'Sontaha'], 0),
    Q(`"I ate papa" in Sesotho is…`, `"I ate papa" ka Sesotho ke…`, ['Ke jele papa.', 'Ke tla ja papa.', 'Ha ke je papa.', 'Ke ja papa hosane.'], 0)
  ] },

{ id: 'st7-mekhoa', grade: 7, outcome: 'LO 19', title: L(`Basotho customs and responsibility`, `Mekhoa ea Basotho le boikarabello`),
  sections: [
    S(`Customs`, `Mekhoa`, `- **Seanamarena / kobo ea Basotho**: the Basotho blanket, worn with pride, especially in winter and at ceremonies\n- **Mokorotlo**: the conical straw hat, a national symbol (it is on our flag!)\n- **Pitso**: a meeting called by the chief where community matters are discussed\n- **Letsema**: neighbours working together in the fields\n- **Mafisa**: lending cattle to someone who looks after them`, `- **Kobo ea Basotho (seanamarena)**: e aparoa ka boikhohomoso, haholo mariha le meketeng\n- **Mokorotlo**: katiba ea joang, letšoao la naha (e folakhang ea rona!)\n- **Pitso**: kopano e bitsoang ke morena moo litaba tsa sechaba li buisanoang\n- **Letsema**: baahelani ba sebetsa hammoho masimong\n- **Mafisa**: ho alimela motho likhomo hore a li hlokomele`),
    S(`Showing responsibility`, `Ho bontša boikarabello`, `A responsible child: helps at home (fetching water, herding, cooking), looks after younger brothers and sisters, takes care of school books, tells the truth, and finishes homework. **Responsibility = doing what you should, even when nobody is watching.**`, `Ngoana ea nang le boikarabello: o thusa hae (ho kha metsi, ho alosa, ho pheha), o hlokomela bana ba banyenyane, o hlokomela libuka tsa sekolo, o bua 'nete, 'me o qeta mosebetsi oa sekolo. **Boikarabello = ho etsa se lokelang, leha ho se motho ea u bonang.**`)
  ],
  words: [['blanket', 'kobo'], ['meeting', 'pitso'], ['working together', 'letsema'], ['responsibility', 'boikarabello'], ['truth', "'nete"]],
  quiz: [
    Q(`"Letsema" is…`, `"Letsema" ke…`, [['neighbours working together in the fields', 'baahelani ba sebetsa hammoho masimong'], ['a blanket', 'kobo'], ['a hat', 'katiba'], ['a song', 'pina']], 0),
    Q(`Which symbol is on the flag of Lesotho?`, `Ke letšoao lefe le leng folakhang ea Lesotho?`, ['mokorotlo', 'tau', 'lehloa', 'khomo'], 0),

  ] },

{ id: 'st7-puisano', grade: 7, outcome: 'LO 1, 2, 3, 4', title: L(`Speaking confidently and reading for information`, `Ho bua ka boitšepo le ho bala ho fumana tsebo`),
  sections: [
    S(`Speaking without preparing`, `Ho bua ntle le ho itokisa`, `When asked to speak suddenly: 1) take a breath, 2) say your main point first, 3) give one reason and one example, 4) finish with a short sentence. Look at the people listening and speak loudly enough.`, `Ha u kopuoa ho bua ka tšohanyetso: 1) hema, 2) bolela ntlha ea hau ea bohlokoa pele, 3) fana ka lebaka le le leng le mohlala o le mong, 4) qetella ka polelo e khutšoanyane. Sheba ba mamelang 'me u bue ka lentsoe le utloahalang.`),
    S(`Using a book to find information`, `Ho sebelisa buka ho batla tsebo`, `Look at the **title**, the **author**, and the **contents page** (*litaba*) at the front. The **index** at the back lists topics with page numbers. In Leseli, use the search box and the Textbooks in the Library the same way.`, `Sheba **sehlooho**, **mongoli**, le leqephe la **litaba** ka pele. **Index** ka morao e thathamisa litaba le linomoro tsa maqephe. Ho Leseli, sebelisa lebokose la ho batla le Libuka tsa thuto Laeboraring ka tsela e tšoanang.`)

    Q(`When speaking suddenly, say ___ first.`, `Ha u bua ka tšohanyetso, bolela ___ pele.`, [['your main point', 'ntlha ea hau ea bohlokoa'], ['a joke', 'motlae'], ['nothing', 'ha ho letho'], ['goodbye', 'sala hantle']], 0)

LESELI.addLessons('social', [
/* ======================= GRADE 5 ======================= */
{ id: 'so5-moshoeshoe', grade: 5, hard: true, title: L(`Moshoeshoe I and the birth of the Basotho nation`, `Moshoeshoe I le tsoalo ea sechaba sa Basotho`),
  sections: [
    S(`Young Lepoqo`, `Lepoqo e monyenyane`, `Moshoeshoe was born around **1786** at Menkhoaneng, near Butha-Buthe, and was first called **Lepoqo**. As a young man he learned wisdom from the great teacher **Mohlomi**, who taught that a leader should rule with kindness and that people are a chief's real wealth.`, `Moshoeshoe o hlahile hoo e ka bang ka **1786** Menkhoaneng, haufi le Butha-Buthe, 'me pele o ne a bitsoa **Lepoqo**. Ha e sa le mohlankana o ile a ithuta bohlale ho mosuoe e moholo **Mohlomi**, ea neng a ruta hore moetapele o lokela ho busa ka mosa le hore batho ke leruo la 'nete la morena.`),
    S(`Thaba-Bosiu, 1824`, `Thaba-Bosiu, 1824`, `During the **Lifaqane** wars, many groups were attacked and scattered. In **1824** Moshoeshoe led his people from Butha-Buthe to **Thaba-Bosiu**, a flat-topped mountain that was easy to defend. He welcomed refugees from many clans, gave them land and cattle (*mafisa*), and they became one nation – the **Basotho**. He even forgave the cannibals who ate his grandfather Peete, saying people should be won with kindness.`, `Nakong ea lintoa tsa **Lifaqane**, lihlopha tse ngata li ile tsa hlaseloa tsa qhalakana. Ka **1824** Moshoeshoe o ile a isa batho ba hae ho tloha Butha-Buthe ho ea **Thaba-Bosiu**, thaba e sephara holimo eo ho neng ho le bonolo ho e sireletsa. O ile a amohela baphaphathehi ba lichaba tse ngata, a ba fa mobu le likhomo (*mafisa*), 'me ba fetoha sechaba se le seng – **Basotho**. O bile a tšoarela le malimo a neng a jele ntate-moholo oa hae Peete, a re batho ba lokela ho haptjoa ka mosa.`, { fig: TIMELINE }),
    S(`Protecting the land`, `Ho sireletsa naha`, `Boer settlers wanted Basotho land, and wars were fought in the 1850s and 1860s. Much land west of the Mohokare (Caledon) River was lost. To save the nation, Moshoeshoe asked Britain for protection, and in **1868** the country became **Basutoland**. Moshoeshoe died in **1870**. We remember him on **Moshoeshoe's Day, 11 March**.`, `Bajaki ba Maburu ba ne ba batla mobu oa Basotho, 'me ho ile ha loanoa lintoa lilemong tsa bo-1850 le bo-1860. Mobu o mongata ka bophirimela ba noka ea Mohokare o ile oa lahleha. Ho pholosa sechaba, Moshoeshoe o ile a kopa tšireletso ho Brithani, 'me ka **1868** naha ea fetoha **Basutoland**. Moshoeshoe o hlokahetse ka **1870**. Re mo hopola ka **Letsatsi la Moshoeshoe, la 11 Hlakubele**.`)
  ],
  words: [['nation', 'sechaba'], ['chief / king', 'morena'], ['war', 'ntoa'], ['refugee', 'mophaphathehi'], ['history', 'histori'], ['mountain', 'thaba']],
  quiz: [
    Q(`What was Moshoeshoe's first name?`, `Lebitso la pele la Moshoeshoe e ne e le mang?`, ['Lepoqo', 'Mohlomi', 'Peete', 'Letsie'], 0),
    N(`In which year did Moshoeshoe move to Thaba-Bosiu?`, `Moshoeshoe o falletse Thaba-Bosiu ka selemo sefe?`, 1824),
    Q(`Who was Moshoeshoe's wise teacher?`, `Mosuoe ea bohlale oa Moshoeshoe e ne e le mang?`, ['Mohlomi', 'Moorosi', 'Masopha', 'Jonathan'], 0),
    Q(`Why did Moshoeshoe choose Thaba-Bosiu?`, `Hobaneng Moshoeshoe a khethile Thaba-Bosiu?`, [['It was easy to defend', 'Ho ne ho le bonolo ho e sireletsa'], ['It had a big shop', 'E ne e e-na le lebenkele le leholo'], ['It was near the sea', 'E ne e le haufi le leoatle'], ['It had no water', 'E ne e se na metsi']], 0),
    Q(`Moshoeshoe's Day is on…`, `Letsatsi la Moshoeshoe ke…`, [['11 March', '11 Hlakubele'], ['4 October', '4 Mphalane'], ['25 December', '25 Tšitoe'], ['1 January', '1 Pherekhong']], 0),
    N(`In which year did Basutoland come under British protection?`, `Basutoland e bile tlas'a tšireletso ea Brithani ka selemo sefe?`, 1868)
  ] },

{ id: 'so5-geography', grade: 5, title: L(`Our country: districts, mountains and rivers`, `Naha ea rona: litereke, lithaba le linoka`),
  sections: [
    S(`The Kingdom in the Sky`, `'Muso o Leholimong`, `Lesotho is completely surrounded by South Africa. It is called the **Kingdom in the Sky** because all of the country is more than 1 400 m above sea level – the highest "lowest point" of any country in the world. The capital city is **Maseru**.`, `Lesotho e pota-potiloe ka ho feletseng ke Afrika Boroa. E bitsoa **'Muso o Leholimong** hobane naha eohle e ka holimo ho limithara tse 1 400 ho feta boemo ba leoatle – sebaka se tlase ka ho fetisisa se phahameng ho feta sa naha efe kapa efe lefatšeng. Motse-moholo ke **Maseru**.`),
    S(`Ten districts`, `Litereke tse leshome`, `Butha-Buthe, Leribe, Berea, Maseru, Mafeteng, Mohale's Hoek, Quthing, Qacha's Nek, Thaba-Tseka and Mokhotlong. The **lowlands** are in the west (most farming and towns); the **Maloti mountains** cover the east.`, `Butha-Buthe, Leribe, Berea, Maseru, Mafeteng, Mohale's Hoek, Quthing, Qacha's Nek, Thaba-Tseka le Mokhotlong. **Mabalane (lowlands)** a ka bophirimela (temo le litoropo tse ngata); **lithaba tsa Maloti** li koahela bochabela.`, { fig: MAP }),
    S(`Mountains and rivers`, `Lithaba le linoka`, `**Thabana Ntlenyana** (3 482 m) is the highest mountain in Southern Africa. The **Senqu** (Orange) River starts in our mountains and flows to the Atlantic Ocean. The **Mohokare** (Caledon) forms part of our western border. Our water is "white gold": the **Katse** and **Mohale** dams send water to South Africa and make electricity at **'Muela**.`, `**Thabana Ntlenyana** (3 482 m) ke thaba e telele ka ho fetisisa Afrika Boroa. Noka ea **Senqu** e qala lithabeng tsa rona 'me e phallela Leoatleng la Atlantic. **Mohokare** e etsa karolo ea moeli oa rona oa bophirimela. Metsi a rona ke "khauta e tšoeu": matamo a **Katse** le **Mohale** a romela metsi Afrika Boroa 'me a etsa motlakase **'Muela**.`)
  ],
  words: [['country', 'naha'], ['district', 'setereke'], ['river', 'noka'], ['dam', 'letamo'], ['capital city', 'motse-moholo'], ['border', 'moeli']],
  quiz: [
    N(`How many districts does Lesotho have?`, `Lesotho e na le litereke tse kae?`, 10),
    Q(`What is the highest mountain in Southern Africa?`, `Ke thaba efe e telele ka ho fetisisa Afrika Boroa?`, ['Thabana Ntlenyana', 'Thaba-Bosiu', 'Qiloane', 'Table Mountain'], 0),
    Q(`Which river is also called the Orange River?`, `Ke noka efe e bitsoang hape Orange River?`, ['Senqu', 'Mohokare', 'Makhaleng', 'Phuthiatsana'], 0),
    Q(`Lesotho is surrounded by…`, `Lesotho e pota-potiloe ke…`, [['South Africa', 'Afrika Boroa'], ['the sea', 'leoatle'], ['Botswana', 'Botswana'], ['Eswatini', 'Eswatini']], 0),
    Q(`Which district is Katse Dam in? (Hint: in the mountains, centre)`, `Letamo la Katse le setereke sefe?`, ['Thaba-Tseka', 'Mafeteng', 'Berea', 'Quthing'], 0)
  ] },

{ id: 'so5-rights', grade: 5, title: L(`Children's rights, responsibilities and staying safe`, `Litokelo tsa bana, boikarabello le ho lula u bolokehile`),
  sections: [
    S(`Rights`, `Litokelo`, `Every child has the right to: a **name and nationality**, **education**, **health care**, **food and shelter**, **play**, to be **protected from abuse**, and to be **heard**. Children with disabilities have the same rights and must be included.`, `Ngoana e mong le e mong o na le tokelo ea: **lebitso le bochaba**, **thuto**, **tlhokomelo ea bophelo**, **lijo le bolulo**, **ho bapala**, ho **sireletsoa tlhekefetsong**, le ho **mameloa**. Bana ba nang le bokooa ba na le litokelo tse tšoanang 'me ba tlameha ho kenyelletsoa.`),
    S(`Responsibilities`, `Boikarabello`, `Rights come with responsibilities: respect others, go to school and learn, help at home, look after school property, and do not bully anyone.`, `Litokelo li tla le boikarabello: hlompha ba bang, ea sekolong 'me u ithute, thusa hae, hlokomela thepa ea sekolo, 'me u se ke ua hlekefetsa motho.`),
    S(`If someone hurts you`, `Haeba motho a u utloisa bohloko`, `No one may touch you in a way that makes you feel unsafe. **Say NO, go away, and TELL** a trusted adult (parent, teacher, nurse, chief). Call the free **Child Helpline 116**, or the **police on 112**. It is never your fault.`, `Ha ho motho ea lumelloang ho u ama ka tsela e etsang hore u ikutloe u sa bolokeha. **Re CHE, tsamaea, 'me u BOLELLE** motho e moholo eo u mo tšepang (motsoali, mosuoe, mooki, morena). Letsetsa mahala **Child Helpline 116**, kapa **mapolesa ho 112**. Hase phoso ea hau le ka mohla.`)
  ],
  words: [['right', 'tokelo'], ['protect', 'sireletsa'], ['safe', 'bolokehile'], ['help', 'thuso'], ['tell', 'bolella']],
  quiz: [
    Q(`Which is a right of every child?`, `Ke tokelo efe ea ngoana e mong le e mong?`, [['education', 'thuto'], ['a car', 'koloi'], ['a phone', 'fono'], ['money every day', 'chelete letsatsi le leng le le leng']], 0),
    N(`The free Child Helpline number in Lesotho is…`, `Nomoro ea mahala ea Child Helpline Lesotho ke…`, 116),
    Q(`If someone hurts you, you should…`, `Haeba motho a u utloisa bohloko, u lokela ho…`, [['say no, go away and tell a trusted adult', 're che, tsamaea u bolelle motho e moholo eo u mo tšepang'], ['keep it a secret', 'e boloka e le lekunutu'], ['think it is your fault', 'nahana hore ke phoso ea hau'], ['do nothing', 'se etse letho']], 0),
    TF(`Children with disabilities have the same rights as other children.`, `Bana ba nang le bokooa ba na le litokelo tse tšoanang le tsa bana ba bang.`, true)
  ] },

/* ======================= GRADE 6 ======================= */
{ id: 'so6-government', grade: 6, title: L(`How Lesotho is governed`, `Kamoo Lesotho e busoang kateng`),
  sections: [
    S(`A constitutional monarchy`, `'Muso oa morena o laoloang ke molao-motheo`, `Lesotho has a **King** (head of state) whose powers are set by the **Constitution**. The **Prime Minister** leads the government. **Parliament** (the National Assembly and the Senate) makes laws. Judges in the **courts** decide if laws were broken. Citizens over 18 vote in elections every five years.`, `Lesotho e na le **Morena** (hlooho ea naha) eo matla a hae a behiloeng ke **Molao-motheo**. **Tonakholo** e etella 'muso pele. **Paramente** (Ntlo ea Sechaba le Senate) e etsa melao. Baahloli **makhotleng** ba etsa qeto hore na melao e tlotsoe. Baahi ba ka holimo ho lilemo tse 18 ba khetha likhethong lilemo tse ling le tse ling tse hlano.`),
    S(`Chiefs and councils`, `Marena le makhotla`, `In villages, **chiefs** keep order, settle disputes and allocate land. **Community councils** plan local services like roads and water. A **pitso** lets the community speak.`, `Metseng, **marena** a boloka khotso, a rarolla liqabang 'me a abela mobu. **Makhotla a sechaba** a rala litšebeletso tsa sebaka joaloka litsela le metsi. **Pitso** e fa sechaba monyetla oa ho bua.`)
  ],
  words: [['king', 'morena'], ['law', 'molao'], ['vote', 'khetha / vouta'], ['court', 'lekhotla'], ['citizen', 'moahi']],
  quiz: [
    Q(`Who makes laws in Lesotho?`, `Ke mang ea etsang melao Lesotho?`, [['Parliament', 'Paramente'], ['the chief alone', 'morena a le mong'], ['teachers', 'basuoe'], ['the police', 'mapolesa']], 0),
    N(`From what age can citizens vote?`, `Baahi ba ka khetha ho tloha lilemong life?`, 18),
    Q(`Who leads the government?`, `Ke mang ea etellang 'muso pele?`, [['the Prime Minister', 'Tonakholo'], ['the King', 'Morena'], ['a judge', 'moahloli'], ['the principal', 'mosuoe-hlooho']], 0)
  ] },

{ id: 'so6-sadc', grade: 6, title: L(`Our neighbours and Africa`, `Baahelani ba rona le Afrika`),
  sections: [
    S(`SADC`, `SADC`, `Lesotho is a member of the **Southern African Development Community (SADC)**, countries that work together on trade, peace and development. Its headquarters is in Gaborone, Botswana. Many Basotho work in South Africa, and our money (Loti) is linked to the Rand.`, `Lesotho ke setho sa **SADC**, linaha tse sebetsang hammoho khoebong, khotsong le ntlafatsong. Ntlo-kholo ea eona e Gaborone, Botswana. Basotho ba bangata ba sebetsa Afrika Boroa, 'me chelete ea rona (Loti) e hokahane le Rand.`),
    S(`Africa`, `Afrika`, `Africa has 54 countries. It has the world's longest river (the Nile) and largest hot desert (the Sahara). The **African Union** (AU), based in Addis Ababa, brings African countries together.`, `Afrika e na le linaha tse 54. E na le noka e telele ka ho fetisisa lefatšeng (Nile) le lehoatata le leholo ka ho fetisisa le chesang (Sahara). **African Union** (AU), e Addis Ababa, e kopanya linaha tsa Afrika.`)
  ],
  words: [['neighbour', 'moahelani'], ['trade', 'khoebo'], ['peace', 'khotso'], ['continent', 'kontinente']],
  quiz: [
    Q(`Where is the SADC headquarters?`, `Ntlo-kholo ea SADC e hokae?`, ['Gaborone', 'Maseru', 'Cairo', 'London'], 0),
    N(`How many countries are in Africa?`, `Afrika e na le linaha tse kae?`, 54),
    Q(`The longest river in the world is…`, `Noka e telele ka ho fetisisa lefatšeng ke…`, ['the Nile', 'the Senqu', 'the Mohokare', 'the Thames'], 0)
  ] },

{ id: 'so6-environment', grade: 6, title: L(`Caring for our environment`, `Ho hlokomela tikoloho ea rona`),
  sections: [
    S(`Problems`, `Mathata`, `Litter (plastic bags, bottles), cutting trees for firewood, overgrazing and soil erosion, dirty water, and burning rubbish all harm our environment and our health.`, `Litšila (mekotla ea polasetiki, libotlolo), ho rema lifate bakeng sa patsi, ho fulisa ho feta tekano le khoholeho ea mobu, metsi a litšila, le ho chesa litšila kaofela li senya tikoloho le bophelo ba rona.`),
    S(`What we can do`, `Seo re ka se etsang`, `**Reduce, reuse, recycle**: use a shopping bag many times, make crafts from bottles and tins, sort rubbish. Plant trees on Arbor Day, protect springs (*liliba*), and keep the school yard clean.`, `**Fokotsa, sebelisa hape, recycle**: sebelisa mokotla oa ho reka makhetlo a mangata, etsa mesebetsi ea matsoho ka libotlolo le lithini, hlopha litšila. Lema lifate ka Letsatsi la Lifate, sireletsa **liliba**, 'me u boloke lebala la sekolo le hloekile.`)
  ],
  words: [['environment', 'tikoloho'], ['litter', 'litšila'], ['spring (water)', 'seliba'], ['recycle', 'recycle (sebelisa hape)']],
  quiz: [
    Q(`Which is good for the environment?`, `Ke efe e molemo bakeng sa tikoloho?`, [['reusing bottles', 'ho sebelisa libotlolo hape'], ['burning plastic', 'ho chesa polasetiki'], ['cutting all trees', 'ho rema lifate tsohle'], ['throwing litter', 'ho lahla litšila']], 0),
    Q(`The 3 Rs are reduce, reuse and…`, `Li-R tse 3 ke reduce, reuse le…`, ['recycle', 'run', 'read', 'rest'], 0)
  ] },

/* ======================= GRADE 7 ======================= */
{ id: 'so7-independence', grade: 7, hard: true, title: L(`From Basutoland to independence (1868–1966)`, `Ho tloha Basutoland ho isa boipusong (1868–1966)`),
  sections: [
    S(`Colonial rule`, `Puso ea bokolone`, `From 1868 Basutoland was ruled by Britain. In 1871 it was placed under the Cape Colony; Basotho resisted, and in the **Gun War (1880–1881)** they refused to give up their guns. In 1884 Britain again ruled Basutoland directly, which helped keep Lesotho separate from South Africa.`, `Ho tloha ka 1868 Basutoland e ne e busoa ke Brithani. Ka 1871 e ile ea behoa tlas'a Kolone ea Kapa; Basotho ba hanyetsa, 'me **Ntoeng ea Lithunya (1880–1881)** ba hana ho tela lithunya tsa bona. Ka 1884 Brithani e ile ea boela ea busa Basutoland ka kotloloho, e leng ho ileng ha thusa Lesotho hore e lule e arohane le Afrika Boroa.`),
    S(`Independence`, `Boipuso`, `Political parties formed in the 1950s and 60s. On **4 October 1966** Basutoland became the independent **Kingdom of Lesotho**, with **King Moshoeshoe II** as head of state and **Chief Leabua Jonathan** as the first Prime Minister. We celebrate **Independence Day on 4 October**. Our flag (blue, white, green with a black mokorotlo) means rain, peace and prosperity.`, `Mekha ea lipolotiki e thehiloe lilemong tsa bo-1950 le bo-1960. Ka la **4 Mphalane 1966** Basutoland ea fetoha **'Muso oa Lesotho** o ikemetseng, ka **Morena Moshoeshoe II** e le hlooho ea naha le **Morena Leabua Jonathan** e le Tonakholo ea pele. Re keteka **Letsatsi la Boipuso ka la 4 Mphalane**. Folakha ea rona (boputsoa, bosoeu, botala le mokorotlo o motšo) e emela pula, khotso le nala.`)
  ],
  words: [['independence', 'boipuso'], ['flag', 'folakha'], ['colony', 'kolone'], ['peace', 'khotso'], ['rain', 'pula'], ['prosperity', 'nala']],
  quiz: [
    Q(`When did Lesotho become independent?`, `Lesotho e ipusitse neng?`, [['4 October 1966', '4 Mphalane 1966'], ['11 March 1824', '11 Hlakubele 1824'], ['1 January 2000', '1 Pherekhong 2000'], ['1868', '1868']], 0),
    Q(`Who was the first Prime Minister of Lesotho?`, `Tonakholo ea pele ea Lesotho e ne e le mang?`, ['Chief Leabua Jonathan', 'Moshoeshoe I', 'Mohlomi', 'Moorosi'], 0),
    Q(`The Gun War was fought because Basotho…`, `Ntoa ea Lithunya e loannoe hobane Basotho…`, [['refused to give up their guns', 'ba hanne ho tela lithunya tsa bona'], ['wanted more rain', 'ba ne ba batla pula e ngata'], ['had no cattle', 'ba ne ba se na likhomo'], ['wanted a new king', 'ba ne ba batla morena e mocha']], 0),
    Q(`The colours of the Lesotho flag stand for…`, `Mebala ea folakha ea Lesotho e emela…`, [['rain, peace and prosperity', 'pula, khotso le nala'], ['war and fire', 'ntoa le mollo'], ['snow only', 'lehloa feela'], ['the sea', 'leoatle']], 0)
  ] },

{ id: 'so7-world', grade: 7, title: L(`Maps and the world`, `Limmapa le lefatše`),
  sections: [
    S(`Reading a map`, `Ho bala mmapa`, `A map has a **title**, a **key** (what symbols mean), a **scale** (1 cm = 10 km) and a **compass** (North, South, East, West). Maseru is in the **west** of Lesotho; Mokhotlong is in the **north-east**.`, `Mmapa o na le **sehlooho**, **senotlolo** (se bolelang hore matšoao a bolela eng), **sekala** (1 cm = 10 km) le **khampase** (Leboea, Boroa, Bochabela, Bophirimela). Maseru e **bophirimela** ba Lesotho; Mokhotlong e **leboea-bochabela**.`, { fig: MAP }),
    S(`Continents and oceans`, `Likontinente le maoatle`, `There are **7 continents**: Africa, Asia, Europe, North America, South America, Australia (Oceania) and Antarctica, and **5 oceans**: Pacific, Atlantic, Indian, Southern and Arctic. Lesotho is in Southern Africa, south of the Equator.`, `Ho na le **likontinente tse 7**: Afrika, Asia, Europe, Amerika Leboea, Amerika Boroa, Australia le Antarctica, le **maoatle a 5**: Pacific, Atlantic, Indian, Southern le Arctic. Lesotho e Afrika Boroa, ka boroa ba Equator.`)
  ],

    Q(`The part of a map that explains the symbols is the…`, `Karolo ea mmapa e hlalosang matšoao ke…`, [['key', 'senotlolo'], ['scale', 'sekala'], ['title', 'sehlooho'], ['ocean', 'leoatle']], 0),
    Q(`"Bochabela" means…`, `"Bochabela" ke…`, ['east', 'west', 'north', 'south'], 0)

{ id: 'so7-democracy', grade: 7, title: L(`Democracy, elections and values (botho)`, `Demokrasi, likhetho le botho`),
  sections: [
    S(`Democracy`, `Demokrasi`, `In a democracy, people choose their leaders in **free and fair elections** by **secret ballot**. Everyone is equal before the law. People may speak freely and must respect others' views. Voting is both a right and a responsibility.`, `Demokrasing, batho ba khetha baetapele ba bona **likhethong tse lokolohileng le tse hlokang leeme** ka **voutu ea lekunutu**. Bohle ba lekana ka pel'a molao. Batho ba ka bua ka bolokolohi 'me ba tlameha ho hlompha maikutlo a ba bang. Ho vouta ke tokelo le boikarabello.`),
    S(`Botho`, `Botho`, `**Botho** means being truly human: kindness, honesty, respect, sharing, and caring for the old, the sick and people with disabilities. *Motho ke motho ka batho.* Our religions and traditions all teach these values.`, `**Botho** ke ho ba motho ka 'nete: mosa, botšepehi, tlhompho, ho arolelana, le ho hlokomela maqheku, ba kulang le batho ba nang le bokooa. *Motho ke motho ka batho.* Litumelo le meetlo ea rona kaofela li ruta litekanyetso tsena.`)
  ],

    Q(`Which shows botho?`, `Ke efe e bontšang botho?`, [['helping an old person carry water', 'ho thusa leqheku ho jara metsi'], ['laughing at a disabled learner', 'ho tšeha moithuti ea nang le bokooa'], ['stealing', 'ho utsoa'], ['lying', 'ho bua leshano']], 0)

/* Creativity and Entrepreneurial – Grades 5–7 (Grade 6 outcomes photographed: syllabus pp. 144–145).

LESELI.addLessons('creative', [
/* ======================= GRADE 5 ======================= */
{ id: 'c5-drawing', grade: 5, hard: true, title: L(`Drawing step by step: shapes, measuring, sketching`, `Ho taka mohato ka mohato: libopeho, ho lekanya, ho sketcha`),
  sections: [
    S(`Everything is made of simple shapes`, `Tsohle li entsoe ka libopeho tse bonolo`, `Good artists start with **light, simple shapes**: circles, ovals, squares, triangles. A cow = a big oval body + a smaller oval head + four rectangles for legs + triangles for horns. Then you join the shapes, rub out the extra lines and add details. **Press lightly first; darken lines at the end.**`, `Litaki tse ntle li qala ka **libopeho tse bonolo tse bobebe**: lidikadikoe, li-oval, likoere, likhutlo-tharo. Khomo = oval e kholo ea 'mele + oval e nyane ea hlooho + likhutlo-nne tse 4 tsa maoto + likhutlo-tharo tsa linaka. Ebe u kopanya libopeho, u hlakola mela e feteletseng 'me u kenya lintlha. **Hatella butle pele; teneha mela qetellong.**`, { tool: 'drawpad', toolOpts: { guide: 'house' } }),
    S(`Measured drawing`, `Ho taka ka litekanyo`, `Use a ruler to draw exact sizes. If a real table is 2 m long and you draw 1 cm for every 20 cm (**scale 1 : 20**), your drawing is 10 cm long. Measured drawings are used by builders and designers.`, `Sebelisa rulara ho taka boholo bo nepahetseng. Haeba tafole ea 'nete e le bolelele ba 2 m 'me u taka 1 cm bakeng sa 20 cm e 'ngoe le e 'ngoe (**sekala 1 : 20**), setšoantšo sa hau se bolelele ba 10 cm. Litšoantšo tsa litekanyo li sebelisoa ke lihahi le baqapi.`),
    S(`Observational and freehand sketching`, `Ho sketcha ka ho shebisisa`, `Look at the real thing more than at your paper! Sit outside and sketch a mountain, a tree or a rondavel. Notice: things far away look **smaller** and **lighter**; the **shadow** is on the side away from the sun. Shade with the side of your pencil.`, `Sheba ntho ea 'nete ho feta pampiri ea hau! Lula ka ntle 'me u sketche thaba, sefate kapa rondavel. Hlokomela: lintho tse hole li shebahala li **nyenyane** ebile li **khanya**; **moriti** o lehlakoreng le hole le letsatsi. Etsa moriti ka lehlakore la pensele.`),
    S(`Drawing a face (portrait)`, `Ho taka sefahleho`, `1. Draw an egg shape. 2. Draw a light line down the middle and one across the middle – the **eyes go on the middle line**. 3. The nose ends halfway between the eyes and the chin. 4. The mouth is a third of the way from the nose to the chin. 5. Ears go from eye level to nose level. Use the guide on the pad below.`, `1. Taka sebopeho sa lehe. 2. Taka mola o bobebe bohareng ho theoha le o mong ho tšela bohare – **mahlo a mola oa bohareng**. 3. Nko e fela bohareng pakeng tsa mahlo le seledu. 4. Molomo o karolong ea boraro ho tloha nkong ho ea selelung. 5. Litsebe li tloha boemong ba mahlo ho isa ho ba nko. Sebelisa tataiso pading e ka tlase.`, { tool: 'drawpad', toolOpts: { guide: 'face' } })
  ],
  words: [['draw', 'taka'], ['pencil', 'pensele'], ['shape', 'sebopeho'], ['shadow', 'moriti'], ['ruler', 'rulara'], ['face', 'sefahleho']],
  quiz: [
    Q(`How should you start a drawing?`, `U lokela ho qala setšoantšo joang?`, [['with light, simple shapes', 'ka libopeho tse bonolo tse bobebe'], ['with dark details', 'ka lintlha tse tšoeu haholo'], ['with colour only', "ka 'mala feela"], ['with the background', 'ka morao feela']], 0),
    Q(`Where do the eyes go on a face?`, `Mahlo a ea kae sefahlehong?`, [['on the middle line', 'molaleng oa bohareng'], ['at the top', 'holimo'], ['near the chin', 'haufi le seledu'], ['on the ears', 'litsebeng']], 0),
    Q(`At a scale of 1 : 20, a 2 m (200 cm) table is drawn…`, `Sekaleng sa 1 : 20, tafole ea 2 m (200 cm) e takoa…`, ['10 cm long', '20 cm long', '2 cm long', '200 cm long'], 0),
    TF(`Things far away look smaller.`, `Lintho tse hole li shebahala li le nyenyane.`, true)
  ] },

{ id: 'c5-colour', grade: 5, outcome: 'G6 LO 4', title: L(`Colours and painting`, `Mebala le ho penta`),
  sections: [
    S(`Primary and secondary colours`, `Mebala ea mantlha le ea bobeli`, `The **primary colours** are **red, yellow and blue** – you cannot mix them from other colours. Mix two primaries to get a **secondary colour**: red + yellow = **orange**, yellow + blue = **green**, blue + red = **purple**. Try it!`, `**Mebala ea mantlha** ke **bofubelu, bosehla le boputsoa** – u ke ke ua e kopanya ho tsoa mebaleng e meng. Kopanya e 'meli ea mantlha ho fumana **'mala oa bobeli**: bofubelu + bosehla = **lamunu**, bosehla + boputsoa = **botala**, boputsoa + bofubelu = **perese**. Leka!`, { tool: 'colourmix' }),
    S(`Warm and cool colours; making paint`, `Mebala e futhumetseng le e pholileng; ho etsa pente`, `**Warm** colours (red, orange, yellow) feel like fire and sun. **Cool** colours (blue, green, purple) feel calm like water. Add white to make a colour lighter (a **tint**), black to make it darker (a **shade**). No paint? Use natural colours: soil, charcoal, crushed leaves, flowers.`, `Mebala e **futhumetseng** (bofubelu, lamunu, bosehla) e tšoana le mollo le letsatsi. E **pholileng** (boputsoa, botala, perese) e khutsitse joaloka metsi. Kenya bosoeu ho bobebisa 'mala, botšo ho o lefifatsa. Ha ho pente? Sebelisa mebala ea tlhaho: mobu, mashala, makhasi a sitsoeng, lipalesa.`)
  ],
  words: [['colour', "'mala"], ['red', 'bofubelu'], ['yellow', 'bosehla'], ['blue', 'boputsoa'], ['green', 'botala'], ['paint', 'pente']],

{ id: 'c5-music', grade: 5, outcome: 'G6 LO 7, 8, 9, 11', title: L(`Music: sound, rhythm and our songs`, `'Mino: molumo, morethetho le lipina tsa rona`),
  sections: [
    S(`Pitch, duration and volume`, `Bophahamo, bolelele le matla a molumo`, `- **Pitch**: how high or low a sound is (a bird whistles high, a cow moos low)\n- **Duration**: how long a sound lasts (a short clap, a long hum)\n- **Volume**: how loud or soft (thunder is loud, whispering is soft)\nThe **lesiba** (a Basotho mouth-bow played by herd boys) and the **setolo-tolo** make sounds by vibration.`, `- **Bophahamo**: molumo o phahame kapa o tlase hakae (nonyana e letsa holimo, khomo e lla tlase)\n- **Bolelele**: molumo o nka nako e kae (ho opa matsoho hanyane, ho bina nako e telele)\n- **Matla**: molumo o holimo kapa o tlase (lealuma le holimo, ho hoeshetsa ho tlase)\n**Lesiba** (seletsa sa balisana) le **setolo-tolo** li etsa melumo ka ho thothomela.`, { tool: 'sort', toolOpts: { items: [{ emo: '🐦', en: 'a bird whistling', st: 'nonyana e letsang molodi', g: 'h' }, { emo: '🐄', en: 'a cow mooing', st: 'khomo e llang', g: 'l' }, { emo: '🥁', en: 'a big drum', st: 'moropa o moholo', g: 'l' }, { emo: '👶', en: 'a baby crying', st: 'lesea le llang', g: 'h' }, { emo: '🦁', en: 'a lion roaring', st: 'tau e purumang', g: 'l' }, { emo: '🐭', en: 'a mouse squeaking', st: 'toeba e llang', g: 'h' }], groups: [{ id: 'h', emo: '⬆️', en: 'High pitch', st: 'Molumo o phahameng' }, { id: 'l', emo: '⬇️', en: 'Low pitch', st: 'Molumo o tlase' }] } }),
    S(`Scales and rhythm`, `Lisekala le morethetho`, `A **scale** is a ladder of notes: **do – re – mi – fa – so – la – ti – do** (tonic sol-fa, used in our school choirs). **Rhythm** is the pattern of long and short sounds: clap *ta ta ti-ti ta*. Songs for **mokhibo**, **mohobelo** and **litolobonya** each have their own rhythm.`, `**Sekala** ke lere la linoto: **do – re – mi – fa – so – la – ti – do** (tonic sol-fa, e sebelisoang ke likhoaere tsa sekolo). **Morethetho** ke paterone ea melumo e melelele le e mekhutšoanyane: opa *ta ta ti-ti ta*. Lipina tsa **mokhibo**, **mohobelo** le tse ling li na le morethetho oa tsona.`)
  ],

{ id: 'c5-crafts', grade: 5, outcome: 'G6 LO 14, 24, 25, 26', title: L(`Crafts from waste: paper mâché, wire, clay`, `Mesebetsi ea matsoho ka litšila: paper mâché, terata, letsopa`),
  sections: [
    S(`Paper mâché`, `Paper mâché`, `1. Tear old newspaper into strips. 2. Mix flour and water into a smooth glue. 3. Dip strips and lay them over a shape (a balloon or crumpled paper) in 3–4 layers. 4. Dry in the sun for 2 days. 5. Paint. You can make bowls, masks and animals.`, `1. Taborisa likoranta tsa khale ka mela. 2. Kopanya phofo le metsi ho etsa sekhomaretsi se boreleli. 3. Kenya mela 'me u e behe holim'a sebopeho (balune kapa pampiri e phuthiloeng) ka mekato e 3–4. 4. Omisa letsatsing matsatsi a 2. 5. Penta. U ka etsa likotlolo, limaske le liphoofolo.`),
    S(`Wire and clay`, `Terata le letsopa`, `Wire cars (*likoloi tsa terata*) are a proud Basotho craft – bend wire with pliers around a drawing of your car. Clay from the river can be shaped into pots and animals, dried, then fired in a hot fire to make it hard.`, `Likoloi tsa terata ke mosebetsi oa matsoho oo Basotho ba ikhohomosang ka oona – koba terata ka pliers ho pota setšoantšo sa koloi ea hau. Letsopa la noka le ka bopoa lipitsa le liphoofolo, la omisoa, ebe le chesoa mollong o chesang hore le thatafale.`),
    S(`Reuse and recycle to earn money`, `Sebelisa hape u etse chelete`, `Plastic bottles become pot plants, pencil holders and brooms; tins become lamps and toys; plastic bags can be woven into mats and bags. Sell them at the school market! This keeps Lesotho clean **and** makes income.`, `Libotlolo tsa polasetiki li fetoha lipitsa tsa limela, lisebelisoa tsa ho boloka lipensele le mafielo; lithini li fetoha mabone le lintho tsa ho bapala; mekotla ea polasetiki e ka lohuoa ho etsa limethe le mekotla. Li rekise mmarakeng oa sekolo! Sena se boloka Lesotho e hloekile **le** ho etsa chelete.`)
  ],
  words: [['wire', 'terata'], ['clay', 'letsopa'], ['glue', 'sekhomaretsi'], ['newspaper', 'koranta'], ['recycle', 'sebelisa hape']],
  quiz: [
    Q(`Paper mâché glue can be made from…`, `Sekhomaretsi sa paper mâché se ka etsoa ka…`, [['flour and water', 'phofo le metsi'], ['sand and oil', 'lehlabathe le oli'], ['salt only', 'letsoai feela'], ['milk and sugar', 'lebese le tsoekere']], 0),
    Q(`Why do we reuse plastic bottles?`, `Hobaneng re sebelisa libotlolo tsa polasetiki hape?`, [['to keep the country clean and earn money', 'ho boloka naha e hloekile le ho etsa chelete'], ['to make more litter', 'ho etsa litšila tse ngata'], ['to burn them', 'ho li chesa'], ['no reason', 'ha ho lebaka']], 0)

{ id: 'c5-business', grade: 5, outcome: 'G6 LO 28–36', title: L(`Needs, wants, resources and markets`, `Litlhoko, litakatso, lisebelisoa le limmaraka`),
  sections: [
    S(`Needs and wants`, `Litlhoko le litakatso`, `**Needs** are things we must have to live: food, water, shelter, clothes, health care, education. **Wants** are nice to have: sweets, toys, a TV. Because money and resources are **scarce** (limited), we must choose needs first.`, `**Litlhoko** ke lintho tseo re tlamehang ho ba le tsona ho phela: lijo, metsi, bolulo, liaparo, tlhokomelo ea bophelo, thuto. **Litakatso** ke lintho tse monate ho ba le tsona: lipompong, lintho tsa ho bapala, TV. Kaha chelete le lisebelisoa li **haella**, re tlameha ho khetha litlhoko pele.`),
    S(`Resources`, `Lisebelisoa`, `**Natural resources** come from nature: water, soil, sunshine, grass, diamonds. **Renewable** resources can be replaced (water, wind, sun, trees if we replant). **Non-renewable** resources run out (diamonds, coal, oil). We must use them carefully.`, `**Lisebelisoa tsa tlhaho** li tsoa tlhahong: metsi, mobu, letsatsi, joang, litaemane. Tse **nchafalang** li ka nkeloa sebaka (metsi, moea, letsatsi, lifate haeba re lema hape). Tse **sa nchafaleng** lia fela (litaemane, mashala, oli). Re tlameha ho li sebelisa ka hloko.`, { tool: 'sort', toolOpts: { items: [{ emo: '☀️', en: 'sunlight', st: 'khanya ea letsatsi', g: 'r' }, { emo: '💎', en: 'diamonds (Letšeng mine)', st: 'litaemane (Letšeng)', g: 'n' }, { emo: '💧', en: 'water', st: 'metsi', g: 'r' }, { emo: '🛢️', en: 'petrol / oil', st: 'peterole / oli', g: 'n' }, { emo: '🌬️', en: 'wind', st: 'moea', g: 'r' }, { emo: '⚫', en: 'coal', st: 'mashala', g: 'n' }, { emo: '🌳', en: 'trees (if replanted)', st: 'lifate (ha li lengoa hape)', g: 'r' }], groups: [{ id: 'r', emo: '♻️', en: 'Renewable', st: 'E nchafalang' }, { id: 'n', emo: '⛏️', en: 'Non-renewable', st: 'E sa nchafaleng' }] } }),
    S(`Producers, consumers and markets`, `Bahlahisi, bareki le limmaraka`, `A **producer** makes goods (a farmer grows cabbages) or gives a service (a hairdresser, a taxi driver). A **consumer** buys and uses them. A **market** is where buyers and sellers meet – a street market in Maseru, or an online market on a phone. The **price** depends on cost, demand and how much is available.`, `**Mohlahisi** o etsa thepa (sehoai se lema k'habeche) kapa o fana ka tšebeletso (moetsi oa moriri, mokhanni oa tekesi). **Moreki** o reka 'me o li sebelisa. **Mmaraka** ke moo bareki le barekisi ba kopanang teng – mmaraka oa seterateng Maseru, kapa mmaraka oa inthanete fonong. **Theko** e itšetlehile ka litšenyehelo, tlhoko, le hore na ho na le bongata bo bokae.`)
  ],
  words: [['need', 'tlhoko'], ['want', 'takatso'], ['market', 'mmaraka'], ['producer', 'mohlahisi'], ['consumer', 'moreki'], ['scarce', 'haella']],
  quiz: [
    Q(`Which is a need?`, `Ke efe e leng tlhoko?`, [['clean water', 'metsi a hloekileng'], ['sweets', 'lipompong'], ['a toy car', 'koloi ea ho bapala'], ['a TV', 'TV']], 0),
    Q(`Diamonds are a ___ resource.`, `Litaemane ke sesebelisoa se ___.`, [['non-renewable', 'sa nchafaleng'], ['renewable', 'nchafalang'], ['man-made', 'entsoeng ke motho'], ['free', 'mahala']], 0),
    Q(`A farmer who grows and sells cabbages is a…`, `Sehoai se lemang le ho rekisa k'habeche ke…`, [['producer', 'mohlahisi'], ['consumer', 'moreki'], ['market', 'mmaraka'], ['resource', 'sesebelisoa']], 0),
    TF(`Scarcity means we cannot have everything we want.`, `Tlhaello e bolela hore re ke ke ra ba le tsohle tseo re li batlang.`, true)

{ id: 'c6-advertising', grade: 6, outcome: 'LO 13, 16, 17', title: L(`Advertising, signs and calligraphy`, `Papatso, matšoao le mongolo o motle (calligraphy)`),
  sections: [
    S(`Ways to advertise`, `Mekhoa ea ho bapatsa`, `Posters, radio jingles, WhatsApp status, word of mouth, a sign board, or giving free tastes at the market. A good advert uses **AIDA**: catch **A**ttention, create **I**nterest, make people **D**esire it, ask for **A**ction ("Buy today!"). Adverts must be **honest**.`, `Liphousetara, lipina tsa seea-le-moea, WhatsApp status, molomo ho ea ho o mong, boto ea letšoao, kapa ho fa batho ho latsoa mahala mmarakeng. Papatso e ntle e sebelisa **AIDA**: hohela **tlhokomelo**, tsosa **thahasello**, etsa hore batho ba **lakatse**, kopa **ketso** ("Reka kajeno!"). Lipapatso li tlameha ho bua **'nete**.`),
    S(`Signs and calligraphy`, `Matšoao le calligraphy`, `Warning signs must be simple and clear: a red triangle means danger (*Kotsi!*), a big picture works for people who cannot read. **Calligraphy** is beautiful lettering: hold a flat pen or a cut stick at an angle so lines are thick going down and thin going across.`, `Matšoao a temoso a tlameha ho ba bonolo ebile a hlakile: khutlo-tharo e khubelu e bolela kotsi (*Kotsi!*), setšoantšo se seholo se thusa ba sa tsebeng ho bala. **Calligraphy** ke ho ngola litlhaku tse ntle: tšoara pene e bataletseng kapa lehlaka le khaotsoeng ka sekhutlo hore mela e be teteaneng ha e theoha 'me e be tšesaane ha e tšela.`, { tool: 'drawpad' })
  ],
  words: [['poster', 'phousetara'], ['danger', 'kotsi'], ['sign', 'letšoao'], ['advertise', 'bapatsa'], ['honest', "'nete"]],
  quiz: [
    Q(`In AIDA, the first A means…`, `Ho AIDA, A ea pele e bolela…`, [['attention', 'tlhokomelo'], ['always', 'kamehla'], ['art', 'bonono'], ['answer', 'karabo']], 0),
    Q(`A warning sign should be…`, `Letšoao la temoso le lokela ho ba…`, [['simple, clear, with a picture', 'bonolo, le hlakile, le setšoantšo'], ['very small', 'le lenyenyane haholo'], ['full of long words', 'le tletse mantsoe a malelele'], ['hidden', 'le patiloe']], 0)
  ] },

{ id: 'c6-portraits', grade: 6, outcome: 'LO 2, 3, 5, 15', title: L(`Portraits, costumes and cultures`, `Litšoantšo tsa batho, liaparo le litso`),
  sections: [
    S(`Portraits from different cultures`, `Litšoantšo tsa batho ba litso tse fapaneng`, `A portrait shows a person's face and character. Show culture through clothing and decoration: a Mosotho in a **seanamarena** blanket and **mokorotlo**; a Chinese person in a **qipao** dress; an Indian woman in a **sari**; a European in a suit and hat. Draw with respect – never to make fun of anyone.`, `Setšoantšo sa motho se bontša sefahleho le semelo sa motho. Bontša setso ka liaparo le mekhabiso: Mosotho ka **kobo ea seanamarena** le **mokorotlo**; Mochaena ka mose oa **qipao**; mosali oa India ka **sari**; Moeurope ka sutu le katiba. Taka ka tlhompho – le ka mohla u se ke ua soma motho.`, { tool: 'drawpad', toolOpts: { guide: 'face' } }),
    S(`Basotho costumes for different ages and occasions`, `Liaparo tsa Basotho ho latela lilemo le liketsahalo`, `Girls may wear the **thethana** (beaded skirt) for traditional dances; married women wear the **seshoeshoe** dress and a **tuku** (headscarf); herd boys wear blankets and gumboots; elders wear blankets of special patterns at weddings and funerals. Make costumes for dolls from cloth scraps.`, `Banana ba ka apara **thethana** litantšing tsa setso; basali ba nyetsoeng ba apara mose oa **seshoeshoe** le **tuku**; balisana ba apara likobo le lieta tsa rabara; baholo ba apara likobo tsa mekhabiso e ikhethang manyalong le mapatong. Etsetsa lipopi liaparo ka masela a setseng.`)
  ],

  quiz: [
    Q(`The traditional Basotho print dress is called…`, `Mose oa setso oa Basotho o bitsoa…`, ['seshoeshoe', 'sari', 'qipao', 'kilt'], 0),

{ id: 'c6-games', grade: 6, outcome: 'LO 21, 22, 23', title: L(`Games: indigenous games and strategy`, `Lipapali: tsa setso le tsa leqheka`),
  sections: [
    S(`Morabaraba`, `Morabaraba`, `Morabaraba is played by two players with 12 "cows" each on a board of three squares. Make a row of three (a *mill*) to capture the other player's cows. It trains planning and thinking ahead. Play it against the phone in **Library → Games**.`, `Morabaraba e bapaloa ke libapali tse peli ka "likhomo" tse 12 ka 'ngoe botong ea likoere tse tharo. Etsa mola oa tse tharo ho hapa likhomo tsa sebapali se seng. E koetlisa ho rala le ho nahana pele. E bapale le fono ho **Laeboraring → Lipapali**.`),
    S(`Strategy games from other cultures`, `Lipapali tsa leqheka tsa litso tse ling`, `**Chess** (from India/Persia), **draughts/checkers**, **mancala/morabaraba-like counting games** across Africa (bao in Kenya, oware in Ghana). **Modify** a board game: change the board size, the number of pieces or a rule to suit your friends.`, `**Chess** (e tsoang India/Persia), **draughts**, lipapali tsa ho bala tsa **mancala** ho pholletsa le Afrika (bao Kenya, oware Ghana). **Fetola** papali ea boto: fetola boholo ba boto, palo ea likotoana kapa molao hore e tšoanele metsoalle ea hau.`)
  ],

  quiz: [

{ id: 'c7-business', grade: 7, title: L(`Starting a small business`, `Ho qala khoebo e nyenyane`),
  sections: [
    S(`A business idea`, `Mohopolo oa khoebo`, `Look for a **need** in your community: fat cakes at school break, fixing phones, selling vegetables from a school garden, braiding hair. Ask: Who will buy? Where? How much will they pay? What do I need to start?`, `Batla **tlhoko** sechabeng sa hau: makoenya nakong ea phomolo, ho lokisa lifono, ho rekisa meroho ea serapa sa sekolo, ho loha moriri. Botsa: Ke mang ea tla reka? Hokae? Ba tla lefa bokae? Ke hloka eng ho qala?`),
    S(`Costs, price and profit`, `Litšenyehelo, theko le phaello`, `Write down all **costs** (flour, oil, gas, packaging). Divide by the number of items to get the cost per item. Set a **price** a bit higher so you make a **profit**. Keep a simple **record book**: date, money in, money out. Save part of the profit to grow.`, `Ngola **litšenyehelo** tsohle (phofo, oli, khase, liphuthelo). Arola ka palo ea lintho ho fumana litšenyehelo tsa ntho e le 'ngoe. Beha **theko** e phahameng hanyane e le hore u etse **phaello**. Boloka **buka ea lirekoto** e bonolo: letsatsi, chelete e kenang, chelete e tsoang. Boloka karolo ea phaello ho holisa khoebo.`, { tool: 'profit' })
  ],
  words: [['business', 'khoebo'], ['customer', 'moreki'], ['profit', 'phaello'], ['record book', 'buka ea lirekoto'], ['save', 'boloka']],
  quiz: [
    N(`20 fat cakes cost M30 to make. Cost of one fat cake (Maloti)?`, `Makoenya a 20 a bitsa M30 ho etsoa. Le leng le bitsa bokae (Maloti)?`, 1.5),

{ id: 'c7-vandalism', grade: 7, outcome: 'G6 LO 27, 37', title: L(`Protecting property and saying no to vandalism`, `Ho sireletsa thepa le ho hana ho senya`),
  sections: [
    S(`What is vandalism?`, `Ho senya thepa ke eng?`, `Vandalism is damaging things on purpose: breaking windows, writing on walls, stealing taps, cutting fences. It costs the community money that could buy books and medicine, and it can make places unsafe.`, `Ho senya thepa ka boomo: ho roba lifensetere, ho ngola maboteng, ho utsoa lipompo, ho seha literata. Ho jella sechaba chelete e neng e ka reka libuka le meriana, ebile ho ka etsa hore libaka li se bolokehe.`),
    S(`Word puzzles against substance abuse`, `Lipapali tsa mantsoe khahlanong le lithethefatsi`, `Make a word search or crossword with healthy messages: *SAY NO*, *HEALTH*, *FRIENDS*, *SPORT*, *FUTURE*. Share it with your class. Substance abuse often leads to vandalism and crime.`, `Etsa papali ea ho batla mantsoe kapa crossword e nang le melaetsa e phetseng hantle: *HANA*, *BOPHELO*, *METSOALLE*, *LIPAPALI*, *BOKAMOSO*. E arolelane le sehlopha sa hau. Tšebeliso e mpe ea lithethefatsi hangata e lebisa ho senyeng thepa le botlokotsebe.`)
  ],

  quiz: [
    Q(`Which is vandalism?`, `Ke efe e leng ho senya thepa?`, [['breaking school windows', 'ho roba lifensetere tsa sekolo'], ['cleaning the classroom', 'ho hloekisa tlelase'], ['planting trees', 'ho lema lifate'], ['reading a book', 'ho bala buka']], 0),
    TF(`Vandalism costs the whole community.`, `Ho senya thepa ho jella sechaba sohle.`, true)

{ id: 'c7-design', grade: 7, outcome: 'G6 LO 18, 19, 38, 39', title: L(`Design: toys, digital graphics, knitting and crochet`, `Moralo: lintho tsa ho bapala, litšoantšo tsa dijithale, ho loha`),
  sections: [
    S(`The design process`, `Mokhoa oa ho rala`, `1. **Identify** the problem (*little children need safe toys*). 2. **Research** (what toys exist? what materials do we have?). 3. **Sketch** 3 ideas. 4. **Make** the best one. 5. **Test** it with users. 6. **Improve** it. That is exactly how Leseli was made – with your school!`, `1. **Hlalosa** bothata. 2. **Batlisisa**. 3. **Sketcha** mehopolo e 3. 4. **Etsa** e molemo ka ho fetisisa. 5. **Leka** le basebelisi. 6. **E ntlafatse**. Ke kamoo Leseli e entsoeng kateng – le sekolo sa hau!`),
    S(`Drawing on a phone or computer`, `Ho taka ka fono kapa k'homphieutha`, `A graphics/painting programme has a **pencil/brush**, **shapes**, **fill bucket**, **colour picker**, **eraser** and **undo**. Use the drawing pad below like a simple paint programme and **save** your work.`, `Lenaneo la ho taka le na le **pensele/borashe**, **libopeho**, **nkho ea ho tlatsa**, **mokhethi oa mebala**, **sehlakoli** le **undo**. Sebelisa pad ea ho taka e ka tlase joaloka lenaneo le bonolo 'me u **boloke** mosebetsi oa hau.`, { tool: 'drawpad' }),
    S(`Knitting and crochet`, `Ho loha`, `**Rib stitch** (knitting): knit 1, purl 1 across the row, then repeat – it stretches, good for jersey cuffs and hats. **Crochet**: a **double crochet** goes yarn-over once; a **treble** goes yarn-over twice and is taller. Start with a small square motif, then join squares into a blanket.`, `**Rib stitch**: knit 1, purl 1 moleng, ebe u pheta – ea otlolloha, e loketse matsoho a jesi le likatiba. **Crochet**: **double crochet** e kenya khoele hang; **treble** e kenya khoele habeli 'me e telele. Qala ka sekoere se senyenyane, ebe u kopanya likoere ho etsa kobo.`)
  ],
  words: [['design', 'moralo'], ['toy', 'papadi'], ['knit', 'loha'], ['test', 'leka'], ['improve', 'ntlafatsa']],
  quiz: [
    Q(`What comes after "make" in the design process?`, `Ho latela eng ka mor'a "etsa" mokhoeng oa ho rala?`, [['test', 'leka'], ['throw away', 'lahla'], ['sell immediately', 'rekisa hang'], ['sleep', 'robala']], 0),

{ id: 'mmutla-tau', cover: '🐇', level: 5, title: L('The Hare and the Lion', 'Mmutla le Tau'),
  pages: [

    P('🕳️', '"Show me this lion!" said the lion. The hare took him to a deep well. "He lives down there," said the hare. The lion looked in and saw an angry lion looking back.', '"Mpontše tau eo!" ha rialo tau. Mmutla oa e isa selibeng se tebileng. "E lula ka tlase mona," ha rialo mmutla. Tau ea sheba ka hare \'me ea bona tau e halefileng e e shebile.'),

{ id: 'thabo-pula', cover: '🌧️', level: 5, title: L('Thabo and the Bottle Rain Gauge', 'Thabo le Rain Gauge ea Botlolo'),

{ id: 'palesa', cover: '👂🏾', level: 6, title: L("Palesa Listens", 'Palesa oa Mamela'),

<script>
/* Leseli – the app shell: router, top bar, home, subjects, lessons, quizzes, "Me", settings.
   Hash routes (#/home, #/lesson/<id> ...) so the Android back button and the browser back button both work. */
'use strict';

Object.assign(ICON, {
  maths: '<path d="M5 4h14v16H5z"/><path d="M8 8h3M9.5 6.5v3M13 8h3M8 14l3 3M11 14l-3 3M13 14.5h3M13 16.5h3"/>',
  science: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 15h9"/>',
  english: '<path d="M4 18L8 6l4 12M5.5 14h5"/><path d="M14 10h4a2 2 0 010 4h-4v-8h3.5a2 2 0 010 4"/>',
  sesotho: '<path d="M12 3L4 17q8 4 16 0z"/><path d="M7 12.5q5 2 10 0M5.6 15q6.4 2.6 12.8 0"/><path d="M12 3v-0"/><circle cx="12" cy="3" r="1.3"/>',
  social: '<circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 20c0-3.5 2.5-6 5.5-6s5.5 2.5 5.5 6M13.5 20c0-2.5 1.2-5 3-5s4 2 4 5"/>',
  creative: '<path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/><circle cx="7.5" cy="16.5" r="1"/>'
});

/* ---------- small UI helpers ---------- */
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2600); }
function flash(kind) { const f = $('#flash'); f.className = ''; void f.offsetWidth; f.className = kind; }
function beep(good) {
  if (Store.s.settings.hearing) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = beep.ctx || (beep.ctx = new C()); const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine';
    const t = ctx.currentTime; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (good ? .45 : .35));
    if (good) { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + .12); } else { o.frequency.setValueAtTime(260, t); o.frequency.setValueAtTime(200, t + .15); }
    o.start(t); o.stop(t + .5);
  } catch (e) {}
}
/* feedback that works for everyone: colour flash + sound + vibration + words */
function react(good) { flash(good ? 'good' : 'bad'); beep(good); Platform.vibrate(good ? 60 : [80, 80, 80]); }
function confetti() {
  if (Store.s.settings.reduceMotion) return;
  const c = h('div', { class: 'confetti', 'aria-hidden': 'true' });
  const cols = ['#f6b73c', '#00804a', '#1f4fb5', '#c2366b', '#fff'];
  for (let i = 0; i < 40; i++) c.appendChild(h('i', { style: { left: Math.random() * 100 + '%', background: pick(cols), animationDelay: Math.random() * .5 + 's' } }));
  document.body.appendChild(c); setTimeout(() => c.remove(), 2400);
}
function modal(build) {
  const m = $('#modal'); m.innerHTML = '';
  const sheet = h('div', { class: 'sheet' }); m.appendChild(sheet); m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  m.onclick = e => { if (e.target === m) close(); };
  build(sheet, close);
  setTimeout(() => { const f = sheet.querySelector('h2, [autofocus], button, input'); f && f.focus(); }, 30);
  return close;
}
function confirmBox(msg, onYes) {
  modal((s, close) => add(s, [h('h2', { tabindex: '-1' }, msg), h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: close }, T('no')), h('button', { class: 'btn warn', onclick: () => { close(); onYes(); } }, T('yes')))]));
}
const go = path => { location.hash = '#/' + path; };
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function speakBtn(getChunks, opts) {
  opts = opts || {};
  const b = h('button', { class: 'btn small ' + (opts.cls || ''), type: 'button', 'aria-label': T('readAloud') }, icon('speaker', null, 20), opts.label === false ? null : h('span', {}, T('readAloud')));
  b.onclick = () => {
    if (b.classList.contains('playing')) { Speech.stop(); return; }
    Speech.stop();
    $$('.playing').forEach(x => x.classList.remove('playing'));
    b.classList.add('playing');
    const prev = Speech.onState;
    Speech.onState = on => { if (!on) { b.classList.remove('playing'); Speech.onState = prev; } };
    Speech.speakChunks(getChunks(), {});
    Store.log('tts');
  };
  return b;
}
/* read every element marked data-read inside root */
function chunksOf(root) {
  return $$('[data-read]', root).filter(el => el.offsetParent !== null || el.closest('.class-slide')).map(el => {
    const lang = (el.getAttribute('lang') || (el.closest('[lang]') || {}).lang || 'en').slice(0, 2);
    return { text: el.dataset.read || el.textContent, lang: lang === 'st' ? 'st' : 'en', el };
  }).filter(c => c.text && c.text.trim());
}
function readMain() { Speech.speakChunks(chunksOf($('#main'))); }
/* text element in the interface language, marked for read-aloud */
function ut(tag, key, props) { return h(tag, Object.assign({ 'data-read': '', lang: I18N.ui() }, props || {}), T(key)); }
function lt(tag, o, props) { const lang = typeof o === 'string' ? I18N.ui() : (I18N.content() === 'en' ? 'en' : 'st'); return h(tag, Object.assign({ 'data-read': '', lang }, props || {}), typeof o === 'string' ? o : tx(o, lang)); }
const subjColor = id => `var(--c-${id})`;

/* ---------- content helpers ---------- */
const Content = {
  grade() { const l = Store.learner(); return Store.s.settings.viewGrade || (l && l.grade) || 5; },
  lessons(subject, grade) { return LESELI.lessonsOf(subject).concat(Store.s.custom.filter(c => c.subject === subject)).filter(l => !grade || l.grade === grade).map(Content.apply); },
  lesson(id) { const l = LESELI.lessons[id] || Store.s.custom.find(c => c.id === id); return l ? Content.apply(l) : null; },
  /* teacher corrections are layered on top of the built-in text */
  apply(l) {
    const o = Store.s.overrides[l.id]; if (!o) return l;
    const c = Object.assign({}, l, { sections: l.sections.map((s, i) => { const so = o.sections && o.sections[i]; if (!so) return s; return Object.assign({}, s, { h: Object.assign({}, s.h, so.h || {}), p: Object.assign({}, s.p, so.p || {}) }); }) });
    if (o.title) c.title = Object.assign({}, l.title, o.title);
    return c;
  },
  all() { return Object.values(LESELI.lessons).concat(Store.s.custom).map(Content.apply); }
};

/* ---------- shell ---------- */
const App = {
  route: '', params: [], started: Date.now(), lessonTimer: null,
  init() {
    Store.load(); Speech.init();
    this.applySettings();
    window.addEventListener('hashchange', () => this.render());
    window.LeseliBridge = window.LeseliBridge || {};
    window.LeseliBridge.back = () => { if ($('#modal').hidden === false) { $('#modal').hidden = true; return true; } if ($('.class-slide')) { $('.class-slide').remove(); document.body.classList.remove('hide-nav'); return true; } if (location.hash && !/^#\/(home|who|welcome)?$/.test(location.hash)) { history.back(); return true; } return false; };
    Store.touchDay();
    Store.log('session', { lang: Store.s.settings.lang, vision: Store.s.settings.vision, hearing: Store.s.settings.hearing, app: Platform.isApp });
    if (Store.s.settings.firstRun) location.hash = '#/welcome';
    else if (!location.hash || location.hash === '#/') location.hash = Store.s.current ? '#/home' : '#/who';
    this.render();
    if (!Platform.isApp && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  },
  applySettings() {
    const s = Store.s.settings, b = document.body;
    b.classList.remove('size-0', 'size-1', 'size-2', 'size-3'); b.classList.add('size-' + (s.vision ? Math.max(2, s.size) : s.size));
    b.classList.toggle('contrast', !!s.contrast); b.classList.toggle('easy', !!s.easyRead);
    b.classList.toggle('motion-off', !!s.reduceMotion); b.classList.toggle('hearing', !!s.hearing); b.classList.toggle('vision', !!s.vision);
    document.documentElement.lang = I18N.ui();
  },
  render() {
    Speech.stop(); this.stopLessonTimer();
    if ($('.class-slide')) { $$('.class-slide').forEach(e => e.remove()); Platform.keepAwake(false); }
    if (!$('#modal').hidden) { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
    const parts = (location.hash.replace(/^#\/?/, '') || 'home').split('/');
    this.route = parts[0]; this.params = parts.slice(1).map(decodeURIComponent);
    const main = $('#main'); main.innerHTML = ''; window.scrollTo(0, 0);
    document.body.classList.remove('hide-nav');
    const screen = Screens[this.route] || Screens.home;
    if (!['welcome', 'who'].includes(this.route) && !Store.s.current && !Store.s.guest && this.route !== 'teacher') { location.replace('#/who'); return; }
    const title = screen.call(Screens, main, ...this.params);
    this.topbar(title);
    this.nav();
    const h1 = main.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); setTimeout(() => h1.focus({ preventScroll: true }), 40); }
    if ((Store.s.settings.autoRead || Store.s.settings.vision) && !['thuso', 'quiz', 'practice'].includes(this.route)) setTimeout(readMain, 500);
  },
  topbar(title) {
    const tb = $('#topbar'); tb.innerHTML = '';
    const root = ['home', 'who', 'welcome'].includes(this.route);
    if (!root) tb.appendChild(h('button', { class: 'tb-btn', 'aria-label': T('back'), onclick: () => history.length > 1 ? history.back() : go('home') }, icon('back')));
    tb.appendChild(h('div', { class: 'title' }, root ? svgEl(LOGO) : null, h('span', {}, title || 'Leseli')));
    if (this.route === 'welcome') return;
    const read = h('button', { class: 'tb-btn', 'aria-label': T('readAloud'), 'aria-pressed': 'false' }, icon('speaker'));
    read.onclick = () => { if (Speech.speaking) Speech.stop(); else { readMain(); Store.log('tts', { page: this.route }); } };
    Speech.onState = on => read.setAttribute('aria-pressed', on ? 'true' : 'false');
