<!DOCTYPE html>
<html lang="st">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2e7a">
<meta name="description" content="Leseli – offline learning for Grades 5–7 in Sesotho and English, made with Moshoeshoe II Primary School, Maseru">
<title>Leseli · Ithute</title>
<style>
/* Leseli – styles. Mobile first (designed on a 360×640 screen), no web fonts (offline),
   big touch targets (≥ 48px), works with TalkBack, high-contrast and large-text modes. */
:root {
  --blue: #0b2e7a; --blue2: #1f4fb5; --green: #00804a; --green2: #e3f4ea; --gold: #f6b73c; --gold2: #fff3d6;
  --red: #b3261e; --red2: #fde8e6; --ink: #1d1b16; --ink2: #555046; --line: #e4dccb; --bg: #fbf6ec; --card: #fff;
  --radius: 16px; --shadow: 0 1px 2px rgba(60, 40, 0, .08), 0 4px 14px rgba(60, 40, 0, .06);
  --fs: 17px; --gap: 14px;
  --c-maths: #1f4fb5; --c-science: #00804a; --c-english: #7b3fb0; --c-sesotho: #c0561a; --c-social: #0f7c8c; --c-creative: #c2366b;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--fs)/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Arial, sans-serif;
  padding-bottom: calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; overflow-x: hidden;
}
body.size-2 { --fs: 20px; } body.size-3 { --fs: 23px; } body.size-0 { --fs: 15px; }
body.easy { letter-spacing: .03em; word-spacing: .12em; line-height: 1.8; }
body.easy p, body.easy li { max-width: 34em; }
body.contrast { --bg: #000; --card: #000; --ink: #fff; --ink2: #f2f2f2; --line: #fff; --blue: #ffd84a; --blue2: #ffd84a; --green: #6dff9c; --green2: #003316; --red: #ff8a80; --red2: #3a0000; --gold: #ffd84a; --gold2: #222; --shadow: none; }
body.contrast .card, body.contrast .tile, body.contrast .btn { border: 2px solid #fff; }
body.contrast #topbar { background: #000; border-bottom: 2px solid #ffd84a; }
body.contrast .btn.primary { background: #ffd84a; color: #000; }
body.motion-off *, body.motion-off *::before, body.motion-off *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
a { color: var(--blue2); }
h1, h2, h3 { line-height: 1.25; margin: .2em 0 .5em; }
h1 { font-size: 1.45em; } h2 { font-size: 1.2em; } h3 { font-size: 1.05em; }
p { margin: .4em 0 .8em; }
button, input, select, textarea { font: inherit; color: inherit; }
.skip { position: absolute; left: -999px; top: 0; background: var(--gold); padding: 10px; z-index: 99; }
.skip:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { flex: none; vertical-align: middle; }

/* ---------- top bar ---------- */
#topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 8px 8px 10px; padding-top: calc(8px + env(safe-area-inset-top));
  background: var(--blue); color: #fff; min-height: 60px;
}
#topbar::after { /* seshoeshoe / blanket stripe */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--gold) 0 14px, #fff 14px 18px, var(--green) 18px 32px, #fff 32px 36px);
}
#topbar .title { flex: 1; font-weight: 700; font-size: 1.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
#topbar .title svg { width: 34px; height: 34px; }
.tb-btn { background: rgba(255, 255, 255, .12); border: 0; color: inherit; min-width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; cursor: pointer; font-weight: 700; font-size: .85em; }
.tb-btn[aria-pressed="true"] { background: var(--gold); color: #1d1b16; }
body.contrast .tb-btn { color: #ffd84a; border: 1px solid #ffd84a; }

/* ---------- bottom navigation ---------- */
#bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -2px 12px rgba(0, 0, 0, .06); }
#bottomnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 8px; text-decoration: none; color: var(--ink2); font-size: .72em; font-weight: 600; min-height: 60px; }
#bottomnav a[aria-current="page"] { color: var(--blue); }
#bottomnav a[aria-current="page"] .ic { background: var(--gold2); border-radius: 12px; padding: 2px 10px; width: 46px; }
body.hide-nav #bottomnav { display: none; } body.hide-nav { padding-bottom: 0; }

main { padding: var(--gap); max-width: 760px; margin: 0 auto; outline: none; }
main > h1:first-child { margin-top: 4px; }

/* ---------- cards / tiles / buttons ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 0 0 var(--gap); border: 1px solid var(--line); }
.card.flat { box-shadow: none; }
.card h2:first-child, .card h3:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-height: 120px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); cursor: pointer; position: relative; overflow: hidden; }
.tile .tile-ic { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; }
.tile b { font-size: 1em; line-height: 1.2; }
.tile small { color: var(--ink2); font-size: .78em; line-height: 1.3; }
.tile .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--line); }
.tile .bar i { display: block; height: 100%; background: var(--green); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.good { background: var(--green); border-color: var(--green); color: #fff; }
.btn.warn { background: var(--red2); border-color: var(--red); color: var(--red); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1d1b16; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: .88em; border-radius: 12px; }
.btn.block { display: flex; width: 100%; }
.btn:disabled { opacity: .5; }
.btn:active { transform: translateY(1px); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; } .row.center { justify-content: center; }
.stack > * + * { margin-top: 10px; }
.muted { color: var(--ink2); } .small { font-size: .86em; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; background: var(--gold2); color: #6b4a00; font-size: .78em; font-weight: 700; }
.pill.blue { background: #e4ebfb; color: var(--blue); } .pill.green { background: var(--green2); color: var(--green); } .pill.red { background: var(--red2); color: var(--red); }
body.contrast .pill { background: #000; color: #ffd84a; border: 1px solid #ffd84a; }
.hr { height: 1px; background: var(--line); margin: 14px 0; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 10px 14px; min-height: 46px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips button { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 8px 14px; min-height: 42px; font-weight: 700; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
input[type=text], input[type=search], input[type=number], input[type=password], input[type=tel], select, textarea {
  width: 100%; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); font-size: 1em;
}
textarea { min-height: 110px; }
label.field { display: block; font-weight: 700; margin: 10px 0 4px; }
input[type=range] { width: 100%; height: 36px; accent-color: var(--blue); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.switch:last-child { border-bottom: 0; }
.switch input { width: 26px; height: 26px; accent-color: var(--green); flex: none; }
.switch .ic { color: var(--blue); }

/* ---------- hero / home ---------- */
.hero { background: linear-gradient(135deg, var(--blue) 0%, #163f9c 100%); color: #fff; border-radius: 22px; padding: 18px; margin-bottom: var(--gap); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, rgba(246, 183, 60, .55), rgba(246, 183, 60, 0) 70%); }
.hero h1 { margin: 0 0 4px; font-size: 1.35em; }
.hero .stats { display: flex; gap: 16px; margin-top: 12px; font-weight: 700; }
.hero .stats span { display: flex; align-items: center; gap: 4px; }
.hero .stats .ic { color: var(--gold); }
body.contrast .hero { background: #000; border: 2px solid #ffd84a; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--gold2); display: inline-flex; align-items: center; justify-content: center; font-size: 30px; flex: none; border: 2px solid var(--gold); }
.avatar.big { width: 84px; height: 84px; font-size: 50px; }
.gradebar { display: flex; gap: 8px; margin: 0 0 var(--gap); }
.gradebar button { flex: 1; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-weight: 800; cursor: pointer; }
.gradebar button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1d1b16; }
.daily { display: flex; gap: 12px; align-items: flex-start; }
.daily .big-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--gold2); color: #8a5a00; display: flex; align-items: center; justify-content: center; flex: none; }

/* ---------- lesson list ---------- */
.lesson-item { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.lesson-item .num { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; flex: none; }
.lesson-item .num.done { background: var(--green) !important; }
.lesson-item .meta { flex: 1; min-width: 0; }
.lesson-item .meta b { display: block; line-height: 1.25; }
.lesson-item .meta small { color: var(--ink2); }
.stars { color: var(--gold); white-space: nowrap; letter-spacing: -2px; }

/* ---------- lesson reading ---------- */
.lesson-head { border-radius: 20px; color: #fff; padding: 16px; margin-bottom: var(--gap); }
.lesson-head h1 { margin: 6px 0 4px; }
.lesson-head .pill { background: rgba(255, 255, 255, .2); color: #fff; }
.tabs { display: flex; gap: 6px; margin: 0 0 var(--gap); position: sticky; top: 64px; z-index: 5; background: var(--bg); padding: 6px 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 8px 12px; min-height: 46px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.tabs button[aria-selected="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.section { position: relative; }
.section .sec-tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.bi .second { color: var(--ink2); border-left: 3px solid var(--line); padding-left: 10px; margin-top: 6px; font-size: .94em; }
.bi > :first-child { margin-bottom: 0; }
.reading { background: #fff2b8 !important; color: #1d1b16 !important; border-radius: 6px; box-shadow: 0 0 0 4px #fff2b8; }
body.contrast .reading { background: #ffd84a !important; color: #000 !important; box-shadow: 0 0 0 4px #ffd84a; }
.example { background: var(--gold2); border-radius: 14px; padding: 12px 14px; margin: 10px 0; border: 1px dashed #e0b45a; }
.example .lbl { font-weight: 800; color: #8a5a00; font-size: .85em; text-transform: uppercase; letter-spacing: .04em; }
.tip { background: var(--green2); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.hard-flag { display: flex; gap: 10px; align-items: center; background: #fff0f3; border: 1px solid #f3c2cf; color: #8a1f43; border-radius: 14px; padding: 10px 12px; margin-bottom: var(--gap); font-size: .9em; font-weight: 600; }
body.contrast .hard-flag, body.contrast .example, body.contrast .tip { background: #000; color: #fff; border: 2px solid #fff; }
pre.calc { font: 700 1.15em/1.35 ui-monospace, "Roboto Mono", "DejaVu Sans Mono", Menlo, monospace; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; margin: 8px 0; color: var(--blue); }
body.contrast pre.calc { background: #000; color: #ffd84a; }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.word { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; cursor: pointer; }
.word b { display: block; } .word span { color: var(--ink2); font-size: .9em; }
figure.fig { margin: 10px 0; text-align: center; }
figure.fig svg { max-width: 100%; height: auto; }
figure.fig figcaption { font-size: .85em; color: var(--ink2); }
code { background: #f0ebe0; padding: 1px 5px; border-radius: 6px; font-size: .95em; }

/* ---------- quiz ---------- */
.q-progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.q-progress i { display: block; height: 100%; background: var(--green); transition: width .3s; }
.q-text { font-size: 1.15em; font-weight: 700; }
.options { display: grid; gap: 10px; margin: 14px 0; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 58px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; }
.opt .letter { width: 36px; height: 36px; border-radius: 10px; background: #eef1f8; color: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.opt.right { border-color: var(--green); background: var(--green2); } .opt.right .letter { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red2); } .opt.wrong .letter { background: var(--red); color: #fff; }
.opt:disabled { cursor: default; opacity: 1; color: inherit; }
.feedback { border-radius: 16px; padding: 14px; margin: 10px 0; display: flex; gap: 12px; align-items: flex-start; font-weight: 600; }
.feedback.good { background: var(--green2); color: #00502e; } .feedback.bad { background: var(--red2); color: #7d1a14; }
body.contrast .feedback { background: #000; color: #fff; border: 2px solid #fff; }
.feedback .ic { width: 32px; height: 32px; flex: none; }
.result-big { text-align: center; padding: 18px 0; }
.result-big .score { font-size: 3em; font-weight: 900; color: var(--blue); line-height: 1; }
.result-big .stars { font-size: 2.2em; letter-spacing: 4px; }

/* number pad (big buttons: easier than the phone keyboard for small hands and for TalkBack) */
.answer-box { font: 800 1.8em/1 ui-monospace, monospace; min-height: 64px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--blue); border-radius: 16px; background: var(--card); margin: 10px 0; letter-spacing: .05em; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pad button { min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 1.35em; font-weight: 800; cursor: pointer; }
.pad button.ok { background: var(--green); color: #fff; border-color: var(--green); grid-row: span 2; }
.pad button.del { background: var(--red2); color: var(--red); }

/* ---------- Thuso chat ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 140px; }
.msg { max-width: 88%; padding: 12px 14px; border-radius: 18px; box-shadow: var(--shadow); }
.msg.me { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
.msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.bot .who { font-size: .76em; font-weight: 800; color: var(--green); display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.msg .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.msg ol.steps { padding-left: 1.3em; margin: 6px 0; } .msg ol.steps li { margin: 4px 0; }
.composer { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom)); background: var(--bg); padding: 8px 10px 10px; border-top: 1px solid var(--line); z-index: 15; }
.composer .inner { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
.composer input { flex: 1; border-radius: 99px; }
.composer .round { width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
.composer .round.mic { background: var(--green); }
.composer .round.on { background: var(--red); animation: pulse 1s infinite; }
.suggest { display: flex; gap: 8px; overflow-x: auto; max-width: 760px; margin: 0 auto 8px; scrollbar-width: none; }
.suggest button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: .85em; font-weight: 600; cursor: pointer; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(179, 38, 30, .15); } }
.rec-btn.on { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1s infinite; }

/* ---------- library / reader ---------- */
.book-cover { border-radius: 14px; padding: 14px; color: #fff; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden; text-decoration: none; }
.book-cover .emo { position: absolute; right: 10px; top: 8px; font-size: 44px; opacity: .95; }
.book-cover b { font-size: 1.02em; line-height: 1.2; }
.book-cover small { opacity: .9; }
.story-page { font-size: 1.12em; line-height: 1.75; }
.story-pic { font-size: 70px; text-align: center; line-height: 1.2; margin: 6px 0 10px; }
.dict-row { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.dict-row .w { flex: 1; } .dict-row .w b { display: block; } .dict-row .w span { color: var(--ink2); }
.dict-row .cat { font-size: .72em; }

/* ---------- tools / widgets ---------- */
.tool { background: var(--card); border: 2px solid #d9e2f6; border-radius: var(--radius); padding: 14px; margin: 12px 0; }
.tool > h3 { display: flex; gap: 8px; align-items: center; color: var(--blue); }
.tool svg { touch-action: none; }
.pv-table { width: 100%; border-collapse: separate; border-spacing: 4px; text-align: center; }
.pv-table th { font-size: .7em; color: var(--ink2); font-weight: 700; }
.pv-table td { font: 800 1.6em ui-monospace, monospace; background: #eef3fd; border-radius: 10px; padding: 8px 0; color: var(--blue); }
.fbar { display: flex; height: 40px; border: 2px solid var(--blue); border-radius: 8px; overflow: hidden; margin: 6px 0; }
.fbar i { flex: 1; border-right: 2px solid var(--blue); background: #fff; }
.fbar i:last-child { border-right: 0; } .fbar i.on { background: var(--gold); }
.tt-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; font-size: .74em; text-align: center; }
.tt-grid div { padding: 6px 0; border-radius: 4px; background: #f4f1e8; cursor: pointer; }
.tt-grid div.h { background: var(--blue); color: #fff; font-weight: 800; }
.tt-grid div.hl { background: var(--gold); font-weight: 800; }
.tt-grid div.sel { background: var(--green); color: #fff; font-weight: 800; }
.sym-grid { display: grid; gap: 2px; margin: 0 auto; max-width: 340px; }
.sym-grid div { aspect-ratio: 1; background: #f0ece2; border-radius: 3px; }
.sym-grid div.on { background: var(--blue); } .sym-grid div.mir { background: var(--gold); }
.sym-grid div.axis { box-shadow: inset 3px 0 0 var(--red); }
canvas.pad-canvas { width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; touch-action: none; display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.sort-card { font-size: 1.25em; text-align: center; padding: 18px; border-radius: 18px; background: var(--gold2); font-weight: 800; }
.sort-card .emo { font-size: 64px; display: block; line-height: 1.1; }
.slider-row { display: grid; grid-template-columns: 90px 1fr 54px; gap: 8px; align-items: center; }
.big-num { font-size: 2em; font-weight: 900; color: var(--blue); text-align: center; }
.step-list li { margin: 6px 0; padding: 6px 8px; border-radius: 8px; }

<script>

  addLessons(subjectId, list) {
    list.forEach((l, i) => {
      l.subject = subjectId; l.order = l.order ?? (this.bySubject[subjectId].length + i);
      this.lessons[l.id] = l;
      if (!this.bySubject[subjectId].includes(l.id)) this.bySubject[subjectId].push(l.id);
    });
  },
  subject(id) { return this.subjects.find(s => s.id === id); },
  lessonsOf(id) { return (this.bySubject[id] || []).map(x => this.lessons[x]); }

const Q = (qEn, qSt, o, a, xEn, xSt) => ({ q: L(qEn, qSt), o: o.map(v => Array.isArray(v) ? L(v[0], v[1]) : L(String(v), String(v))), a, x: xEn ? L(xEn, xSt) : null });
// typed numeric answer
const N = (qEn, qSt, n, xEn, xSt) => ({ q: L(qEn, qSt), n, x: xEn ? L(xEn, xSt) : null });
// true / false
const TF = (qEn, qSt, truth, xEn, xSt) => ({ q: L(qEn, qSt), o: [L('True', "Ke 'nete"), L('False', "Ha se 'nete")], a: truth ? 0 : 1, x: xEn ? L(xEn, xSt) : null });

/* ---------- DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  add(el, kids);
  return el;
}

    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));

}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* very small markup: **bold**, `code`, lines starting "- " become lists, blank line = new paragraph */
function rich(text) {
  const blocks = String(text).split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) {
      return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-•]\s+/, '')) + '</li>').join('') + '</ul>';
    }
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) {
      return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
    }
    return '<p>' + lines.map(inline).join('<br>') + '</p>';

  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?=[^*\w]|$)/g, '$1<i>$2</i>').replace(/`(.+?)`/g, '<code>$1</code>');

<script>
/* Local storage only. Nothing leaves the phone unless a teacher exports it.
   - localStorage: settings, learner nicknames, progress, anonymous usage events (for M&E)
   - IndexedDB: voice recordings (learner questions, teacher narration, voice feedback) */
'use strict';
const KEY = 'leseli.v1';
const DEFAULTS = () => ({
  settings: { lang: 'both', size: 1, contrast: false, easyRead: false, reduceMotion: false, vision: false, hearing: false,
    autoRead: false, rate: 0.9, voiceEn: '', voiceSt: '', firstRun: true },
  learners: [], current: null,
  progress: {},       // learnerId -> {lessons:{id:{read,best,attempts,stars,secs,tool}}, stars, days:[], badges:[], practice:{level,right,wrong}, stories:{}}
  checks: {},         // learnerId -> {baseline:{score,max,date,answers}, endline:{...}}
  events: [],         // {t, l, e, d} anonymous usage log
  feedback: [],       // {t,l,rating,easy,note,audio}
  reports: [],        // content mistake reports
  drawings: [],       // small data-URL thumbnails (capped)
  pin: null, packs: [], device: uid(),
  overrides: {},      // teacher corrections: lessonId -> {sections:{i:{h:{en,st},p:{en,st}}}, title}
  custom: [],         // lessons written by teachers on this phone (shareable as content packs)
  questions: [],      // learners' typed questions for the teacher {id,t,l,text,lesson,answered,reply}
  sus: [],            // teacher usability questionnaire results
  classLog: []        // class-mode sessions {t, lesson, mins, learners}
});
const Store = {
  s: null,
  load() {
    try { const raw = localStorage.getItem(KEY); this.s = raw ? Object.assign(DEFAULTS(), JSON.parse(raw)) : DEFAULTS(); }
    catch (e) { this.s = DEFAULTS(); }
    this.s.settings = Object.assign(DEFAULTS().settings, this.s.settings);
    return this.s;
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.s)); }
    catch (e) { // storage full: drop the oldest half of events and drawings and retry
      this.s.events = this.s.events.slice(-Math.floor(this.s.events.length / 2)); this.s.drawings = this.s.drawings.slice(-5);
      try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch (e2) { console.warn('storage full'); }
    }
  },
  set(k, v) { this.s.settings[k] = v; this.save(); },
  learner() { return this.s.learners.find(l => l.id === this.s.current) || null; },
  lid() { return this.s.current || 'guest'; },
  prog(lid) {
    lid = lid || this.lid();
    const p = this.s.progress[lid] || (this.s.progress[lid] = { lessons: {}, stars: 0, days: [], badges: [], practice: { level: 1, right: 0, wrong: 0 }, stories: {} });
    p.practice = p.practice || { level: 1, right: 0, wrong: 0 }; p.stories = p.stories || {};
    return p;
  },
  lesson(id, lid) { const p = this.prog(lid); return p.lessons[id] || (p.lessons[id] = { read: false, best: 0, attempts: 0, stars: 0, secs: 0, tool: false }); },
  addStars(n) { const p = this.prog(); p.stars += n; this.save(); },
  touchDay() { const p = this.prog(); const d = today(); if (!p.days.includes(d)) { p.days.push(d); if (p.days.length > 400) p.days.shift(); } },
  streak() {
    const days = new Set(this.prog().days); let n = 0; const d = new Date();
    while (days.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },
  log(e, d) {
    this.s.events.push({ t: Date.now(), l: this.lid(), e, d: d || null });
    if (this.s.events.length > 8000) this.s.events.splice(0, 1000);
    this.save();
  },
  addLearner(o) { const l = Object.assign({ id: uid(), created: Date.now(), code: 'L' + String(this.s.learners.length + 1).padStart(2, '0') }, o); this.s.learners.push(l); this.s.current = l.id; this.save(); return l; },
  removeLearner(id) { this.s.learners = this.s.learners.filter(l => l.id !== id); delete this.s.progress[id]; delete this.s.checks[id]; if (this.s.current === id) this.s.current = null; this.save(); },
  badge(id) { const p = this.prog(); if (!p.badges.includes(id)) { p.badges.push(id); this.save(); return true; } return false; }
};

/* ---------- IndexedDB for audio ---------- */
const AudioDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no indexedDB'));
      const r = indexedDB.open('leseli-audio', 1);
      r.onupgradeneeded = () => { const s = r.result.createObjectStore('clips', { keyPath: 'id' }); s.createIndex('kind', 'kind'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('clips', mode); const st = t.objectStore('clips'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); });
  },
  put(rec) { rec.id = rec.id || uid(); rec.created = rec.created || Date.now(); return this.tx('readwrite', st => st.put(rec)).then(() => rec); },
  get(id) { return this.tx('readonly', st => st.get(id)); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
  async all(kind) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const out = []; const t = db.transaction('clips', 'readonly'); const st = t.objectStore('clips');
      const req = kind ? st.index('kind').openCursor(IDBKeyRange.only(kind)) : st.openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out.push(c.value); c.continue(); } else res(out.sort((a, b) => b.created - a.created)); };
      req.onerror = () => rej(req.error);
    });
  },
  /* teacher narration lookup: key = lessonId + ':' + sectionIndex + ':' + lang */
  narration(key) { return this.all('narration').then(list => list.find(r => r.key === key) || null).catch(() => null); }
};

<script>
/* Leseli – voice: read-aloud (text-to-speech), listening (speech-to-text) and voice recording.
   Works three ways:
   1. Inside the Leseli Android app  -> uses the phone's own TextToSpeech + SpeechRecognizer
      through the bridge object window.LeseliNative (see android/.../LeseliBridge.java).
   2. In Chrome on Android / any browser -> Web Speech API.
   3. Nothing available -> buttons explain this politely; teachers can record their own voice.
   Sesotho voices are rare on phones. When there is none we use the closest-sounding voice
   (Swahili, Zulu, Xhosa, Setswana...) and re-spell Lesotho orthography the way it is spoken
   (li -> di, ea -> ya, oa -> wa, tš -> tsh) so the words come out much closer to real Sesotho. */
'use strict';

const Native = window.LeseliNative || null;   // injected by the Android app
const Platform = {
  isApp: !!Native,
  vibrate(p) { try { if (Native && Native.vibrate) Native.vibrate(Array.isArray(p) ? p[0] : p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} },
  keepAwake(on) { try { if (Native && Native.keepScreenOn) Native.keepScreenOn(!!on); else if (on && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { Platform._lock = l; }).catch(() => {}); else if (!on && Platform._lock) { Platform._lock.release(); Platform._lock = null; } } catch (e) {} },
  /* share or save a text file (CSV reports, content packs, corrections) */
  async shareText(filename, text, mime) {
    mime = mime || 'text/plain';
    if (Native && Native.shareText) { Native.shareText(filename, text, mime); return true; }
    try {
      const file = new File([text], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: mime })), download: filename });
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  },
  async shareBlob(filename, blob) {
    if (Native && Native.shareBase64) { const b64 = await blobToB64(blob); Native.shareBase64(filename, blob.type || 'application/octet-stream', b64); return; }
    try { const f = new File([blob], filename, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] }); } catch (e) {}
    const a = h('a', { href: URL.createObjectURL(blob), download: filename }); document.body.appendChild(a); a.click(); a.remove();
  },
  shareApp() { if (Native && Native.shareApp) Native.shareApp(); },
  version() { try { return Native && Native.appVersion ? Native.appVersion() : 'web'; } catch (e) { return 'web'; } }
};
function blobToB64(blob) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); }); }

/* ---------- Sesotho pronunciation helper ---------- */
function sesothoSay(text) {
  return String(text)
    .replace(/[‘’`']/g, '')
    .replace(/tš/gi, 'tsh').replace(/š/gi, 'sh')
    .replace(/\bl(?=[iu])/gi, 'd').replace(/([aeiou\s])l(?=[iu])/gi, '$1d')    // li, lu -> di, du
    .replace(/ea/gi, 'ya').replace(/oa/gi, 'wa').replace(/oe/gi, 'we').replace(/ue/gi, 'we')
    .replace(/\bo(?=[aeiu])/gi, 'w');
}

const Speech = {
  queue: [], token: 0, speaking: false, onState: null, nativeCb: {},
  voices: [],
  /* language order to try for each content language */
  prefs: { st: ['st', 'st-ZA', 'st-LS', 'sw', 'zu', 'xh', 'tn', 'nso', 'en-ZA', 'en'], en: ['en-ZA', 'en-GB', 'en-US', 'en'] },
  init() {
    if ('speechSynthesis' in window) {
      const load = () => { this.voices = speechSynthesis.getVoices() || []; };
      load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
    }
    window.LeseliBridge = window.LeseliBridge || {};
    window.LeseliBridge.onSpeech = (id, ev) => { const cb = this.nativeCb[id]; if (cb && (ev === 'done' || ev === 'error')) { delete this.nativeCb[id]; cb(ev); } };
  },
  available() { return !!(Native && Native.speak) || 'speechSynthesis' in window; },
  /* which real voice will be used for Sesotho: 'st' (true Sesotho), other code (stand-in), or null */
  stVoiceInfo() {
    if (Native && Native.bestLang) { try { return Native.bestLang(JSON.stringify(this.prefs.st)); } catch (e) {} }
    const v = this.pickVoice('st'); return v ? v.lang : null;
  },
  pickVoice(lang) {
    const want = Store.s.settings[lang === 'en' ? 'voiceEn' : 'voiceSt'];
    if (want) { const v = this.voices.find(v => v.name === want); if (v) return v; }
    for (const code of this.prefs[lang] || this.prefs.en) {
      const c = code.toLowerCase();
      const v = this.voices.find(v => v.lang.toLowerCase().replace('_', '-') === c) || this.voices.find(v => v.lang.toLowerCase().startsWith(c.split('-')[0] + (c.includes('-') ? '-' : '')));
      if (v) return v;
    }
    return this.voices[0] || null;
  },
  /* speak a list of {text, lang, el} chunks in order, highlighting each element */
  speakChunks(chunks, opts) {
    this.stop();
    if (!this.available()) { toast(T('noVoice')); return; }
    const my = ++this.token; this.speaking = true; this.onState && this.onState(true);
    let i = 0;
    const nextOne = () => {
      if (my !== this.token) return;
      $$('.reading').forEach(e => e.classList.remove('reading'));
      if (i >= chunks.length) { this.speaking = false; this.onState && this.onState(false); opts && opts.onEnd && opts.onEnd(); return; }
      const c = chunks[i++];
      if (c.el) { c.el.classList.add('reading'); try { c.el.scrollIntoView({ block: 'center', behavior: Store.s.settings.reduceMotion ? 'auto' : 'smooth' }); } catch (e) {} }
      this._one(c.text, c.lang || 'en', nextOne);
    };
    nextOne();
  },
  say(text, lang, onEnd) { this.speakChunks(splitSentences(text).map(t => ({ text: t, lang })), { onEnd }); },
  _one(text, lang, done) {
    const st = lang === 'st';
    const rate = Store.s.settings.rate || 0.9;
    if (Native && Native.speak) {
      const id = 'u' + uid();
      this.nativeCb[id] = () => done();
      const sayText = st && !(Native.hasTrueSesotho && Native.hasTrueSesotho()) ? sesothoSay(text) : text;
      try { Native.speak(sayText, JSON.stringify(this.prefs[st ? 'st' : 'en']), rate, id); } catch (e) { done(); }
      return;
    }
    try {
      const u = new SpeechSynthesisUtterance();
      const v = this.pickVoice(st ? 'st' : 'en');
      const trueSt = v && /^st/i.test(v.lang);
      u.text = st && !trueSt ? sesothoSay(text) : text;
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = rate; u.pitch = 1;
      let finished = false; const fin = () => { if (!finished) { finished = true; done(); } };
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      // Android Chrome sometimes never fires onend: guard with a timer based on length
      setTimeout(fin, 1500 + text.length * 110 / rate);
    } catch (e) { done(); }
  },
  stop() {
    this.token++; this.speaking = false;
    try { if (Native && Native.stop) Native.stop(); else if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    $$('.reading').forEach(e => e.classList.remove('reading'));
    Player.stop();
    this.onState && this.onState(false);
  },

  /* ---------- listening (speech to text) ---------- */
  canListen() { return !!(Native && Native.listen) || !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  listen(lang) {
    return new Promise((resolve, reject) => {
      if (Native && Native.listen) {
        window.LeseliBridge.onListen = (text, err) => err ? reject(new Error(err)) : resolve(text || '');
        try { Native.listen(lang === 'st' ? 'st-ZA' : 'en-ZA'); } catch (e) { reject(e); }
        return;
      }
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) return reject(new Error('unsupported'));
      const r = new R(); r.lang = lang === 'st' ? 'st-ZA' : 'en-ZA'; r.interimResults = false; r.maxAlternatives = 1;
      let got = false;
      r.onresult = e => { got = true; resolve(e.results[0][0].transcript); };
      r.onerror = e => reject(new Error(e.error || 'error'));
      r.onend = () => { if (!got) reject(new Error('no-speech')); };
      try { r.start(); } catch (e) { reject(e); }
    });
  }
};

/* ---------- recording voice (questions for the teacher, teacher narration, feedback) ---------- */
const Recorder = {
  rec: null, chunks: [], stream: null, started: 0,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async start() {
    Speech.stop();
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    this.rec = new MediaRecorder(this.stream, type ? { mimeType: type, audioBitsPerSecond: 24000 } : undefined);
    this.chunks = []; this.started = Date.now();
    this.rec.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.start();
  },
  stop() {
    return new Promise(res => {
      if (!this.rec) return res(null);
      this.rec.onstop = () => {
        const blob = new Blob(this.chunks, { type: this.rec.mimeType || 'audio/webm' });
        const secs = Math.round((Date.now() - this.started) / 1000);
        this.stream.getTracks().forEach(t => t.stop()); this.rec = null; this.stream = null;
        res({ blob, secs });
      };
      this.rec.stop();
    });
  }
};

/* a single shared audio player for recordings */
const Player = {
  a: null, url: null,
  play(blob, onEnd) {
    this.stop();
    this.url = URL.createObjectURL(blob); this.a = new Audio(this.url);
    this.a.onended = () => { this.stop(); onEnd && onEnd(); };
    this.a.play().catch(() => { onEnd && onEnd(); });
  },
  stop() { if (this.a) { try { this.a.pause(); } catch (e) {} this.a = null; } if (this.url) { URL.revokeObjectURL(this.url); this.url = null; } }
};

/* A record button widget. onSaved({blob,secs}) */
function recordButton(labelKey, onSaved, opts) {
  opts = opts || {};
  const b = h('button', { class: 'btn rec-btn ' + (opts.cls || ''), type: 'button' }, icon('mic'), h('span', {}, T(labelKey)));
  let on = false, timer = null;
  b.addEventListener('click', async () => {
    if (!Recorder.supported()) { toast(T('noRecord')); return; }
    if (!on) {
      try { await Recorder.start(); } catch (e) { toast(T('micBlocked')); return; }
      on = true; b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
      const t0 = Date.now(); const span = b.querySelector('span');
      timer = setInterval(() => { span.textContent = T('recording') + ' ' + Math.round((Date.now() - t0) / 1000) + 's'; if (Date.now() - t0 > (opts.max || 90) * 1000) b.click(); }, 500);
      Platform.vibrate(40);
    } else {
      clearInterval(timer); on = false; b.classList.remove('on'); b.setAttribute('aria-pressed', 'false');
      b.querySelector('span').textContent = T(labelKey);
      const r = await Recorder.stop(); Platform.vibrate([30, 60, 30]);
      if (r && r.blob.size > 500) onSaved(r);
    }
  });
  return b;
}

<script>
/* Leseli – worked maths solutions, shown step by step in Sesotho and English.
   Learners at Moshoeshoe II told us long division ("car method"/bus stop), multiplication,
   addition, subtraction, multiples and angles are hard. Every function here returns
   { answer, steps:[{en,st}], layout:"monospace drawing" } so Thuso and the practice screens can
   show HOW, not just the answer. Pure functions, no DOM, easy to test (see tools/test-math.js). */
'use strict';

const MS = (() => {
  const P = (en, st) => ({ en, st });
  const places = [P('ones', 'bonngoe'), P('tens', 'mashome'), P('hundreds', 'makholo'), P('thousands', 'likete'), P('ten thousands', 'mashome a likete'), P('hundred thousands', 'makholo a likete'), P('millions', 'limilione')];
  const pad = (s, n) => String(s).padStart(n, ' ');
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);

  function add(a, b) {
    const A = String(a), B = String(b), n = Math.max(A.length, B.length) + 1;
    const da = A.padStart(n, '0').split('').map(Number), db = B.padStart(n, '0').split('').map(Number);
    const res = Array(n).fill(0), carry = Array(n).fill(0); const steps = [];
    let c = 0;
    for (let i = n - 1; i >= 0; i--) {
      const s = da[i] + db[i] + c;
      if (i < n - 1 || s) {
        const pl = places[n - 1 - i] || P('next', 'e latelang');
        if (da[i] || db[i] || c) steps.push(P(
          `${pl.en[0].toUpperCase() + pl.en.slice(1)}: ${da[i]} + ${db[i]}${c ? ' + ' + c + ' (carried)' : ''} = ${s}. Write ${s % 10}${s >= 10 ? ', carry ' + Math.floor(s / 10) + ' to the next column' : ''}.`,
          `Kholomo ea ${pl.st}: ${da[i]} + ${db[i]}${c ? ' + ' + c + ' (e fetisitsoeng)' : ''} = ${s}. Ngola ${s % 10}${s >= 10 ? ', u fetisetse ' + Math.floor(s / 10) + ' kholomong e latelang' : ''}.`));
      }
      res[i] = s % 10; c = Math.floor(s / 10); if (i > 0) carry[i - 1] = c;
    }
    const ans = a + b, w = String(ans).length + 2;
    const layout = [pad(carry.map(x => x ? x : ' ').join('').replace(/^\s+/, m => m), w) + '  ← ' + 'carry', pad(A, w), '+' + pad(B, w - 1), '-'.repeat(w), pad(ans, w)].join('\n');
    steps.push(P(`So ${fmt(a)} + ${fmt(b)} = ${fmt(ans)}.`, `Kahoo ${fmt(a)} + ${fmt(b)} = ${fmt(ans)}.`));
    return { answer: ans, steps, layout };
  }

  function sub(a, b) {
    if (b > a) { const r = sub(b, a); r.answer = -r.answer; r.steps.unshift(P(`${b} is bigger than ${a}, so the answer will be negative. Work out ${b} − ${a} first.`, `${b} e kholo ho feta ${a}, kahoo karabo e tla ba ka tlase ho 0. Qala ka ${b} − ${a}.`)); return r; }
    const A = String(a), n = A.length; const top = A.split('').map(Number), bot = String(b).padStart(n, '0').split('').map(Number);
    const steps = [];
    for (let i = n - 1; i >= 0; i--) {
      const pl = places[n - 1 - i];
      if (top[i] < bot[i]) {
        let j = i - 1; while (top[j] === 0) j--;
        steps.push(P(`${pl.en}: ${top[i]} is smaller than ${bot[i]}, so borrow 1 ${places[n - 1 - j].en.replace(/s$/, '')} from the left. ${top[i]} becomes ${top[i] + 10}.`,
          `${pl.st}: ${top[i]} e nyane ho ${bot[i]}, kahoo alima 1 ho tsoa kholomong e ka letsohong le letšehali. ${top[i]} e fetoha ${top[i] + 10}.`));
        top[j]--; for (let k = j + 1; k < i; k++) top[k] = 9; top[i] += 10;
      }
      const d = top[i] - bot[i];

  function mul(a, b) {

{ id: 'm5-place', grade: 5, outcome: 'LO 3, 13', title: L(`Place value and rounding (5-digit numbers)`, `Boleng ba sebaka le ho potoloha (linomoro tsa lidijithi tse 5)`),
  sections: [
    S(`Every digit has a place`, `Nomoro e 'ngoe le e 'ngoe e na le sebaka`,
      `In **47 305** each digit has a value that depends on its place:\n- 4 is in the **ten thousands** place → 40 000\n- 7 is in the **thousands** place → 7 000\n- 3 is in the **hundreds** place → 300\n- 0 is in the **tens** place → 0\n- 5 is in the **ones** place → 5\n\nSo 47 305 = 40 000 + 7 000 + 300 + 5. We write a space between groups of three digits to make big numbers easy to read.`,
      `Ho **47 305** dijithi e 'ngoe le e 'ngoe e na le boleng bo itšetlehileng ka sebaka sa eona:\n- 4 e sebakeng sa **mashome a likete** → 40 000\n- 7 e sebakeng sa **likete** → 7 000\n- 3 e sebakeng sa **makholo** → 300\n- 0 e sebakeng sa **mashome** → 0\n- 5 e sebakeng sa **bonngoe** → 5\n\nKahoo 47 305 = 40 000 + 7 000 + 300 + 5. Re siea sebaka pakeng tsa lihlopha tsa lidijithi tse tharo hore linomoro tse kholo li balehe habonolo.`,
      { tool: 'placevalue' }),
    S(`Rounding to the nearest 1 000`, `Ho potoloha ho 1 000 e haufi`,
      `Rounding gives a number that is easy to say, like "about 46 000 people".\n1. Find the thousands digit.\n2. Look at the digit just to its right (the hundreds).\n3. If it is **5 or more**, round **up**. If it is **less than 5**, round **down**.`,
      `Ho potoloha ho re fa nomoro e bonolo ho e bua, joaloka "batho ba ka bang 46 000".\n1. Fumana dijithi ea likete.\n2. Sheba dijithi e ka letsohong le letona ho eona (makholo).\n3. Haeba e le **5 kapa ho feta**, potoloha **holimo**. Haeba e le **ka tlase ho 5**, potoloha **tlase**.`,
      { calc: 'round 45678 to nearest 1000', tip: L(`The Maseru District has about 519 000 people – that is a rounded number!`, `Setereke sa Maseru se na le batho ba ka bang 519 000 – ena ke nomoro e potolohisitsoeng!`) })
  ],
  words: [['digit', 'dijithi'], ['place value', 'boleng ba sebaka'], ['thousands', 'likete'], ['hundreds', 'makholo'], ['round off', 'potoloha'], ['about', 'ka bang']],
  quiz: [

    Q(`Which number is 60 000 + 3 000 + 40 + 2?`, `Ke nomoro efe e leng 60 000 + 3 000 + 40 + 2?`, ['63 042', '63 420', '6 342', '60 342'], 0),

{ id: 'm5-addsub', grade: 5, outcome: 'LO 4, 5', hard: true, title: L(`Adding and subtracting big numbers`, `Ho kopanya le ho tlosa linomoro tse kholo`),
  sections: [
    S(`Adding with carrying`, `Ho kopanya ka ho fetisetsa`,
      `Write the numbers in columns, ones under ones. Start from the **right** (the ones).\nIf a column adds up to 10 or more, write the ones digit and **carry** the tens digit to the next column on the left.`,
      `Ngola linomoro ka likholomo, bonngoe ka tlas'a bonngoe. Qala ka ho le **letona** (bonngoe).\nHaeba kholomo e kopana ho ba 10 kapa ho feta, ngola dijithi ea bonngoe 'me u **fetisetse** dijithi ea mashome kholomong e latelang ka letsohong le letšehali.`,
      { calc: '4587 + 9765', tool: 'stepper', toolOpts: { op: '+' } }),
    S(`Subtracting with borrowing`, `Ho tlosa ka ho alima`,
      `Start from the ones. If the top digit is **smaller** than the bottom digit, **borrow** 1 from the column on the left: it becomes 10 more in your column.\nAlways check: answer + the number you took away = the number you started with.`,
      `Qala ka bonngoe. Haeba dijithi e ka holimo e **nyane** ho e ka tlase, **alima** 1 kholomong e ka letsohong le letšehali: e fetoha 10 e eketsehileng kholomong ea hau.\nKamehla hlahloba: karabo + nomoro eo u e tlositseng = nomoro eo u qalileng ka eona.`,
      { calc: '50213 - 1789', tool: 'stepper', toolOpts: { op: '−' } }),
    S(`Using it in real life`, `Ho e sebelisa bophelong`,
      `A farmer in Mafeteng sold 12 450 kg of maize in May and 9 875 kg in June. Total = 12 450 + 9 875 = **22 325 kg**. Difference = 12 450 − 9 875 = **2 575 kg** more in May.`,
      `Sehoai sa Mafeteng se rekisitse poone ea 12 450 kg ka Motšeanong le 9 875 kg ka Phupjane. Kakaretso = 12 450 + 9 875 = **22 325 kg**. Phapang = 12 450 − 9 875 = **2 575 kg** e fetang ka Motšeanong.`)
  ],
  words: [['add', 'kopanya'], ['subtract', 'tlosa'], ['carry', 'fetisetsa'], ['borrow', 'alima'], ['total', 'kakaretso'], ['difference', 'phapang'], ['column', 'kholomo']],
  quiz: [
    N(`34 256 + 12 589 = ?`, `34 256 + 12 589 = ?`, 46845),
    N(`50 000 − 1 234 = ?`, `50 000 − 1 234 = ?`, 48766, `Borrow across the zeros: 50 000 → 4 9 9 9 10.`, `Alima ho feta li-zero: 50 000 → 4 9 9 9 10.`),
    N(`8 795 + 6 405 = ?`, `8 795 + 6 405 = ?`, 15200),
    Q(`When must you borrow?`, `U tlameha ho alima neng?`, [[`When the top digit is smaller than the bottom digit`, `Ha dijithi e ka holimo e le nyane ho e ka tlase`], [`When the answer is big`, `Ha karabo e le kholo`], [`Always`, `Kamehla`], [`Never`, `Le ka mohla`]], 0),

  ], practice: 'add', ask: ['4587 + 9765', '50213 - 1789'] },

{ id: 'm5-mult', grade: 5, outcome: 'LO 21, 22, 24', hard: true, title: L(`Multiplication and multiples`, `Ho atisa le liatiso (multiples)`),
  sections: [
    S(`Multiplication is fast adding`, `Ho atisa ke ho kopanya ka potlako`,
      `4 × 6 means 4 groups of 6: 6 + 6 + 6 + 6 = 24. Learning the **times tables** up to 10 × 10 makes everything faster. Tap the table below to explore.`,
      `4 × 6 e bolela lihlopha tse 4 tsa 6: 6 + 6 + 6 + 6 = 24. Ho ithuta **litafole tsa ho atisa** ho fihlela ho 10 × 10 ho etsa hore tsohle li potlake. Tobetsa tafole e ka tlase.`,
      { tool: 'timestable' }),
    S(`Multiples`, `Liatiso (multiples)`,
      `The **multiples** of a number are the answers in its times table. Multiples of 4: 4, 8, 12, 16, 20, 24 … Every multiple of 4 can be divided by 4 with nothing left over.\n**Tricks:** multiples of 2 end in 0, 2, 4, 6, 8. Multiples of 5 end in 0 or 5. Multiples of 10 end in 0.`,
      `**Liatiso** tsa nomoro ke likarabo tsa tafole ea eona ea ho atisa. Liatiso tsa 4: 4, 8, 12, 16, 20, 24 … Seatiso se seng le se seng sa 4 se ka aroloa ka 4 ho sa sale letho.\n**Maqheka:** liatiso tsa 2 li fela ka 0, 2, 4, 6, 8. Tsa 5 li fela ka 0 kapa 5. Tsa 10 li fela ka 0.`),
    S(`3-digit × 2-digit (long multiplication)`, `Dijithi tse 3 × dijithi tse 2`,
      `To work out 345 × 23:\n1. Multiply 345 by the **3 ones** → 1 035\n2. Multiply 345 by the **2 tens** (that is 20) → put a 0 first, then 345 × 2 = 690 → 6 900\n3. **Add** the two rows: 1 035 + 6 900 = 7 935`,
      `Ho fumana 345 × 23:\n1. Atisa 345 ka **bonngoe ba 3** → 1 035\n2. Atisa 345 ka **mashome a 2** (ke hore 20) → qala ka ho beha 0, ebe 345 × 2 = 690 → 6 900\n3. **Kopanya** mela e 'meli: 1 035 + 6 900 = 7 935`,
      { calc: '345 x 23', tool: 'stepper', toolOpts: { op: '×', a: 128, b: 34 } })
  ],
  words: [['multiply', 'atisa'], ['times table', 'tafole ea ho atisa'], ['multiple', 'seatiso'], ['product', 'sehlahisoa'], ['group', 'sehlopha']],
  quiz: [
    N(`7 × 8 = ?`, `7 × 8 = ?`, 56), N(`9 × 6 = ?`, `9 × 6 = ?`, 54), N(`345 × 23 = ?`, `345 × 23 = ?`, 7935),
    Q(`Which is a multiple of 6?`, `Ke efe e leng seatiso sa 6?`, ['32', '42', '26', '15'], 1, `6 × 7 = 42`, `6 × 7 = 42`),
    Q(`Which list shows multiples of 5?`, `Ke lethathamo lefe le bontšang liatiso tsa 5?`, ['5, 10, 15, 20', '5, 6, 7, 8', '1, 5, 25, 50', '10, 12, 14, 16'], 0),
    N(`A bus carries 48 learners. How many learners do 12 buses carry?`, `Bese e nka baithuti ba 48. Libese tse 12 li nka baithuti ba bakae?`, 576),
    N(`One exercise book costs M12. How much do 25 cost (in Maloti)?`, `Buka e le 'ngoe ea ho ngolla e bitsa M12. Tse 25 li bitsa bokae (ka Maloti)?`, 300)
  ], practice: 'mul', ask: ['345 x 23', 'multiples of 7'] },

{ id: 'm5-div', grade: 5, outcome: 'LO 24', hard: true, title: L(`Long division (the "bus stop" / car method)`, `Ho arola ho holoanyane (mokhoa oa "bus stop")`),
  sections: [
    S(`Division shares equally`, `Ho arola ke ho abela ka ho lekana`,
      `24 ÷ 6 = 4 means: share 24 sweets equally among 6 children – each gets 4. Division is the **opposite of multiplication**: 6 × 4 = 24, so 24 ÷ 6 = 4.`,
      `24 ÷ 6 = 4 e bolela: abela lipompong tse 24 ka ho lekana ho bana ba 6 – e mong le e mong o fumana 4. Ho arola ke **ho fapana le ho atisa**: 6 × 4 = 24, kahoo 24 ÷ 6 = 4.`),
    S(`The bus stop steps`, `Mehato ea "bus stop"`,
      `Write the number being divided inside the "bus stop" and the divisor outside. Then repeat four steps for every digit, from the **left**:\n1. **Divide** – how many times does the divisor fit?\n2. **Multiply** – that number × the divisor\n3. **Subtract**\n4. **Bring down** the next digit\nA way to remember: **D**ad **M**um **S**ister **B**rother!`,
      `Ngola nomoro e aroloang ka hare ho "bus stop" 'me moaroli a be ka ntle. Ebe u pheta mehato e mene bakeng sa dijithi e 'ngoe le e 'ngoe, ho tloha ka **letšehali**:\n1. **Arola** – moaroli o kena ka makhetlo a makae?\n2. **Atisa** – nomoro eo × moaroli\n3. **Tlosa**\n4. **Theola** dijithi e latelang\nTsela ea ho hopola: **N**tate **M**'e **Ab**uti **Ou**si!`,
      { calc: '7452 / 6', tool: 'stepper', toolOpts: { op: '÷' } }),
    S(`Remainders`, `Se salang (remainder)`,
      `Sometimes something is left over. 25 ÷ 4 = 6 remainder 1, because 4 × 6 = 24 and 1 is left. In a story, think about what the remainder means: 25 learners, 4 per bench → 7 benches are needed (6 full + 1 more for the last learner).`,
      `Ka linako tse ling ho na le se salang. 25 ÷ 4 = 6 'me ho sala 1, hobane 4 × 6 = 24 'me ho sala 1. Paleng, nahana hore na se salang se bolela eng: baithuti ba 25, ba 4 bencheng ka 'ngoe → ho hlokahala libenche tse 7 (tse 6 tse tletseng + e le 'ngoe bakeng sa moithuti oa ho qetela).`,
      { calc: '625 / 4' })
  ],
  words: [['divide', 'arola'], ['share', 'abela'], ['remainder', 'se salang'], ['divisor', 'moaroli'], ['bring down', 'theola']],
  quiz: [
    N(`84 ÷ 4 = ?`, `84 ÷ 4 = ?`, 21), N(`7 452 ÷ 6 = ?`, `7 452 ÷ 6 = ?`, 1242), N(`625 ÷ 5 = ?`, `625 ÷ 5 = ?`, 125),
    Q(`What is 29 ÷ 4?`, `29 ÷ 4 ke bokae?`, [[`7 remainder 1`, `7, ho sala 1`], [`7`, `7`], [`6 remainder 5`, `6, ho sala 5`], [`8`, `8`]], 0),
    Q(`What is the first step of the bus stop method?`, `Mohato oa pele oa "bus stop" ke ofe?`, [[`Divide`, `Arola`], [`Subtract`, `Tlosa`], [`Bring down`, `Theola`], [`Add`, `Kopanya`]], 0),
    N(`M960 is shared equally by 8 friends. How many Maloti each?`, `M960 e abeloa metsoalle e 8 ka ho lekana. E mong le e mong o fumana Maloti a makae?`, 120),
    TF(`If 9 × 7 = 63 then 63 ÷ 7 = 9.`, `Haeba 9 × 7 = 63 joale 63 ÷ 7 = 9.`, true)
  ], practice: 'div', ask: ['7452 ÷ 6', '625 ÷ 4'] },

{ id: 'm5-fractions', grade: 5, outcome: 'LO 7, 8, 9, 23, 25, 26', title: L(`Fractions: equivalent, adding, subtracting, mixed`, `Likaroloana: tse lekanang, ho kopanya, ho tlosa, tse kopaneng`),
  sections: [
    S(`What is a fraction?`, `Karoloana ke eng?`,
      `A fraction is part of a whole. In **3/4** the bottom number (4) says the whole is cut into 4 equal parts; the top number (3) says we have 3 of them.`,
      `Karoloana ke karolo ea ntho e felletseng. Ho **3/4** nomoro e ka tlase (4) e re ntho e khaoletsoe likarolo tse 4 tse lekanang; nomoro e ka holimo (3) e re re na le tse 3 ho tsona.`),
    S(`Equivalent fractions`, `Likaroloana tse lekanang`,
      `1/2 = 2/4 = 4/8: the same amount, cut into more pieces. Multiply (or divide) the top **and** the bottom by the same number. Move the sliders to see it.`,
      `1/2 = 2/4 = 4/8: bongata bo tšoanang, bo khaoletsoe likotoana tse ngata. Atisa (kapa arola) holimo **le** tlase ka nomoro e tšoanang. Sutumetsa li-slider ho e bona.`,
      { tool: 'fractionbars' }),
    S(`Adding and subtracting fractions`, `Ho kopanya le ho tlosa likaroloana`,
      `If the bottom numbers are the **same**, add or subtract the tops only: 2/7 + 3/7 = 5/7.\nIf they are **different**, first make them the same with equivalent fractions: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.`,
      `Haeba linomoro tse ka tlase li **tšoana**, kopanya kapa tlosa tse ka holimo feela: 2/7 + 3/7 = 5/7.\nHaeba li **fapana**, pele li etse hore li tšoane ka likaroloana tse lekanang: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.`,
      { calc: '1/2 + 1/3' }),
    S(`Mixed numbers`, `Linomoro tse kopaneng`,
      `**2 1/2** means 2 wholes and a half. To add or subtract mixed numbers, change them to improper fractions (top bigger than bottom): 2 1/2 = 5/2. Then work as before and change back.`,
      `**2 1/2** e bolela tse peli tse felletseng le halofo. Ho kopanya kapa ho tlosa linomoro tse kopaneng, li fetole hore e be likaroloana tse holimo e leng kholo: 2 1/2 = 5/2. Ebe u sebetsa joalo ka pele 'me u li khutlise.`,
      { calc: '2 1/2 + 1 3/4' })
  ],
  words: [['fraction', 'karoloana'], ['half', 'halofo'], ['quarter', 'kotara'], ['equal parts', 'likarolo tse lekanang'], ['whole', 'e felletseng']],
  quiz: [
    Q(`Which fraction is equal to 1/2?`, `Ke karoloana efe e lekanang le 1/2?`, ['2/3', '3/6', '1/4', '2/5'], 1),
    N(`2/7 + 3/7 = ? (write like 5/7)`, `2/7 + 3/7 = ? (ngola joaloka 5/7)`, '5/7'),
    N(`1/2 + 1/4 = ?`, `1/2 + 1/4 = ?`, '3/4', `1/2 = 2/4, and 2/4 + 1/4 = 3/4`, `1/2 = 2/4, 'me 2/4 + 1/4 = 3/4`),
    N(`3/4 − 1/2 = ?`, `3/4 − 1/2 = ?`, '1/4'),
    Q(`2 1/2 + 1 3/4 = ?`, `2 1/2 + 1 3/4 = ?`, ['3 4/6', '4 1/4', '3 1/4', '4 3/4'], 1),
    Q(`Mother cuts a loaf into 8 equal slices. You eat 3. What fraction is left?`, `'Mè o khaola bohobe likarolo tse 8 tse lekanang. U ja tse 3. Ho sala karoloana efe?`, ['3/8', '5/8', '5/3', '8/5'], 1),
    N(`3 × 2/5 = ? (fraction times a whole number)`, `3 × 2/5 = ?`, '1 1/5', `3 × 2/5 = 6/5 = 1 1/5`, `3 × 2/5 = 6/5 = 1 1/5`)
  ], practice: 'frac', ask: ['1/2 + 1/3', '2 1/2 - 1 3/4'] },

{ id: 'm5-angles', grade: 5, outcome: 'LO 10, 11, 12', hard: true, title: L(`Angles, the protractor and triangles`, `Likhutlo, protractor le likhutlo-tharo`),
  sections: [
    S(`Kinds of angles`, `Mefuta ea likhutlo`,
      `An angle is the amount of **turn** between two lines that meet. We measure it in **degrees (°)** with a protractor.\n- **Acute**: less than 90°\n- **Right**: exactly 90° (the corner of a book)\n- **Obtuse**: between 90° and 180°\n- **Straight**: 180°\nDrag the green arm to try.`,
      `Sekhutlo ke boholo ba **ho reteleha** pakeng tsa mela e 'meli e kopanang. Re se lekanya ka **likhato (°)** ka protractor.\n- **Se sehloko**: ka tlase ho 90°\n- **Se tokileng**: 90° hantle (khutlo ea buka)\n- **Se setompo**: pakeng tsa 90° le 180°\n- **Se otlolohileng**: 180°\nHula letsoho le letala ho leka.`,
      { tool: 'angle' }),
    S(`Using a protractor`, `Ho sebelisa protractor`,
      `1. Put the centre point of the protractor exactly on the corner (vertex) of the angle.\n2. Line up the 0° line with one arm of the angle.\n3. Read the number where the other arm crosses the scale. Use the scale that starts at 0 on your arm!`,
      `1. Beha bohare ba protractor hantle khutlong ea sekhutlo.\n2. Lekanya mola oa 0° le letsoho le leng la sekhutlo.\n3. Bala nomoro moo letsoho le leng le tšelang sekala. Sebelisa sekala se qalang ka 0 letsohong la hau!`),
    S(`Angles in a triangle add up to 180°`, `Likhutlo tsa khutlo-tharo li kopana ho ba 180°`,
      `Cut out a paper triangle, tear off the three corners and put them together: they make a straight line, 180°. So if you know two angles, the third = 180° − (the other two).`,
      `Seha khutlo-tharo ka pampiri, khaola likhutlo tse tharo 'me u li kopanye: li etsa mola o otlolohileng, 180°. Kahoo haeba u tseba likhutlo tse peli, ea boraro = 180° − (tse ling tse peli).`,
      { calc: 'triangle 50 60', tool: 'triangle' })
  ],
  words: [['angle', 'sekhutlo'], ['degree', 'khato'], ['triangle', 'khutlo-tharo'], ['right angle', 'sekhutlo se tokileng'], ['measure', 'lekanya']],
  quiz: [
    Q(`An angle of 120° is…`, `Sekhutlo sa 120° ke…`, [['acute', 'se sehloko'], ['right', 'se tokileng'], ['obtuse', 'se setompo'], ['straight', 'se otlolohileng']], 2),
    Q(`An angle of 35° is…`, `Sekhutlo sa 35° ke…`, [['acute', 'se sehloko'], ['right', 'se tokileng'], ['obtuse', 'se setompo'], ['straight', 'se otlolohileng']], 0),
    N(`A triangle has angles 50° and 60°. The third angle is ? °`, `Khutlo-tharo e na le likhutlo tsa 50° le 60°. Sa boraro ke ? °`, 70),
    N(`A triangle has a right angle and an angle of 35°. The third angle is ? °`, `Khutlo-tharo e na le sekhutlo se tokileng le sa 35°. Sa boraro ke ? °`, 55),
    N(`The angles inside every triangle add up to ? °`, `Likhutlo ka hare ho khutlo-tharo e 'ngoe le e 'ngoe li kopana ho ba ? °`, 180),
    TF(`The corner of a page is a right angle (90°).`, `Khutlo ea leqephe ke sekhutlo se tokileng (90°).`, true)
  ], practice: 'angles' },

{ id: 'm5-sets', grade: 5, outcome: 'LO 1, 2', title: L(`Sets: intersection and union`, `Lihlopha (sets): ho kopana le kopano`),
  sections: [
    S(`What is a set?`, `Sete ke eng?`, `A **set** is a group of things, written in curly brackets: A = {Lerato, Thabo, Palesa}. The things in it are called **members** (elements).`, `**Sete** ke sehlopha sa lintho, se ngotsoeng ka masakaneng a kobehileng: A = {Lerato, Thabo, Palesa}. Lintho tse ho sona li bitsoa **litho**.`),
    S(`Intersection ∩ and union ∪`, `Intersection ∩ le union ∪`,
      `**A ∩ B** (intersection) = members that are in **both** sets.\n**A ∪ B** (union) = **all** members of A and B together, each written only once.\nIn the Venn diagram, the middle part where the circles overlap is A ∩ B.`,
      `**A ∩ B** (intersection) = litho tse ho li-sete **ka bobeli**.\n**A ∪ B** (union) = litho **tsohle** tsa A le B hammoho, e 'ngoe le e 'ngoe e ngoloa hang feela.\nSetšoantšong sa Venn, karolo e bohareng moo lidikadikoe li kopanang ke A ∩ B.`,
      { tool: 'venn' })
  ],
  words: [['set', 'sete'], ['member', 'setho'], ['both', 'ka bobeli'], ['all', 'tsohle']],
