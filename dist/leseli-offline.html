{ id: 'm5-money', grade: 5, outcome: 'LO 14, 27', title: L(`Money: Maloti and lisente`, `Chelete: Maloti le lisente`),
  sections: [
    S(`Our money`, `Chelete ea rona`, `Lesotho's money is the **Loti** (plural: **Maloti**, written M). 1 Loti = 100 **lisente** (s). M5.50 means 5 Maloti and 50 lisente. The South African Rand has the same value and is also used in Lesotho.`, `Chelete ea Lesotho ke **Loti** (bongata: **Maloti**, e ngoloa M). Loti e le 'ngoe = **lisente** tse 100. M5.50 e bolela Maloti a 5 le lisente tse 50. Rand ea Afrika Boroa e na le boleng bo tšoanang 'me e sebelisoa Lesotho.`),
    S(`Buying, multiplying and change`, `Ho reka, ho atisa le chelete e salang`,
      `If one item costs M14 and you buy 6: 6 × M14 = **M84**. If you pay with M100, your change is M100 − M84 = **M16**. Try the little shop!`,
      `Haeba ntho e le 'ngoe e bitsa M14 'me u reka tse 6: 6 × M14 = **M84**. Haeba u lefa ka M100, chelete e salang ke M100 − M84 = **M16**. Leka lebenkele le lenyenyane!`,
      { tool: 'shop' }),
    S(`Managing money`, `Ho laola chelete`, `Make a **budget**: write what money comes in and what goes out. Buy **needs** (food, school things) before **wants** (sweets). Save a little every week – many Basotho families save together in a **stokvel** (motšelo).`, `Etsa **tekanyetso**: ngola chelete e kenang le e tsoang. Reka **litlhoko** (lijo, lintho tsa sekolo) pele ho **litakatso** (lipompong). Boloka hanyane beke le beke – malapa a mangata a Basotho a bolokela hammoho ka **motšelo**.`)
  ],
  words: [['money', 'chelete'], ['price', 'theko'], ['change', 'chelete e salang'], ['buy', 'reka'], ['sell', 'rekisa'], ['save', 'boloka']],
  quiz: [
    N(`One loaf costs M15. How much do 4 loaves cost (Maloti)?`, `Bohobe bo le bong bo bitsa M15. Tse 4 li bitsa bokae (Maloti)?`, 60),
    N(`You pay M50 for something that costs M37. Your change is M?`, `U lefa M50 bakeng sa ntho e bitsang M37. Chelete e salang ke M?`, 13),
    N(`How many lisente are in M3?`, `Ho na le lisente tse kae ho M3?`, 300),
    Q(`Which is a NEED?`, `Ke efe e leng TLHOKO?`, [['school shoes', 'lieta tsa sekolo'], ['sweets', 'lipompong'], ['a toy', 'papadi'], ['cool drink', 'seno se tsoekere']], 0),
    N(`A pen costs M6. How many pens can you buy with M50, and how much is left? (number of pens)`, `Pene e bitsa M6. U ka reka lipene tse kae ka M50?`, 8, `50 ÷ 6 = 8 remainder 2, so 8 pens and M2 left.`, `50 ÷ 6 = 8 ho sala 2, kahoo lipene tse 8 'me ho sala M2.`)
  ], practice: 'money' },

{ id: 'm5-measure', grade: 5, outcome: 'LO 15, 16, 17, 18', title: L(`Measurement: length, volume and circles`, `Litekanyo: bolelele, volume le selikalikoe`),
  sections: [
    S(`Centimetres and metres`, `Lisentimitara le limitara`, `**1 m = 100 cm**. To change metres to centimetres, multiply by 100 (2 m = 200 cm). To change centimetres to metres, divide by 100 (350 cm = 3.5 m).`, `**1 m = 100 cm**. Ho fetola limitara hore e be lisentimitara, atisa ka 100 (2 m = 200 cm). Ho fetola lisentimitara hore e be limitara, arola ka 100 (350 cm = 3.5 m).`, { calc: '350 cm to m' }),
    S(`Volume of a cube and cuboid`, `Volume ea khube le khuboite`, `Volume is the **space** an object takes up. For a cuboid (box): **Volume = length × width × height**. A box 4 cm × 3 cm × 2 cm holds 24 small cubes of 1 cm³. Move the sliders.`, `Volume ke **sebaka** seo ntho e se nkang. Bakeng sa khuboite (lebokose): **Volume = bolelele × bophara × bophahamo**. Lebokose la 4 cm × 3 cm × 2 cm le tšoara likhube tse nyane tse 24 tsa 1 cm³. Sutumetsa li-slider.`, { tool: 'cuboid' }),
    S(`Circumference of a circle`, `Potoloho ea selikalikoe`, `The **circumference** is the distance all the way round a circle. **C = π × d**, where d is the diameter (across the middle) and π ≈ 3.14 or 22/7. The radius r is half the diameter.`, `**Potoloho** ke sebaka ho pota selikalikoe sohle. **C = π × d**, moo d e leng bophara (ho tšela bohareng) 'me π ≈ 3.14 kapa 22/7. Radius r ke halofo ea bophara.`, { calc: 'circumference radius 7', tool: 'circle' })
  ],
  words: [['length', 'bolelele'], ['width', 'bophara'], ['height', 'bophahamo'], ['circle', 'selikalikoe'], ['volume', 'volume'], ['metre', 'mitara']],
  quiz: [
    N(`3 m = ? cm`, `3 m = ? cm`, 300), N(`450 cm = ? m`, `450 cm = ? m`, 4.5),
    N(`Volume of a box 5 cm × 4 cm × 3 cm = ? cm³`, `Volume ea lebokose la 5 cm × 4 cm × 3 cm = ? cm³`, 60),
    N(`A circle has diameter 14 cm. Circumference (use 22/7) = ? cm`, `Selikalikoe se na le bophara ba 14 cm. Potoloho (sebelisa 22/7) = ? cm`, 44),
    Q(`Which formula gives the volume of a cuboid?`, `Ke foromo efe e fanang ka volume ea khuboite?`, ['l + w + h', 'l × w × h', '2 × (l + w)', 'π × d'], 1)
  ], practice: 'units' },

{ id: 'm5-symmetry', grade: 5, outcome: 'LO 19, 20', title: L(`Symmetry and patterns`, `Symmetry le lipaterone`),
  sections: [
    S(`Lines of symmetry`, `Mela ea symmetry`, `A shape is **symmetrical** if you can fold it so both halves match exactly. The fold line is a **line of symmetry**. A square has 4, a rectangle has 2, a circle has very many. Look at a Basotho blanket or a mokorotlo – many have symmetry!`, `Sebopeho se na le **symmetry** haeba u ka se mena 'me likarolo tse peli li tšoane hantle. Mola oa ho mena ke **mola oa symmetry**. Sekoere se na le e 4, khutlo-nne e na le e 2, selikalikoe se na le e mengata haholo. Sheba kobo ea Basotho kapa mokorotlo – tse ngata li na le symmetry!`),
    S(`Make a symmetrical design`, `Etsa moralo o nang le symmetry`, `Colour squares on the left side. The mirror line copies them on the right side – this is **reflection**.`, `Kenya mebala mabokoseng a ka letšehali. Mola oa seipone o a kopitsa ka letsohong le letona – ena ke **ho bonahatsa (reflection)**.`, { tool: 'symmetry' })
  ],
  words: [['symmetry', 'symmetry'], ['mirror', 'seipone'], ['fold', 'mena'], ['shape', 'sebopeho']],
  quiz: [
    N(`How many lines of symmetry does a square have?`, `Sekoere se na le mela e mekae ea symmetry?`, 4),
    N(`How many lines of symmetry does a rectangle (not a square) have?`, `Khutlo-nne (eseng sekoere) e na le mela e mekae ea symmetry?`, 2),
    Q(`Which letter has a vertical line of symmetry?`, `Ke tlhaku efe e nang le mola o emeng oa symmetry?`, ['A', 'F', 'G', 'R'], 0),
    TF(`A line of symmetry divides a shape into two matching halves.`, `Mola oa symmetry o arola sebopeho ka likarolo tse peli tse tšoanang.`, true)
  ] },

/* ======================= GRADE 6 ======================= */
{ id: 'm6-numbers', grade: 6, title: L(`Big numbers, factors, primes, HCF and LCM`, `Linomoro tse kholo, lintlha (factors), li-prime, HCF le LCM`),
  sections: [
    S(`Millions`, `Limilione`, `1 000 000 = one million. Lesotho has about 2 300 000 people (two million three hundred thousand). Read big numbers in groups of three from the right.`, `1 000 000 = milione e le 'ngoe. Lesotho e na le batho ba ka bang 2 300 000 (limilione tse peli le likete tse makholo a mararo). Bala linomoro tse kholo ka lihlopha tsa tse tharo ho tloha ka ho le letona.`, { tool: 'placevalue', toolOpts: { n: 2305147 } }),
    S(`Factors and prime numbers`, `Lintlha (factors) le linomoro tsa prime`, `**Factors** of 12 are the numbers that divide 12 exactly: 1, 2, 3, 4, 6, 12. A **prime number** has exactly two factors, 1 and itself: 2, 3, 5, 7, 11, 13, 17, 19 … (1 is not prime.)`, `**Lintlha (factors)** tsa 12 ke linomoro tse arolang 12 hantle: 1, 2, 3, 4, 6, 12. **Nomoro ea prime** e na le lintlha tse peli feela, 1 le eona ka bo eona: 2, 3, 5, 7, 11, 13, 17, 19 … (1 hase prime.)`, { calc: 'factors 24' }),
    S(`HCF and LCM`, `HCF le LCM`, `**HCF** (highest common factor) = the biggest number that divides both. **LCM** (lowest common multiple) = the smallest number both divide into. Use LCM to find a common bottom number for fractions.`, `**HCF** = nomoro e kholo ka ho fetisisa e arolang tsoelapele ka bobeli. **LCM** = nomoro e nyane ka ho fetisisa eo ka bobeli li kenang ho eona. Sebelisa LCM ho fumana nomoro e tšoanang e ka tlase bakeng sa likaroloana.`, { calc: 'hcf 12 18' })
  ],
  words: [['million', 'milione'], ['factor', 'ntlha (factor)'], ['prime number', 'nomoro ea prime'], ['common', 'e tšoanang']],
  quiz: [
    Q(`Which is a prime number?`, `Ke efe e leng nomoro ea prime?`, ['9', '15', '17', '21'], 2),
    N(`HCF of 12 and 18 = ?`, `HCF ea 12 le 18 = ?`, 6), N(`LCM of 4 and 6 = ?`, `LCM ea 4 le 6 = ?`, 12),
    N(`How many factors does 12 have?`, `12 e na le lintlha tse kae?`, 6),
    Q(`How do you write two million five hundred thousand?`, `U ngola limilione tse peli le likete tse makholo a mahlano joang?`, ['2 500 000', '2 050 000', '250 000', '25 000 000'], 0)
  ], practice: 'hcf' },

{ id: 'm6-decimals', grade: 6, title: L(`Decimals and percentages`, `Li-decimal le liphesente`),
  sections: [
    S(`Decimals`, `Li-decimal`, `A decimal point separates wholes from parts: 3.75 = 3 wholes + 7 tenths + 5 hundredths. Money uses decimals: M3.75 = 3 Maloti 75 lisente. 0.5 = 1/2, 0.25 = 1/4, 0.1 = 1/10.`, `Ntlha ea decimal e arola tse felletseng le likarolo: 3.75 = tse 3 tse felletseng + mashome a 7 (tenths) + makholo a 5 (hundredths). Chelete e sebelisa li-decimal: M3.75 = Maloti a 3 le lisente tse 75. 0.5 = 1/2, 0.25 = 1/4, 0.1 = 1/10.`),
    S(`Percentages`, `Liphesente`, `**Per cent (%)** means "out of 100". 50% = 50/100 = 1/2. 25% = 1/4. 10% = 1/10. To find 20% of 150: 20 ÷ 100 × 150 = **30**. Shops use % for discounts: 10% off M200 = M20 off.`, `**Phesente (%)** e bolela "ho tse 100". 50% = 50/100 = 1/2. 25% = 1/4. 10% = 1/10. Ho fumana 20% ea 150: 20 ÷ 100 × 150 = **30**. Mabenkele a sebelisa % bakeng sa theolelo: 10% ho M200 = M20 e theohileng.`, { calc: '20% of 150' })
  ],
  words: [['decimal point', 'ntlha ea decimal'], ['per cent', 'phesente'], ['discount', 'theolelo'], ['tenth', 'karolo ea leshome']],
  quiz: [
    Q(`0.5 is the same as…`, `0.5 e tšoana le…`, ['1/5', '1/2', '5/1', '1/50'], 1),
    N(`25% of 80 = ?`, `25% ea 80 = ?`, 20), N(`10% of M350 = M?`, `10% ea M350 = M?`, 35),
    Q(`Which is the largest?`, `Ke efe e kholo ka ho fetisisa?`, ['0.7', '0.65', '0.09', '0.6'], 0),
    N(`3.2 + 1.5 = ?`, `3.2 + 1.5 = ?`, 4.7)
  ], practice: 'percent' },

{ id: 'm6-fracops', grade: 6, title: L(`Multiplying and dividing fractions`, `Ho atisa le ho arola likaroloana`),
  sections: [
    S(`Multiplying fractions`, `Ho atisa likaroloana`, `Multiply the tops and multiply the bottoms: 2/3 × 3/4 = 6/12 = **1/2**. "Of" means multiply: 1/2 of 3/4 = 1/2 × 3/4 = 3/8.`, `Atisa tse ka holimo 'me u atise tse ka tlase: 2/3 × 3/4 = 6/12 = **1/2**. "Ea" (of) e bolela ho atisa: 1/2 ea 3/4 = 1/2 × 3/4 = 3/8.`, { calc: '2/3 x 3/4' }),
    S(`Dividing fractions`, `Ho arola likaroloana`, `Keep the first fraction, **flip** the second, then multiply: 3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = **1 1/2**. Think: how many halves fit into 3/4?`, `Boloka karoloana ea pele, **phethola** ea bobeli, ebe u atisa: 3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = **1 1/2**. Nahana: ho kena lihalofo tse kae ho 3/4?`, { calc: '3/4 ÷ 1/2' })
  ],
  words: [['flip', 'phethola'], ['of', 'ea'], ['simplify', 'nolofatsa']],
  quiz: [
    N(`1/2 × 1/3 = ?`, `1/2 × 1/3 = ?`, '1/6'), N(`2/3 × 3/4 = ?`, `2/3 × 3/4 = ?`, '1/2'),
    Q(`3/4 ÷ 1/2 = ?`, `3/4 ÷ 1/2 = ?`, ['3/8', '1 1/2', '2/3', '1/4'], 1),
    N(`1/4 of 20 = ?`, `1/4 ea 20 = ?`, 5)
  ] },

{ id: 'm6-ratio', grade: 6, title: L(`Ratio and proportion`, `Karolelano (ratio) le tekano`),
  sections: [
    S(`What is a ratio?`, `Ratio ke eng?`, `A ratio compares amounts. If a class has 12 girls and 8 boys, girls : boys = 12 : 8 = **3 : 2** (divide both by 4). For every 3 girls there are 2 boys.`, `Ratio e bapisa bongata. Haeba sehlopha se na le banana ba 12 le bashanyana ba 8, banana : bashanyana = 12 : 8 = **3 : 2** (arola ka bobeli ka 4). Bakeng sa banana ba 3 ho na le bashanyana ba 2.`),
    S(`Sharing in a ratio`, `Ho abelana ka ratio`, `Share M60 between Thabo and Lineo in the ratio 2 : 1. Total parts = 2 + 1 = 3. One part = 60 ÷ 3 = M20. Thabo gets 2 × 20 = **M40**, Lineo gets **M20**.`, `Abela M60 pakeng tsa Thabo le Lineo ka ratio ea 2 : 1. Likarolo kaofela = 2 + 1 = 3. Karolo e le 'ngoe = 60 ÷ 3 = M20. Thabo o fumana 2 × 20 = **M40**, Lineo o fumana **M20**.`),
    S(`Proportion in recipes`, `Tekano ho diresepe`, `Papa for 4 people needs 2 cups of maize meal. For 8 people (twice as many) use 4 cups. If the people double, the amount doubles.`, `Papa ea batho ba 4 e hloka linoelo tse 2 tsa phofo. Bakeng sa batho ba 8 (habeli) sebelisa linoelo tse 4. Ha batho ba eketseha habeli, bongata bo eketseha habeli.`)
  ],
  words: [['ratio', 'ratio (karolelano)'], ['share', 'abelana'], ['double', 'habeli']],
  quiz: [
    Q(`Simplify 10 : 15`, `Nolofatsa 10 : 15`, ['2 : 3', '1 : 5', '3 : 2', '10 : 5'], 0),
    N(`Share M90 in the ratio 2 : 1. The bigger share is M?`, `Abela M90 ka ratio ea 2 : 1. Kabelo e kholo ke M?`, 60),
    N(`3 eggs make 1 cake. How many eggs for 4 cakes?`, `Mahe a 3 a etsa kuku e le 'ngoe. Ho hlokahala mahe a makae bakeng sa likuku tse 4?`, 12)
  ] },

{ id: 'm6-area', grade: 6, title: L(`Perimeter and area`, `Potoloho le sebaka (area)`),
  sections: [
    S(`Perimeter`, `Potoloho (perimeter)`, `Perimeter is the distance **around** a shape. Add all the sides. Rectangle: P = 2 × (length + width). A garden 8 m by 5 m needs 2 × (8 + 5) = **26 m** of fence.`, `Potoloho ke sebaka **ho pota** sebopeho. Kopanya mahlakore 'ohle. Khutlo-nne: P = 2 × (bolelele + bophara). Serapa sa 8 m ka 5 m se hloka terata ea 2 × (8 + 5) = **26 m**.`),
    S(`Area`, `Sebaka (area)`, `Area is the **space inside** a flat shape, measured in square units (cm², m²). Rectangle: A = length × width. The same garden has area 8 × 5 = **40 m²**. Triangle: A = ½ × base × height.`, `Area ke **sebaka se ka hare** ho sebopeho se bataletseng, se lekanngoang ka liyuniti tse sekoere (cm², m²). Khutlo-nne: A = bolelele × bophara. Serapa sona seo se na le area ea 8 × 5 = **40 m²**. Khutlo-tharo: A = ½ × motheo × bophahamo.`)
  ],
  words: [['perimeter', 'potoloho'], ['area', 'sebaka (area)'], ['square metre', 'mitara-sekoere'], ['fence', 'terata']],
  quiz: [
    N(`Perimeter of a 6 m by 4 m rectangle = ? m`, `Potoloho ea khutlo-nne ea 6 m ka 4 m = ? m`, 20),
    N(`Area of a 6 m by 4 m rectangle = ? m²`, `Area ea khutlo-nne ea 6 m ka 4 m = ? m²`, 24),
    N(`Area of a triangle with base 10 cm and height 6 cm = ? cm²`, `Area ea khutlo-tharo e nang le motheo oa 10 cm le bophahamo ba 6 cm = ? cm²`, 30),
    Q(`Area is measured in…`, `Area e lekanngoa ka…`, ['cm', 'cm²', 'kg', 'litres'], 1)
  ], practice: 'area' },

{ id: 'm6-data', grade: 6, title: L(`Data: tables, bar graphs and the mean`, `Lintlha: litafole, li-bar graph le karolelano (mean)`),
  sections: [
    S(`Collecting and showing data`, `Ho bokella le ho bontša lintlha`, `Count things and write them in a **table** (tally marks help: ||||). A **bar graph** shows the numbers as bars – the taller the bar, the bigger the number. Below: rain measured with a rain gauge each school day.`, `Bala lintho 'me u li ngole **tafoleng** (matšoao a ho bala a thusa: ||||). **Bar graph** e bontša linomoro e le mekoallo – ha mokoallo o le molelele, nomoro e kholo. Ka tlase: pula e lekantsoeng ka rain gauge letsatsi le leng le le leng la sekolo.`, { tool: 'raingauge' }),
    S(`The mean (average)`, `Karolelano (mean)`, `Mean = total ÷ how many. Test marks 6, 8, 7, 9, 10: total = 40, there are 5 marks, mean = 40 ÷ 5 = **8**. The **mode** is the most common value; the **range** is biggest − smallest.`, `Karolelano = kakaretso ÷ palo ea tsona. Lintlha tsa teko 6, 8, 7, 9, 10: kakaretso = 40, ho na le lintlha tse 5, karolelano = 40 ÷ 5 = **8**. **Mode** ke boleng bo hlahang haholo; **range** ke e kholo − e nyane.`)
  ],
  words: [['data', 'lintlha (data)'], ['bar graph', 'bar graph'], ['average', 'karolelano'], ['table', 'tafole']],
  quiz: [
    N(`Mean of 4, 6, 8 = ?`, `Karolelano ea 4, 6, 8 = ?`, 6), N(`Mean of 10, 20, 30, 40 = ?`, `Karolelano ea 10, 20, 30, 40 = ?`, 25),
    N(`Range of 3, 9, 5, 12 = ?`, `Range ea 3, 9, 5, 12 = ?`, 9),
    Q(`Mode of 2, 3, 3, 5, 3, 7 = ?`, `Mode ea 2, 3, 3, 5, 3, 7 = ?`, ['2', '3', '5', '7'], 1)
  ] },

/* ======================= GRADE 7 ======================= */
{ id: 'm7-integers', grade: 7, title: L(`Negative numbers (integers)`, `Linomoro tse ka tlase ho zero`),
  sections: [
    S(`Below zero`, `Ka tlase ho zero`, `On a winter night in Mokhotlong it can be −10 °C: ten degrees **below** zero. Numbers below zero are **negative**. On a number line they are to the left of 0. −8 is smaller than −2.`, `Bosiung ba mariha Mokhotlong ho ka ba −10 °C: likhato tse leshome **ka tlase** ho zero. Linomoro tse ka tlase ho zero ke **tse mpe (negative)**. Moleng oa linomoro li ka letsohong le letšehali la 0. −8 e nyane ho −2.`, { tool: 'numberline' }),
    S(`Adding and subtracting`, `Ho kopanya le ho tlosa`, `Adding a positive: move **right**. Subtracting a positive: move **left**. Subtracting a negative is the same as adding: 3 − (−2) = 3 + 2 = **5**. Temperature 4 °C falls by 7 degrees → 4 − 7 = **−3 °C**.`, `Ho kopanya e ntle: ea ka **ho le letona**. Ho tlosa e ntle: ea ka **ho le letšehali**. Ho tlosa e mpe ho tšoana le ho kopanya: 3 − (−2) = 3 + 2 = **5**. Mocheso oa 4 °C o theoha ka likhato tse 7 → 4 − 7 = **−3 °C**.`, { tool: 'thermometer' })
  ],
  words: [['negative', 'e mpe (negative)'], ['positive', 'e ntle (positive)'], ['number line', 'mola oa linomoro'], ['temperature', 'mocheso']],
  quiz: [
    N(`−3 + 7 = ?`, `−3 + 7 = ?`, 4), N(`2 − 9 = ?`, `2 − 9 = ?`, -7), N(`5 − (−3) = ?`, `5 − (−3) = ?`, 8),
    Q(`Which is the coldest?`, `Ke efe e batang ka ho fetisisa?`, ['−2 °C', '0 °C', '−9 °C', '3 °C'], 2),
    N(`At 6 am it was −4 °C. By noon it was 11 °C warmer. Temperature at noon = ? °C`, `Ka 6 hoseng ho ne ho le −4 °C. Motšehare ho ne ho futhumetse ka 11 °C. Mocheso motšehare = ? °C`, 7)
  ], practice: 'integers' },

{ id: 'm7-algebra', grade: 7, title: L(`Algebra: expressions and simple equations`, `Aljebra: lipolelo le lipalo tse bonolo`),
  sections: [
    S(`Letters for numbers`, `Litlhaku sebakeng sa linomoro`, `In algebra a letter stands for an unknown number. If a bag holds **x** apples, 3 bags hold **3x** apples. 3x + 2 means "3 times x, plus 2". If x = 5, then 3x + 2 = 15 + 2 = 17.`, `Ho aljebra tlhaku e emela nomoro e sa tsejoeng. Haeba mokotla o tšoara liapole tse **x**, mekotla e 3 e tšoara liapole tse **3x**. 3x + 2 e bolela "3 makhetlo x, hammoho le 2". Haeba x = 5, joale 3x + 2 = 15 + 2 = 17.`),
    S(`Solving equations like a balance`, `Ho rarolla lipalo joaloka sekala`, `An equation is like a balanced scale: both sides are equal. Whatever you do to one side, do to the other. x + 4 = 11 → take 4 from both sides → **x = 7**. 3x = 12 → divide both sides by 3 → **x = 4**.`, `Equation e tšoana le sekala se lekaneng: mahlakore ka bobeli a lekana. Seo u se etsang lehlakoreng le leng, se etse ho le leng. x + 4 = 11 → tlosa 4 mahlakoreng ka bobeli → **x = 7**. 3x = 12 → arola mahlakore ka bobeli ka 3 → **x = 4**.`, { tool: 'balance' })
  ],
  words: [['equation', 'equation (palo e lekaneng)'], ['unknown', 'e sa tsejoeng'], ['solve', 'rarolla'], ['both sides', 'mahlakore ka bobeli']],
  quiz: [
    N(`x + 5 = 12. x = ?`, `x + 5 = 12. x = ?`, 7), N(`4x = 28. x = ?`, `4x = 28. x = ?`, 7), N(`2x + 3 = 15. x = ?`, `2x + 3 = 15. x = ?`, 6),
    N(`If y = 4, what is 5y − 2?`, `Haeba y = 4, 5y − 2 ke bokae?`, 18),
    Q(`"Five more than a number n" is…`, `"Hlano ho feta nomoro n" ke…`, ['5n', 'n + 5', 'n − 5', '5 − n'], 1)
  ], practice: 'equations' },

{ id: 'm7-percent', grade: 7, title: L(`Percentages in business: profit, loss, discount, VAT`, `Liphesente khoebong: phaello, tahlehelo, theolelo, VAT`),
  sections: [

{ id: 's5-animals', grade: 5, hard: true, title: L(`Classifying animals`, `Ho hlopha liphoofolo`),

    S(`Animals with and without a backbone`, `Liphoofolo tse nang le tse se nang mokokotlo`, `Scientists sort animals into groups by what their bodies are like. **Vertebrates** have a backbone (cow, frog, eagle). **Invertebrates** have no backbone (bee, worm, spider, snail).`, `Bo-ramahlale ba hlopha liphoofolo ka mokhoa oo 'mele ea tsona e leng ka oona. **Vertebrates** li na le mokokotlo (khomo, senqanqane, ntsu). **Invertebrates** ha li na mokokotlo (notši, seboko, sekho, khofu).`),
    S(`Five groups of vertebrates`, `Lihlopha tse hlano tsa liphoofolo tse nang le mokokotlo`, `- **Mammals**: hair or fur, babies drink milk (cow, sheep, dog, people, bat)\n- **Birds**: feathers, wings, lay eggs with hard shells (chicken, eagle)\n- **Reptiles**: dry scales, lay eggs on land (snake, lizard, tortoise)\n- **Amphibians**: moist skin, young live in water and adults on land (frog)\n- **Fish**: gills, fins and scales, live in water (trout in the Senqu river)`, `- **Tse anyesang (mammals)**: moriri kapa boea, bana ba anya lebese (khomo, nku, ntja, batho, mankhane)\n- **Linonyana**: masiba, mapheo, li behela mahe a nang le likhetla tse thata (khoho, ntsu)\n- **Lihahabi**: makhakhapha a omileng, li behela mahe fatše (noha, mokhosi, khudu)\n- **Liphela-metsing le fatše (amphibians)**: letlalo le metsi, ba banyenyane ba phela metsing, ba baholo fatše (senqanqane)\n- **Litlhapi**: li-gill, mapheo a ho sesa le makhakhapha, li phela metsing (tlhapi nokeng ea Senqu)`, { tool: 'sort', toolOpts: { items: ANIMALS, groups: GROUPS } }),

{ id: 's5-oxygen', grade: 5, outcome: 'LO 6', hard: true, title: L(`Air and oxygen: burning, breathing and rust`, `Moea le oksijene: ho tuka, ho hema le mafome`),
  sections: [
    S(`Air is a mixture of gases`, `Moea ke motsoako oa likhase`, `We cannot see air, but it is all around us. Air is a mixture of gases: about 78% **nitrogen**, 21% **oxygen**, and small amounts of **carbon dioxide** and other gases.`, `Ha re bone moea, empa o re potolohile. Moea ke motsoako oa likhase: ka bang 78% ke **naetrojene**, 21% ke **oksijene**, 'me ho na le **carbon dioxide** e nyenyane le likhase tse ling.`),
    S(`Oxygen supports burning`, `Oksijene e thusa mollo ho tuka`, `A fire needs three things: **fuel** (wood, paraffin, gas), **heat**, and **oxygen**. Cover a burning candle with a jar: the flame uses up the oxygen and goes out. That is why we smother a pan fire with a lid or a wet cloth.`, `Mollo o hloka lintho tse tharo: **mafura/patsi** (patsi, parafene, khase), **mocheso**, le **oksijene**. Koahela kerese e tukang ka nkho: lelakabe le sebelisa oksijene 'me lea tima. Ke ka hona re koahelang mollo oa pane ka sekoahelo kapa lesela le metsi.`, { tool: 'candle' }),
    S(`Oxygen supports life`, `Oksijene e phelisa`, `People and animals **breathe in** oxygen and **breathe out** carbon dioxide. Fish take oxygen from water with their gills. Plants make oxygen in sunlight. A room with a burning brazier (mbaola) and closed windows is dangerous – the fire uses oxygen and makes poisonous carbon monoxide. Always keep a window open!`, `Batho le liphoofolo ba **hema** oksijene 'me ba **hemela ka ntle** carbon dioxide. Litlhapi li nka oksijene metsing ka li-gill. Limela li etsa oksijene khanyeng ea letsatsi. Kamore e nang le mbaola e tukang 'me lifensetere li koetsoe e kotsi – mollo o sebelisa oksijene 'me o etsa khase e chefo (carbon monoxide). Kamehla siea fensetere e bulehile!`),
    S(`Oxygen causes rust`, `Oksijene e baka mafome`, `Iron left outside gets **rust** (brown and flaky). Rust needs **oxygen and water** together. We stop rust with paint, oil or grease – that is why gates and roofs are painted.`, `Tšepe e siuoeng ka ntle e ba le **mafome** (a sootho a khahlang). Mafome a hloka **oksijene le metsi** hammoho. Re thibela mafome ka pente, oli kapa mafura – ke ka hona liheke le marulelo a pentiloeng.`)
  ],
  words: [['oxygen', 'oksijene'], ['air', 'moea'], ['gas', 'khase'], ['rust', 'mafome'], ['breathe', 'hema'], ['fire', 'mollo'], ['candle', 'kerese']],

{ id: 's5-measure', grade: 5, outcome: 'LO 1, 2, 3', title: L(`Measuring weather: thermometer, rain gauge, scale`, `Ho lekanya boemo ba leholimo: thermometer, rain gauge, sekala`),
  sections: [
    S(`Temperature`, `Mocheso`, `A **thermometer** measures how hot or cold something is, in **degrees Celsius (°C)**. Water freezes at 0 °C and boils at 100 °C. In Lesotho winter nights can fall below 0 °C and summer days can reach 30 °C. Read the level of the red liquid at eye level.`, `**Thermometer** e lekanya hore na ntho e chesa kapa e bata hakae, ka **likhato tsa Celsius (°C)**. Metsi a hoama ho 0 °C 'me a bela ho 100 °C. Lesotho masiu a mariha a ka theohela ka tlase ho 0 °C 'me matsatsi a lehlabula a ka fihla 30 °C. Bala boemo ba mokelikeli o mofubelu mahlo a lekana le oona.`, { tool: 'thermometer' }),
    S(`Rainfall`, `Pula`, `A **rain gauge** collects rain. Read the water level in **millimetres (mm)** every morning at the same time, then empty it. Make one: cut the top off a plastic bottle, turn it upside down as a funnel, and stick a ruler on the side.`, `**Rain gauge** e bokella pula. Bala boemo ba metsi ka **limilimithara (mm)** hoseng ho hong le ho hong ka nako e tšoanang, ebe u e tšolla. Iketsetse: seha karolo e ka holimo ea botlolo ea polasetiki, e phethole e be fanele, 'me u khomarele rulara ka thoko.`, { tool: 'raingauge' }),
    S(`Mass`, `Boima`, `A **pan scale** (balance) compares masses. Put the object on one pan and known masses on the other until they balance. Mass is measured in grams (g) and kilograms (kg). 1 kg = 1 000 g.`, `**Sekala sa lipane** se bapisa boima. Beha ntho pane e 'ngoe 'me u behe boima bo tsebahalang ho e 'ngoe ho fihlela li lekana. Boima bo lekanngoa ka ligrama (g) le likilograma (kg). 1 kg = 1 000 g.`)
  ],
  words: [['thermometer', 'thermometer'], ['rain gauge', 'rain gauge (selekanya-pula)'], ['mass', 'boima'], ['weather', 'boemo ba leholimo'], ['cold', 'bata'], ['hot', 'chesa']],

{ id: 's5-heat', grade: 5, outcome: 'LO 4, 5', title: L(`Heat: sources and effects`, `Mocheso: mehloli le liphello`),
  sections: [
    S(`Sources of heat`, `Mehloli ea mocheso`, `Heat comes from the **sun**, **fire** (wood, dung, paraffin, gas), **electricity** (stove, heater) and **rubbing** (rub your hands together). The sun is our biggest source of heat and light.`, `Mocheso o tsoa **letsatsing**, **mollong** (patsi, lisu, parafene, khase), **motlakaseng** (setofo, hitara) le ho **hohla** (hohla matsoho a hau). Letsatsi ke mohloli o moholo ka ho fetisisa oa mocheso le khanya.`),
    S(`What heat does to solids and liquids`, `Seo mocheso o se etsang lintho tse tiileng le mekelikeli`, `- Heat makes things **expand** (get a little bigger); cooling makes them **contract**. That is why telephone wires sag in summer.\n- Heat **melts** solids: ice → water, fat → oil.\n- Heat **evaporates** liquids: water → steam. Cooling **condenses** steam back to water drops (look at a pot lid!).`, `- Mocheso o etsa hore lintho li **atolohe** (li holele hanyane); ho bata ho etsa hore li **honyelle**. Ke ka hona lithapo tsa mohala li leketlang lehlabula.\n- Mocheso o **qhibilihisa** lintho tse tiileng: leqhoa → metsi, mafura → oli.\n- Mocheso o **fetola mekelikeli mouoane**: metsi → mouoane. Ho bata ho **khutlisa** mouoane hore e be marotholi a metsi (sheba sekoahelo sa pitsa!).`)
  ],
  words: [['heat', 'mocheso'], ['melt', 'qhibiliha'], ['steam', 'mouoane'], ['expand', 'atoloha'], ['sun', 'letsatsi']],

    Q(`What is our biggest source of heat?`, `Mohloli oa rona o moholo oa mocheso ke ofe?`, [['the sun', 'letsatsi'], ['the moon', 'khoeli'], ['a candle', 'kerese'], ['a fridge', 'sehatsetsi']], 0),

{ id: 's5-food', grade: 5, outcome: 'LO 7, 8, 9, 10', title: L(`Food, nutrients and healthy meals`, `Lijo, limatlafatsi le lijo tse phetseng hantle`),
  sections: [
    S(`Nutrients and what they do`, `Limatlafatsi le mosebetsi oa tsona`, `- **Carbohydrates** give energy: papa, bread, potatoes, sorghum (mabele)\n- **Proteins** build the body: beans, eggs, milk, meat, fish, peas (lierekisi)\n- **Fats** give energy and warmth: oil, butter, peanuts\n- **Vitamins and minerals** protect us from disease: green vegetables (moroho, spinach, rape), fruit\n- **Water** – drink clean water every day`, `- **Li-carbohydrate** li fana ka matla: papa, bohobe, litapole, mabele\n- **Liprotheine** li haha 'mele: linaoa, mahe, lebese, nama, tlhapi, lierekisi\n- **Mafura** a fana ka matla le mofuthu: oli, botoro, makotomane\n- **Livithamine le liminerale** li re sireletsa mafung: meroho e metala (moroho, sepinache, rapa), litholoana\n- **Metsi** – noa metsi a hloekileng letsatsi le leng le le leng`, { tool: 'sort', toolOpts: { items: [{ emo: '🍞', en: 'bread', st: 'bohobe', g: 'c' }, { emo: '🥚', en: 'eggs', st: 'mahe', g: 'p' }, { emo: '🥬', en: 'moroho (spinach)', st: 'moroho', g: 'v' }, { emo: '🫘', en: 'beans', st: 'linaoa', g: 'p' }, { emo: '🥔', en: 'potatoes', st: 'litapole', g: 'c' }, { emo: '🍊', en: 'orange', st: 'lamunu', g: 'v' }, { emo: '🥜', en: 'peanuts', st: 'makotomane', g: 'f' }, { emo: '🥛', en: 'milk', st: 'lebese', g: 'p' }], groups: [{ id: 'c', emo: '⚡', en: 'Energy (carbohydrates)', st: 'Matla (li-carbohydrate)' }, { id: 'p', emo: '💪', en: 'Body-building (proteins)', st: 'Ho haha \'mele (liprotheine)' }, { id: 'v', emo: '🛡️', en: 'Protection (vitamins)', st: 'Tšireletso (livithamine)' }, { id: 'f', emo: '🔥', en: 'Fats', st: 'Mafura' }] } }),
    S(`Preparing vegetables and eggs`, `Ho pheha meroho le mahe`, `Wash green vegetables **before** cutting them, cook them for a short time with little water and a lid – long boiling destroys vitamins. Boil eggs for about 10 minutes, or scramble them. Always wash hands first!`, `Hlatsoa meroho e metala **pele** u e seha, e phehe nako e khutšoanyane ka metsi a fokolang 'me u koahele – ho bela nako e telele ho senya livithamine. Bela mahe metsotso e ka bang 10, kapa u a hlohle. Kamehla hlatsoa matsoho pele!`),
    S(`Deficiency diseases`, `Mafu a tlhaello ea limatlafatsi`, `Without enough protein children can get **kwashiorkor** (swollen belly, thin arms). Without enough iron people get **anaemia** (tired, pale). Without vitamin C – **scurvy** (bleeding gums). A balanced diet prevents these.`, `Ntle le protheine e lekaneng bana ba ka tšoaroa ke **kwashiorkor** (mpa e ruruhileng, matsoho a masesane). Ntle le aene e lekaneng batho ba fumana **anaemia** (mokhathala, ho tšoeufala). Ntle le vithamine C – **scurvy** (marenene a tsoang mali). Lijo tse leka-lekaneng li thibela mafu ana.`)
  ],
  words: [['food', 'lijo'], ['vegetables', 'meroho'], ['eggs', 'mahe'], ['beans', 'linaoa'], ['energy', 'matla'], ['healthy', 'phetseng hantle']],
  quiz: [
    Q(`Which food gives mostly protein?`, `Ke lijo life tse fanang haholo ka protheine?`, [['beans', 'linaoa'], ['sugar', 'tsoekere'], ['oil', 'oli'], ['papa', 'papa']], 0),
    Q(`Which nutrient gives energy?`, `Ke matlafatsi afe a fanang ka matla?`, [['carbohydrates', 'li-carbohydrate'], ['vitamins', 'livithamine'], ['water', 'metsi'], ['minerals', 'liminerale']], 0),
    Q(`Kwashiorkor is caused by too little…`, `Kwashiorkor e bakoa ke ho haelloa ke…`, [['protein', 'protheine'], ['sugar', 'tsoekere'], ['water', 'metsi'], ['fat', 'mafura']], 0),
    TF(`We should wash vegetables before cutting them.`, `Re lokela ho hlatsoa meroho pele re e seha.`, true)
  ] },

{ id: 's5-health', grade: 5, outcome: 'LO 11, 12, 18, 21', title: L(`Diseases, hygiene and keeping clean`, `Mafu, bohloeki le ho lula re hloekile`),
  sections: [
    S(`Infectious and non-infectious diseases`, `Mafu a tšoaetsanoang le a sa tšoaetsanoeng`, `**Infectious** diseases spread from person to person through germs: flu, TB, diarrhoea, COVID-19, HIV. **Non-infectious** diseases do not spread: diabetes, high blood pressure, asthma.`, `Mafu a **tšoaetsanoang** a hasana ho tloha ho motho ho ea ho e mong ka likokoana-hloko: ntaramane, TB, letšollo, COVID-19, HIV. Mafu a **sa tšoaetsanoeng** ha a hasane: lefu la tsoekere, khatello e phahameng ea mali, asthma.`),
    S(`Stop the germs`, `Thibela likokoana-hloko`, `- Wash hands with soap after the toilet and before eating\n- Cough or sneeze into your elbow\n- Drink clean or boiled water\n- Keep the toilet and kitchen clean, cover food from flies\n- Bath and wash your clothes regularly – it also helps you feel good about yourself`, `- Hlatsoa matsoho ka sesepa ka mor'a ntloana le pele u ja\n- Khohlela kapa u thimole ka setsoe\n- Noa metsi a hloekileng kapa a belisitsoeng\n- Boloka ntloana le kichine li hloekile, koahela lijo ho lintsintsi\n- Hlapa 'me u hlatsoe liaparo tsa hau khafetsa – ho boetse ho u thusa ho ikutloa hantle`)
  ],
  words: [['germs', 'likokoana-hloko'], ['soap', 'sesepa'], ['clean', 'hloekile'], ['disease', 'lefu'], ['wash', 'hlatsoa']],
  quiz: [
    Q(`Which disease is infectious?`, `Ke lefu lefe le tšoaetsanoang?`, [['TB', 'TB'], ['diabetes', 'lefu la tsoekere'], ['asthma', 'asthma'], ['high blood pressure', 'khatello ea mali']], 0),
    Q(`When must you wash your hands?`, `U tlameha ho hlatsoa matsoho neng?`, [['after the toilet and before eating', "ka mor'a ntloana le pele u ja"], ['only on Sunday', 'Sontaha feela'], ['never', 'le ka mohla'], ['only when they look dirty', 'ha a shebahala a le litšila feela']], 0),
    TF(`Sneezing into your elbow helps stop germs spreading.`, `Ho thimola ka setsoe ho thusa ho thibela likokoana-hloko.`, true)
  ] },

/* ======================= GRADE 6 ======================= */
{ id: 's6-plants', grade: 6, title: L(`Plants: parts and photosynthesis`, `Limela: likarolo le photosynthesis`),
  sections: [
    S(`Parts of a plant`, `Likarolo tsa semela`, `- **Roots** hold the plant in the soil and take in water and minerals\n- The **stem** carries water up and food down\n- **Leaves** make food\n- **Flowers** make seeds so new plants can grow`, `- **Metso** e tšoara semela mobung 'me e monya metsi le liminerale\n- **Kutu** e isa metsi holimo le lijo tlase\n- **Makhasi** a etsa lijo\n- **Lipalesa** li etsa peō e le hore limela tse ncha li hole`),
    S(`Photosynthesis`, `Photosynthesis`, `Green leaves make food (sugar) using **sunlight**, **water** and **carbon dioxide** from the air. The green colour (chlorophyll) catches the light. Plants give out **oxygen** – the oxygen we breathe! Without plants there would be no food and no oxygen.`, `Makhasi a matala a etsa lijo (tsoekere) a sebelisa **khanya ea letsatsi**, **metsi** le **carbon dioxide** e tsoang moeeng. 'Mala o motala (chlorophyll) o tšoasa khanya. Limela li ntša **oksijene** – oksijene eo re e hemang! Ntle le limela ho ne ho ke ke ha e-ba le lijo kapa oksijene.`)
  ],
  words: [['root', 'motso'], ['stem', 'kutu'], ['leaf', 'lekhasi'], ['flower', 'palesa'], ['seed', 'peō'], ['sunlight', 'khanya ea letsatsi']],
  quiz: [
    Q(`Which part makes food for the plant?`, `Ke karolo efe e etsetsang semela lijo?`, [['leaves', 'makhasi'], ['roots', 'metso'], ['flowers', 'lipalesa'], ['soil', 'mobu']], 0),
    Q(`What gas do plants give out in sunlight?`, `Limela li ntša khase efe khanyeng ea letsatsi?`, [['oxygen', 'oksijene'], ['smoke', 'mosi'], ['carbon monoxide', 'carbon monoxide'], ['nitrogen', 'naetrojene']], 0),
    Q(`Roots take in…`, `Metso e monya…`, [['water and minerals', 'metsi le liminerale'], ['sunlight', 'khanya ea letsatsi'], ['oxygen only', 'oksijene feela'], ['food from people', 'lijo tsa batho']], 0)
  ], ask: ['what is photosynthesis?'] },

{ id: 's6-body', grade: 6, title: L(`The human body: digestion, breathing, blood`, `'Mele oa motho: tšilo ea lijo, ho hema, mali`),
  sections: [
    S(`Digestion`, `Tšilo ea lijo`, `Food goes: **mouth** (teeth chew, saliva) → **gullet** → **stomach** (acids break food down) → **small intestine** (nutrients go into the blood) → **large intestine** (water taken back) → waste leaves the body.`, `Lijo li tsamaea: **molomo** (meno a hlafuna, mathe) → **'metso** → **mpa** (liasiti li silakanya lijo) → **mala a manyenyane** (limatlafatsi li kena maling) → **mala a maholo** (metsi a khutlisoa) → litšila li tsoa 'meleng.`),
    S(`Breathing and the heart`, `Ho hema le pelo`, `Air goes through the nose and windpipe into the **lungs**. Oxygen goes into the blood. The **heart** is a pump: it pushes blood around the body about 70 times a minute. Feel your pulse at your wrist!`, `Moea o kena ka nko le phala ea moea ho ea **matšoafong**. Oksijene e kena maling. **Pelo** ke pompo: e sutumetsa mali 'meleng oohle makhetlo a ka bang 70 ka motsotso. Utloa pelo ea hau e otla letsohong!`)
  ],
  words: [['heart', 'pelo'], ['lungs', 'matšoafo'], ['stomach', 'mpa'], ['blood', 'mali'], ['teeth', 'meno']],
  quiz: [
    Q(`Which organ pumps blood?`, `Ke setho sefe se pompang mali?`, [['heart', 'pelo'], ['lungs', 'matšoafo'], ['stomach', 'mpa'], ['brain', 'boko']], 0),
    Q(`Where does oxygen enter the blood?`, `Oksijene e kena maling hokae?`, [['lungs', 'matšoafong'], ['stomach', 'mpeng'], ['teeth', 'menong'], ['skin of the feet', 'letlalong la maoto']], 0),
    Q(`Digestion starts in the…`, `Tšilo ea lijo e qala…`, [['mouth', 'molomong'], ['heart', 'pelong'], ['large intestine', 'maleng a maholo'], ['lungs', 'matšoafong']], 0)
  ] },

{ id: 's6-electricity', grade: 6, title: L(`Electricity and simple circuits`, `Motlakase le lipotoloho tse bonolo`),
  sections: [
    S(`A complete circuit`, `Potoloho e felletseng`, `Electricity flows only around a **complete circuit**: battery → wire → bulb → wire → back to the battery. A **switch** opens or closes the gap. Press the switch below.`, `Motlakase o phalla feela ho **potoloho e felletseng**: betri → terata → bolebe → terata → ho khutlela betring. **Switch** e bula kapa e koala sekheo. Tobetsa switch e ka tlase.`, { tool: 'circuit' }),
    S(`Conductors and insulators`, `Li-conductor le li-insulator`, `**Conductors** let electricity through: copper, iron, aluminium. **Insulators** do not: plastic, rubber, wood, glass. Wires are covered in plastic to keep us safe.\n**Safety:** never touch a broken wire, never put things into a plug socket, never fly a kite near power lines. Lesotho's electricity comes mostly from water (the 'Muela hydropower station).`, `**Li-conductor** li tlohella motlakase o fete: koporo, tšepe, aluminiamo. **Li-insulator** ha li o tlohelle: polasetiki, rabara, lepolanka, khalase. Literata li koahetsoe ka polasetiki ho re sireletsa.\n**Polokeho:** le ka mohla u se ke ua ama terata e robehileng, u se ke ua kenya lintho sekoting sa polaka, u se ke ua fofisa khaete haufi le lithapo tsa motlakase. Motlakase oa Lesotho o tsoa haholo metsing (setsi sa 'Muela).`)
  ],
  words: [['electricity', 'motlakase'], ['battery', 'betri'], ['bulb', 'bolebe'], ['wire', 'terata'], ['switch', 'switch'], ['safe', 'bolokehile']],
  quiz: [
    Q(`Which is an insulator?`, `Ke efe e leng insulator?`, [['plastic', 'polasetiki'], ['copper', 'koporo'], ['iron', 'tšepe'], ['aluminium', 'aluminiamo']], 0),
    Q(`The bulb lights when the circuit is…`, `Bolebe bo khanya ha potoloho e…`, [['complete (closed)', 'felletse (koetsoe)'], ['open', 'bulehile'], ['broken', 'robehile'], ['wet', 'metsi']], 0),
    TF(`It is safe to fly a kite near power lines.`, `Ho bolokehile ho fofisa khaete haufi le lithapo tsa motlakase.`, false)
  ] },

{ id: 's6-soil', grade: 6, title: L(`Soil, erosion and conservation`, `Mobu, khoholeho le paballo`),
  sections: [
    S(`Soil`, `Mobu`, `Soil is made of tiny rock pieces, **humus** (rotting plants and animals), water and air. **Sandy** soil drains fast; **clay** soil holds water; **loam** (a mix with humus) is best for crops.`, `Mobu o entsoe ka likotoana tse nyane tsa mafika, **humus** (limela le liphoofolo tse bolileng), metsi le moea. Mobu oa **lehlabathe** o tlohela metsi a feta kapele; mobu oa **letsopa** o tšoara metsi; **loam** (motsoako o nang le humus) o molemo ka ho fetisisa bakeng sa lijalo.`),
    S(`Soil erosion – Lesotho's big problem`, `Khoholeho ea mobu – bothata bo boholo ba Lesotho`, `Rain and wind wash away the top soil and make **dongas** (deep gullies). Causes: overgrazing, cutting trees, ploughing up and down slopes. **Conservation:** plant trees and grass, build stone lines and terraces, plough across the slope (contour ploughing), rotate grazing.`, `Pula le moea li hohola mobu o ka holimo 'me li etsa **mekoti ea likhohola (dongas)**. Lisosa: ho fulisa ho feta tekano, ho rema lifate, ho lema ho nyoloha le ho theoha matsoapo. **Paballo:** lema lifate le joang, haha mela ea majoe le literasi, lema ka ho tšela letsoapo, fapanyetsa makhulo.`)
  ],
  words: [['soil', 'mobu'], ['erosion', 'khoholeho'], ['donga', 'donga (mokoti)'], ['tree', 'sefate'], ['grass', 'joang']],
  quiz: [
    Q(`Which soil is best for crops?`, `Ke mobu ofe o molemo ka ho fetisisa bakeng sa lijalo?`, [['loam', 'loam'], ['sand only', 'lehlabathe feela'], ['stones', 'majoe'], ['clay only', 'letsopa feela']], 0),
    Q(`Which helps stop soil erosion?`, `Ke eng e thusang ho thibela khoholeho ea mobu?`, [['planting trees and grass', 'ho lema lifate le joang'], ['overgrazing', 'ho fulisa ho feta tekano'], ['cutting trees', 'ho rema lifate'], ['ploughing down the slope', 'ho lema ho theoha letsoapo']], 0)
  ] },

/* ======================= GRADE 7 ======================= */
{ id: 's7-matter', grade: 7, title: L(`Matter: states, mixtures and separating`, `Ntho: maemo, metsoako le ho arohanya`),
  sections: [
    S(`Three states of matter`, `Maemo a mararo a ntho`, `**Solid** (fixed shape: stone, ice), **liquid** (takes the shape of its container: water, milk), **gas** (spreads everywhere: steam, air). Heating and cooling change the state: melting, freezing, evaporating, condensing.`, `**E tiileng** (sebopeho se sa fetoheng: lejoe, leqhoa), **mokelikeli** (o nka sebopeho sa sejana: metsi, lebese), **khase** (e ata hohle: mouoane, moea). Ho futhumatsa le ho batisa ho fetola boemo: ho qhibiliha, ho hoama, ho fetoha mouoane, ho khutla e le metsi.`),
    S(`Separating mixtures`, `Ho arohanya metsoako`, `- **Sieving**: flour from stones (a sieve)\n- **Filtering**: sand from water (cloth or filter paper)\n- **Evaporating**: salt from salt water (heat it until the water goes)\n- **Picking/winnowing**: chaff from mabele grain (wind blows the light chaff away)`, `- **Ho sefa**: phofo le majoe (sefe)\n- **Ho hloekisa ka lesela (filtering)**: lehlabathe le metsi\n- **Ho fetola mouoane**: letsoai metsing a letsoai (futhumatsa ho fihlela metsi a fela)\n- **Ho foka**: mohlaka ho mabele (moea o fofisa mohlaka o bobebe)`)
  ],
  words: [['solid', 'e tiileng'], ['liquid', 'mokelikeli'], ['gas', 'khase'], ['mixture', 'motsoako'], ['sieve', 'sefe']],
  quiz: [
    Q(`Steam is a…`, `Mouoane ke…`, [['gas', 'khase'], ['solid', 'e tiileng'], ['liquid', 'mokelikeli'], ['mixture of stones', 'motsoako oa majoe']], 0),
    Q(`How can you get salt back from salt water?`, `U ka khutlisa letsoai metsing a letsoai joang?`, [['evaporate the water', 'fetola metsi mouoane'], ['sieve it', 'e sefe'], ['freeze it', 'e hatsetse'], ['shake it', 'e sisinye']], 0),
    Q(`Winnowing separates…`, `Ho foka ho arohanya…`, [['chaff from grain', 'mohlaka le lijo-thollo'], ['salt from water', 'letsoai le metsi'], ['oil from water', 'oli le metsi'], ['milk from tea', 'lebese le tee']], 0)
  ] },

{ id: 's7-forces', grade: 7, title: L(`Forces and simple machines`, `Matla (forces) le mechini e bonolo`),
  sections: [
    S(`Forces`, `Matla (forces)`, `A force is a **push** or a **pull**. Forces can start, stop, speed up, slow down or change the shape of things. **Gravity** pulls everything down to Earth. **Friction** slows moving things (it is why shoes grip the ground).`, `Force ke **ho sutumetsa** kapa ho **hula**. Matla a ka qala, a emisa, a potlakisa, a liehisa kapa a fetola sebopeho sa lintho. **Gravity** e hulela tsohle fatše. **Friction** e liehisa lintho tse tsamaeang (ke ka hona lieta li tšoarang fatše).`),
    S(`Simple machines make work easier`, `Mechini e bonolo e nolofatsa mosebetsi`, `- **Lever**: a crowbar or a see-saw\n- **Pulley**: lifts a bucket from a well\n- **Inclined plane (ramp)**: rolling a drum into a truck\n- **Wheel and axle**: a wheelbarrow or scotch-cart`, `- **Lever**: lekhopo kapa see-saw\n- **Pulley**: e phahamisa nkho ho tsoa selibeng\n- **Ramp (letsoapo)**: ho bilikisetsa moqomo koloing\n- **Lebili le axle**: kiribae kapa koloi ea lipere`)
  ],
  words: [['force', 'matla (force)'], ['push', 'sutumetsa'], ['pull', 'hula'], ['wheel', 'lebili'], ['gravity', 'gravity']],
  quiz: [
    Q(`A force is…`, `Force ke…`, [['a push or a pull', 'ho sutumetsa kapa ho hula'], ['a colour', "'mala"], ['a sound', 'molumo'], ['a gas', 'khase']], 0),
    Q(`Which force pulls things down to the ground?`, `Ke matla afe a hulelang lintho fatše?`, [['gravity', 'gravity'], ['friction', 'friction'], ['magnetism', 'makenete'], ['wind', 'moea']], 0),
    Q(`A wheelbarrow uses…`, `Kiribae e sebelisa…`, [['a wheel and axle and a lever', 'lebili le axle le lever'], ['a pulley only', 'pulley feela'], ['nothing', 'ha ho letho'], ['electricity', 'motlakase']], 0)
  ] },

{ id: 's7-earth', grade: 7, title: L(`Earth, sun and moon`, `Lefatše, letsatsi le khoeli`),
  sections: [
    S(`Day and night, seasons`, `Motšehare le bosiu, linako tsa selemo`, `The Earth **spins** once every 24 hours: the side facing the sun has day, the other side has night. The Earth goes **around the sun** once a year (365 days). Because the Earth is tilted we have seasons: in Lesotho summer is December–February and winter is June–August.`, `Lefatše le **ipotoloha** hang ka lihora tse 24: lehlakore le shebileng letsatsi le na le motšehare, le leng le na le bosiu. Lefatše le **potoloha letsatsi** hang ka selemo (matsatsi a 365). Kaha lefatše le sekame re na le linako tsa selemo: Lesotho lehlabula ke Tšitoe–Hlakola 'me mariha ke Phupjane–Phato.`),
    S(`The moon and the solar system`, `Khoeli le sistimi ea letsatsi`, `The moon goes around the Earth about once a month (29½ days) and does not make its own light – it reflects sunlight. There are 8 planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.`, `Khoeli e potoloha lefatše hang ka khoeli (matsatsi a ka bang 29½) 'me ha e iketsetse khanya – e bonahatsa khanya ea letsatsi. Ho na le lipolanete tse 8: Mercury, Venus, Lefatše, Mars, Jupiter, Saturn, Uranus, Neptune.`)
  ],
  words: [['earth', 'lefatše'], ['moon', 'khoeli'], ['star', 'naleli'], ['season', 'nako ea selemo'], ['winter', 'mariha'], ['summer', 'lehlabula']],
  quiz: [
    N(`How many hours does the Earth take to spin once?`, `Lefatše le nka lihora tse kae ho ipotoloha hang?`, 24),
    Q(`Why do we have day and night?`, `Hobaneng re e-na le motšehare le bosiu?`, [['The Earth spins', 'Lefatše lea ipotoloha'], ['The sun switches off', 'Letsatsi lea tima'], ['Clouds', 'Maru'], ['The moon blocks the sun every night', 'Khoeli e koahela letsatsi bosiu bo bong le bo bong']], 0),
    Q(`In Lesotho, June to August is…`, `Lesotho, Phupjane ho isa Phato ke…`, [['winter', 'mariha'], ['summer', 'lehlabula'], ['spring', 'selemo'], ['autumn', 'hoetla']], 0)
  ] },

{ id: 's7-health', grade: 7, title: L(`Growing up healthy: puberty, HIV and substance abuse`, `Ho hola re phetse hantle: bocha, HIV le tšebeliso e mpe ea lithethefatsi`),
  sections: [
    S(`Puberty`, `Bocha (puberty)`, `Between about 9 and 16 the body changes from a child to an adult. Girls and boys grow taller, grow hair, voices change; girls begin to have periods. These changes are normal. Ask a trusted adult (parent, teacher, nurse) any question.`, `Pakeng tsa lilemo tse ka bang 9 le 16 'mele o fetoha ho tloha ho ngoana ho ea ho motho e moholo. Banana le bashanyana ba hola ba ba balelele, ba mela moriri, mantsoe a fetoha; banana ba qala ho ea khoeling. Liphetoho tsena li tloaelehile. Botsa motho e moholo eo u mo tšepang (motsoali, mosuoe, mooki) potso efe kapa efe.`),
    S(`HIV`, `HIV`, `HIV is a virus that weakens the body's defence. It spreads through blood and unprotected sex, and from mother to baby – **not** by hugging, sharing cups or shaking hands. People living with HIV who take their ARVs every day live long, healthy lives. Treat everyone with respect.`, `HIV ke vaerase e fokolisang tšireletso ea 'mele. E fetela ka mali le thobalano e sa sireletsoang, le ho tloha ho 'mè ho ea ho lesea – **eseng** ka ho haka, ho arolelana linoelo kapa ho tšoarana ka matsoho. Batho ba phelang le HIV ba noang li-ARV letsatsi le leng le le leng ba phela nako e telele ba phetse hantle. Hlompha bohle.`),
    S(`Say no to drugs`, `Hana lithethefatsi`, `Dagga, alcohol, glue and cigarettes harm the brain, lungs and liver of growing children. If someone pressures you: say **"No, thank you"**, walk away, and tell a trusted adult. Real friends respect your choice.`, `Matekoane, joala, sekhomaretsi le koae li senya boko, matšoafo le sebete sa bana ba holang. Haeba motho a u qobella: re **"Che, kea leboha"**, tsamaea, 'me u bolelle motho e moholo eo u mo tšepang. Metsoalle ea 'nete e hlompha khetho ea hau.`)
  ],
  words: [['healthy', 'phetseng hantle'], ['virus', 'vaerase'], ['respect', 'hlompha'], ['trust', 'tšepa'], ['say no', 'hana']],
  quiz: [
    Q(`HIV is NOT spread by…`, `HIV HA E fetisoe ka…`, [['hugging and sharing cups', 'ho haka le ho arolelana linoelo'], ['blood', 'mali'], ['unprotected sex', 'thobalano e sa sireletsoang'], ['mother to baby without treatment', "'mè ho ea ho lesea ntle le kalafo"]], 0),
    Q(`Someone offers you dagga. A good answer is…`, `Motho o u fa matekoane. Karabo e ntle ke…`, [['"No, thank you" and walk away', '"Che, kea leboha" ebe u tsamaea'], ['"Maybe later"', '"Mohlomong hamorao"'], ['Take it to be polite', 'E nke ho ba le mekhoa'], ['Keep it secret', 'E boloke e le lekunutu']], 0),
    TF(`Puberty changes are normal.`, `Liphetoho tsa bocha li tloaelehile.`, true)

{ id: 'e5-nouns', grade: 5, outcome: 'LO 9, 10, 11', title: L(`Nouns: proper, common, compound, plural`, `Mabitso (nouns): a ikhethileng, a tloaelehileng, a kopantsoeng, bongata`),
  sections: [
    S(`Common and proper nouns`, `Mabitso a tloaelehileng le a ikhethileng`, `A **noun** names a person, place, animal or thing. **Common nouns** are general: *girl, river, school*. **Proper nouns** are special names and always start with a **capital letter**: *Palesa, the Senqu River, Moshoeshoe II Primary School, Monday, Lesotho*.`, `**Noun** (lebitso) le reha motho, sebaka, phoofolo kapa ntho. **Common nouns** a akaretsang: *girl, river, school*. **Proper nouns** ke mabitso a ikhethileng 'me kamehla a qala ka **tlhaku e kholo**: *Palesa, the Senqu River, Moshoeshoe II Primary School, Monday, Lesotho*.`),
    S(`Compound nouns`, `Mabitso a kopantsoeng`, `Two words joined to make one noun: *foot + ball = football*, *class + room = classroom*, *sun + flower = sunflower*, *bus stop*, *mother-in-law*.`, `Mantsoe a mabeli a kopantsoeng ho etsa lebitso le le leng: *foot + ball = football*, *class + room = classroom*, *sun + flower = sunflower*, *bus stop*, *mother-in-law*.`),
    S(`Singular and plural`, `Bonngoe le bongata`, `Most nouns add **-s**: book → books. Words ending in s, x, sh, ch add **-es**: box → boxes, church → churches. Consonant + y → **-ies**: baby → babies. Some are irregular: child → **children**, man → **men**, woman → **women**, tooth → **teeth**, mouse → **mice**, sheep → **sheep**.`, `Mabitso a mangata a eketsa **-s**: book → books. A felang ka s, x, sh, ch a eketsa **-es**: box → boxes. Konsonante + y → **-ies**: baby → babies. A mang ha a latele molao: child → **children**, man → **men**, woman → **women**, tooth → **teeth**, mouse → **mice**, sheep → **sheep**.`)
  ],
  words: [['noun', 'lebitso'], ['capital letter', 'tlhaku e kholo'], ['plural', 'bongata'], ['singular', 'bonngoe'], ['child / children', 'ngoana / bana']],
  quiz: [

{ id: 'e5-tenses', grade: 5, outcome: 'LO 12', title: L(`Past, present and future tenses`, `Linako tsa leetsi: e fetileng, ea joale le e tlang`),
  sections: [
    S(`Three times`, `Linako tse tharo`, `- **Present**: now or every day — *I **walk** to school. She **walks** to school.*\n- **Past**: already happened — *I **walked** to school yesterday.*\n- **Future**: will happen — *I **will walk** to school tomorrow.*`, `- **Present** (joale): hona joale kapa kamehla — *I **walk** to school.*\n- **Past** (e fetileng): ho se ho etsahetse — *I **walked** to school yesterday.*\n- **Future** (e tlang): ho tla etsahala — *I **will walk** to school tomorrow.*`),
    S(`Irregular past tense`, `Past tense e sa lateleng molao`, `Many common verbs do not add -ed: go → **went**, eat → **ate**, see → **saw**, come → **came**, run → **ran**, write → **wrote**, take → **took**, buy → **bought**, sing → **sang**. Learn them by saying them aloud!`, `Maetsi a mangata a tloaelehileng ha a eketse -ed: go → **went**, eat → **ate**, see → **saw**, come → **came**, run → **ran**, write → **wrote**, take → **took**, buy → **bought**, sing → **sang**. A ithute ka ho a bua ka lentsoe!`)
  ],
  words: [['yesterday', 'maobane'], ['today', 'kajeno'], ['tomorrow', 'hosane'], ['verb', 'leetsi']],
  quiz: [

    Q(`She ___ water every morning.`, `O ___ metsi hoseng ho hong le ho hong.`, ['drink', 'drinks', 'drank', 'drinking'], 1),

    Q(`The past tense of "buy" is…`, `Past tense ea "buy" ke…`, ['buyed', 'bought', 'brought', 'buys'], 1)
  ] },

{ id: 'e5-adjectives', grade: 5, outcome: 'LO 13, 15, 16, 20', title: L(`Adjectives, articles and pronouns`, `Mahlalosi, a/an/the le liemeli (pronouns)`),
  sections: [
    S(`Comparing with adjectives`, `Ho bapisa ka mahlalosi`, `Short adjectives: *tall → taller → tallest*, *cold → colder → coldest*, *big → bigger → biggest*. Long adjectives use more/most: *beautiful → more beautiful → most beautiful*. Irregular: *good → better → best*, *bad → worse → worst*.\n*Thabana Ntlenyana is the **highest** mountain in Southern Africa.*`, `Mahlalosi a makhutšoanyane: *tall → taller → tallest*. A malelele a sebelisa more/most: *beautiful → more beautiful → most beautiful*. A sa lateleng molao: *good → better → best*, *bad → worse → worst*.\n*Thabana Ntlenyana is the **highest** mountain in Southern Africa.* (Ke thaba e telele ka ho fetisisa Afrika Boroa.)`),
    S(`a, an, the`, `a, an, the`, `Use **a** before a consonant sound: *a cow, a book*. Use **an** before a vowel sound: *an egg, an orange, an hour* (the h is silent!). Use **the** for a particular thing we already know: *the sun, the teacher in our class*.`, `Sebelisa **a** pele ho molumo oa konsonante: *a cow*. Sebelisa **an** pele ho molumo oa voukale: *an egg, an orange, an hour* (h ha e utloahale!). Sebelisa **the** bakeng sa ntho e tsebahalang: *the sun*.`),
    S(`Pronouns`, `Liemeli (pronouns)`, `Pronouns replace nouns so we do not repeat them: *I, you, he, she, it, we, they / me, him, her, us, them*. *Lineo is kind. **She** helps everyone.*\nDemonstrative: *this, that, these, those*. Relative: *who* (people), *which* (things), *that*. *The boy **who** won is my cousin.*`, `Pronouns li nkela mabitso sebaka e le hore re se a phete: *I, you, he, she, it, we, they*. *Lineo is kind. **She** helps everyone.*\nTse supang: *this, that, these, those*. Tse amanang: *who* (batho), *which* (lintho), *that*.`)
  ],
  words: [['adjective', 'lehlalosi'], ['bigger', 'kholoanyane'], ['the biggest', 'e kholo ka ho fetisisa'], ['pronoun', 'seemeli']],
  quiz: [
    Q(`Maseru is ___ than Butha-Buthe.`, `Maseru e ___ ho Butha-Buthe.`, ['big', 'bigger', 'biggest', 'more big'], 1),
    Q(`She is the ___ runner in our school.`, `Ke semathi se ___ sekolong sa rona.`, ['fast', 'faster', 'fastest', 'most fast'], 2),
    Q(`I ate ___ apple.`, `Ke jele ___ apole.`, ['a', 'an', 'the a', '–'], 1),
    Q(`Thabo and I are friends. ___ play together.`, `Thabo le nna re metsoalle. ___ bapala hammoho.`, ['They', 'We', 'Us', 'Them'], 1),
    Q(`The woman ___ sells fruit is my aunt.`, `Mosali ___ rekisang litholoana ke 'mangoane oa ka.`, ['which', 'who', 'what', 'whose'], 1)
  ] },

{ id: 'e5-punctuation', grade: 5, outcome: 'LO 14, 17, 18', hard: true, title: L(`Letters, capitals, punctuation and silent letters`, `Litlhaku, litlhaku tse kholo, matšoao le litlhaku tse khutsitseng`),
  sections: [
    S(`The alphabet and capital letters`, `Alefabeta le litlhaku tse kholo`, `English has 26 letters: 5 **vowels** (a, e, i, o, u) and 21 **consonants**. Use a CAPITAL letter:\n- at the start of every sentence\n- for names of people and places (*Thabo, Quthing*)\n- for days and months (*Monday, March*)\n- for the word *I*`, `Senyesemane se na le litlhaku tse 26: **livoukale** tse 5 (a, e, i, o, u) le **likonsonante** tse 21. Sebelisa tlhaku e KHOLO:\n- qalong ea polelo e 'ngoe le e 'ngoe\n- mabitsong a batho le libaka (*Thabo, Quthing*)\n- matsatsing le likhoeling (*Monday, March*)\n- lentsoeng *I*`),
    S(`Punctuation marks`, `Matšoao a puo`, `- Full stop **.** ends a sentence.\n- Question mark **?** ends a question: *Where do you live?*\n- Exclamation mark **!** shows strong feeling: *Help!*\n- Comma **,** separates items in a list: *maize, beans, and pumpkins*\n- Apostrophe **'** shows ownership: *Lerato's bag*\n- Quotation marks **" "** show what someone said.`, `- Khutlo **.** e qetella polelo.\n- Letšoao la potso **?** le qetella potso.\n- Letšoao la maikutlo **!** le bontša maikutlo a matla.\n- Feeloane **,** e arola lintho lethathamong.\n- Apostrophe **'** e bontša beng: *Lerato's bag*\n- Matšoao a qotso **" "** a bontša seo motho a se buileng.`),
    S(`Silent letters`, `Litlhaku tse khutsitseng`, `Some letters are written but not said: **k**nife, **k**now, **w**rite, **w**rong, lam**b**, clim**b**, **h**our, ta**l**k, lis**t**en, i**s**land. Read them aloud with the Read-to-me button and listen.`, `Litlhaku tse ling lia ngoloa empa ha li bitsoe: **k**nife, **k**now, **w**rite, lam**b**, **h**our, ta**l**k, lis**t**en. Li bale ka konopo ea Mpalle 'me u mamele.`)
  ],
  words: [['letter', 'tlhaku'], ['full stop', 'khutlo'], ['question', 'potso'], ['sentence', 'polelo'], ['spell', 'peleta']],
  quiz: [
    Q(`Which sentence is correct?`, `Ke polelo efe e nepahetseng?`, ['where is the school', 'Where is the school?', 'where is the School?', 'Where is the school.'], 1),
    Q(`Which letter is silent in "knife"?`, `Ke tlhaku efe e khutsitseng ho "knife"?`, ['k', 'n', 'f', 'i'], 0),
    Q(`Which word needs a capital letter?`, `Ke lentsoe lefe le hlokang tlhaku e kholo?`, ['friday', 'apple', 'river', 'happy'], 0),
    N(`How many vowels are in the English alphabet?`, `Ho na le livoukale tse kae alefabeteng ea Senyesemane?`, 5),
    Q(`"This is Palesas book." What is missing?`, `"This is Palesas book." Ho haella eng?`, [['an apostrophe: Palesa\'s', 'apostrophe: Palesa\'s'], ['a question mark', 'letšoao la potso'], ['a comma', 'feeloane'], ['nothing', 'ha ho letho']], 0)
  ], practice: null },

{ id: 'e5-words', grade: 5, outcome: 'LO 25, 26, 28, 33', title: L(`Similes, synonyms, antonyms and homonyms`, `Lipapiso, mantsoe a tšoanang, a hananang le a ngoloang ka ho tšoana`),
  sections: [
    S(`Similes`, `Lipapiso (similes)`, `A simile compares two things using **as** or **like**: *as white as snow*, *as brave as a lion*, *as busy as a bee*, *she runs like the wind*, *as strong as an ox*.`, `Simile e bapisa lintho tse peli ka **as** kapa **like**: *as white as snow* (tšoeu joaloka lehloa), *as brave as a lion* (sebete joaloka tau), *as busy as a bee*.`),
    S(`Synonyms and antonyms`, `Mantsoe a tšoanang le a hananang`, `**Synonyms** mean the same: *big – large*, *happy – glad*, *begin – start*. **Antonyms** mean the opposite: *hot – cold*, *up – down*, *early – late*, *strong – weak*.`, `**Synonyms** a bolela ntho e tšoanang: *big – large*, *happy – glad*. **Antonyms** a hanana: *hot – cold* (chesa – bata), *up – down*, *early – late*.`),
    S(`Male and female words`, `Mantsoe a botona le a botšehali`, `*boy – girl, man – woman, father – mother, king – queen, uncle – aunt, bull – cow, ram – ewe, cock – hen, prince – princess*.`, `*boy – girl, man – woman, father – mother, king – queen (morena – mofumahali), uncle – aunt, bull – cow (poho – khomo), ram – ewe, cock – hen (mokoko – sethole)*.`),
    S(`Words that look the same (homonyms)`, `Mantsoe a ngoloang ka ho tšoana`, `Some words are spelt the same but mean different things: *a **bat** (animal) / a cricket **bat***, *a **watch** on my wrist / **watch** TV*, *the river **bank** / the **bank** for money*, *a **light** bag / turn on the **light***.`, `Mantsoe a mang a ngoloa ka ho tšoana empa a bolela lintho tse fapaneng: *bat* (mankhane / thupa ea cricket), *watch* (oatše / shebella), *bank* (lebopo la noka / banka).`)
  ],
  words: [['simile', 'papiso'], ['opposite', 'e hananang'], ['same', 'e tšoanang'], ['lion', 'tau'], ['snow', 'lehloa']],
  quiz: [
    Q(`As white as…`, `Tšoeu joaloka…`, ['snow', 'coal', 'grass', 'night'], 0),
    Q(`The antonym of "early" is…`, `Antonym ea "early" ke…`, ['soon', 'late', 'first', 'quick'], 1),
    Q(`A synonym for "begin" is…`, `Synonym ea "begin" ke…`, ['end', 'start', 'stop', 'finish'], 1),
    Q(`The female of "king" is…`, `Botšehali ba "king" ke…`, ['princess', 'queen', 'aunt', 'lady'], 1),
    Q(`In which sentence does "bat" mean an animal?`, `Ke polelo efe moo "bat" e bolelang phoofolo?`, ['The bat flew out of the cave at night.', 'He hit the ball with a bat.', 'Pass me the bat.', 'The bat broke.'], 0)
  ] },

{ id: 'e5-writing', grade: 5, outcome: 'LO 5, 27, 29, 32', title: L(`Writing: a friendly letter and a composition`, `Ho ngola: lengolo la setsoalle le moqoqo`),
  sections: [
    S(`A friendly letter`, `Lengolo la setsoalle`, `1. Your address and the date (top right)\n2. Greeting: *Dear Neo,*\n3. Opening: ask how they are\n4. Body: your news in short paragraphs\n5. Closing: *Your friend,* / *Love,*\n6. Your name`, `1. Aterese ea hau le letsatsi (holimo ka ho le letona)\n2. Tumeliso: *Dear Neo,*\n3. Qalo: botsa hore na o phela joang\n4. 'Mele: litaba tsa hau ka lirapa tse khutšoanyane\n5. Phetho: *Your friend,* / *Love,*\n6. Lebitso la hau`,
      { ex: L(`P.O. Box 12\nMaseru 100\n15 March 2026\n\nDear Neo,\n\nHow are you? I am well. Last Saturday our school had a sports day. I came second in the 100 m race!\n\nPlease write back soon and tell me about your new school.\n\nYour friend,\nLerato`, `(Mohlala ka Senyesemane – sheba ka holimo)`) }),
    S(`A composition (2–3 paragraphs)`, `Moqoqo (lirapa tse 2–3)`, `Plan first! Paragraph 1: **introduction** (what is it about?). Paragraph 2: **details** (what happened, in order: first, then, after that). Paragraph 3: **conclusion** (how you felt, what you learned). Then **edit**: check capitals, full stops and spelling.`, `Rala pele! Serapa sa 1: **kenyelletso** (ke ka eng?). Serapa sa 2: **lintlha** (ho etsahetse eng, ka tatellano: first, then, after that). Serapa sa 3: **phetho** (u ikutloile joang, u ithutile eng). Ebe u **lokisa**: hlahloba litlhaku tse kholo, likhutlo le mopeleto.`),
    S(`Giving instructions`, `Ho fana ka litaelo`, `Use numbers and command verbs: *1. **Fill** the pot with water. 2. **Boil** the water. 3. **Add** maize meal slowly. 4. **Stir** well.*`, `Sebelisa linomoro le maetsi a laelang: *1. **Fill** the pot with water. 2. **Boil** the water. 3. **Add** maize meal slowly. 4. **Stir** well.*`)
  ],
  words: [['letter', 'lengolo'], ['address', 'aterese'], ['paragraph', 'serapa'], ['friend', 'motsoalle'], ['write', 'ngola']],
  quiz: [
    Q(`Where do you write your address in a friendly letter?`, `Aterese u e ngola kae lengolong la setsoalle?`, [['top right', 'holimo ka ho le letona'], ['bottom left', 'tlase ka ho le letšehali'], ['in the middle', 'bohareng'], ['nowhere', 'ha ho kae']], 0),
    Q(`Which is a good greeting for a letter to a friend?`, `Ke tumeliso efe e ntle lengolong ho motsoalle?`, ['Dear Neo,', 'To whom it may concern', 'Hey you', 'Sir/Madam'], 0),
    Q(`The last paragraph of a composition is the…`, `Serapa sa ho qetela sa moqoqo ke…`, [['conclusion', 'phetho'], ['introduction', 'kenyelletso'], ['title', 'sehlooho'], ['address', 'aterese']], 0)
  ] },

{ id: 'e6-conjunctions', grade: 6, title: L(`Joining sentences: conjunctions and adverbs`, `Ho kopanya lipolelo: likhokahanyi le li-adverb`),
  sections: [
    S(`Conjunctions`, `Likhokahanyi (conjunctions)`, `Join two short sentences: *and* (adds), *but* (contrast), *so* (result), *because* (reason), *although*, *when*, *or*.\n*It rained. We stayed inside.* → *It rained **so** we stayed inside.*\n*I was late **because** the taxi broke down.*`, `Kopanya lipolelo tse peli tse khutšoanyane: *and* (le), *but* (empa), *so* (kahoo), *because* (hobane), *although* (leha), *when* (ha), *or* (kapa).`),
    S(`Adverbs`, `Li-adverb`, `Adverbs tell **how** (manner: *slowly, carefully*), **when** (time: *yesterday, soon, now*) and **where** (place: *here, outside, everywhere*) something happens. *She sang **beautifully** **at the concert** **last night**.*`, `Li-adverb li bolela **joang** (*slowly* – butle), **neng** (*yesterday* – maobane) le **hokae** (*outside* – ka ntle) ketso e etsahalang.`)
  ],
  words: [['because', 'hobane'], ['but', 'empa'], ['so', 'kahoo'], ['slowly', 'butle'], ['outside', 'ka ntle']],
  quiz: [
    Q(`I wanted to play, ___ it was raining.`, `Ke ne ke batla ho bapala, ___ pula e ne e na.`, ['but', 'because', 'and', 'so'], 0),
    Q(`She was tired ___ she went to bed early.`, `O ne a khathetse ___ a robala kapele.`, ['so', 'but', 'or', 'although'], 0),
    Q(`In "He walked slowly", "slowly" tells us…`, `Ho "He walked slowly", "slowly" e re bolella…`, [['how', 'joang'], ['when', 'neng'], ['where', 'hokae'], ['who', 'mang']], 0)
  ] },

{ id: 'e6-voice', grade: 6, title: L(`Active and passive; direct and reported speech`, `Active le passive; puo e tobileng le e phetoang`),
  sections: [
    S(`Active and passive`, `Active le passive`, `Active: *The dog **chased** the cat.* (the doer comes first)\nPassive: *The cat **was chased** by the dog.* (the receiver comes first)\nPassive uses *was/were + past participle*.`, `Active: *The dog chased the cat.* (moetsi o tla pele)\nPassive: *The cat was chased by the dog.* (moetsuoa o tla pele)`),
    S(`Direct and reported speech`, `Puo e tobileng le e phetoang`, `Direct: *Thabo said, "I am hungry."*\nReported: *Thabo said **that he was** hungry.*\nIn reported speech, the tense moves back (am → was, will → would) and pronouns change (I → he/she).`, `E tobileng: *Thabo said, "I am hungry."*\nE phetoang: *Thabo said that he was hungry.*\nPuong e phetoang nako e khutlela morao (am → was) 'me liemeli lia fetoha (I → he/she).`)
  ],
  words: [['said', 'itse'], ['speech', 'puo'], ['hungry', 'lapile']],
  quiz: [
    Q(`Passive of "Mpho wrote the letter":`, `Passive ea "Mpho wrote the letter":`, ['The letter was written by Mpho.', 'The letter writes Mpho.', 'Mpho was written.', 'The letter wrote by Mpho.'], 0),
    Q(`Reported speech of: She said, "I am happy."`, `Puo e phetoang ea: She said, "I am happy."`, ['She said that she was happy.', 'She said that I am happy.', 'She says I happy.', 'She said she is be happy.'], 0)
  ] },

{ id: 'e6-reading', grade: 6, outcome: 'LO 1, 3, 7, 8', title: L(`Reading for information, speeches and debates`, `Ho bala ho fumana tlhahisoleseling, lipuo le likhang`),
  sections: [
    S(`Read for specific information`, `Bala ho fumana tlhahisoleseling e itseng`, `**Skim**: read quickly to get the main idea (titles, first lines). **Scan**: look quickly for one fact (a name, a number, a date). Then read carefully the part you need.`, `**Skim**: bala kapele ho fumana mohopolo o moholo. **Scan**: batla kapele ntlha e le 'ngoe (lebitso, nomoro, letsatsi). Ebe u bala ka hloko karolo eo u e hlokang.`),
    S(`Making a speech / defending your view`, `Ho etsa puo / ho sireletsa maikutlo`, `1. Greet the audience: *Good morning, Principal, teachers and fellow learners.*\n2. Say your point of view clearly.\n3. Give 2–3 reasons with examples.\n4. Conclude and thank the audience.\nIn a **debate**: listen to the other side, answer politely: *I respect my friend's point, but…*`, `1. Lumelisa bamameli.\n2. Bolela maikutlo a hau ka ho hlaka.\n3. Fana ka mabaka a 2–3 le mehlala.\n4. Qetella 'me u lebohe bamameli.\nNgangisanong: mamela lehlakore le leng, araba ka tlhompho.`)
  ],
  words: [['debate', 'ngangisano'], ['audience', 'bamameli'], ['reason', 'lebaka'], ['opinion', 'maikutlo']],
  quiz: [
    Q(`To find one date quickly in a page, you…`, `Ho fumana letsatsi le le leng kapele leqepheng, u…`, ['scan', 'skim', 'sing', 'write'], 0),
    Q(`A polite way to disagree in a debate:`, `Tsela e hlomphehang ea ho se lumellane ngangisanong:`, ['I respect your point, but…', 'You are stupid.', 'Be quiet!', 'I will not listen.'], 0)
  ] },

/* ======================= GRADE 7 ======================= */
{ id: 'e7-formal', grade: 7, title: L(`Formal letters and filling in forms`, `Mangolo a semmuso le ho tlatsa liforomo`),
  sections: [
    S(`A formal letter`, `Lengolo la semmuso`, `Used for the principal, the chief, a company or a newspaper. It has **two addresses** (yours top right, theirs on the left), *Dear Sir/Madam*, a **subject line** (*RE: Request for a school library*), polite formal language, and ends *Yours faithfully* (if you started *Dear Sir/Madam*) or *Yours sincerely* (if you used their name).`, `Le sebelisoa ho mosuoe-hlooho, morena, k'hamphani kapa koranta. Le na le **liaterese tse peli**, *Dear Sir/Madam*, **mola oa taba** (*RE: …*), puo e hlomphehang, 'me le qetella ka *Yours faithfully* kapa *Yours sincerely*.`),
    S(`Forms`, `Liforomo`, `Read every box before writing. Use CAPITAL letters if asked (BLOCK LETTERS). Surname = family name. DOB = date of birth. Sign only where it says *Signature*. Never give your PIN or password to anyone.`, `Bala lebokose le leng le le leng pele u ngola. Sebelisa litlhaku tse KHOLO haeba ho kopuoa. Surname = fane. DOB = letsatsi la tsoalo. Saena feela moo ho reng *Signature*. Le ka mohla u se ke ua fa motho PIN kapa password ea hau.`)
  ],
  words: [['surname', 'fane'], ['signature', 'tekeno'], ['date of birth', 'letsatsi la tsoalo'], ['request', 'kopo']],

    S(`Figures of speech`, `Lipuo tsa setšoantšo`, `- **Metaphor**: says something IS something else: *The classroom was a zoo.*\n- **Personification**: gives human actions to things: *The wind whispered.*\n- **Alliteration**: same first sound: *Big brown bears bounce.*\n- **Onomatopoeia**: sound words: *buzz, bang, moo.*\n- **Hyperbole**: huge exaggeration: *I have told you a million times!*`, `- **Metaphor**: e re ntho E LE ntho e 'ngoe: *The classroom was a zoo.*\n- **Personification**: e fa lintho liketso tsa batho: *The wind whispered.*\n- **Alliteration**: molumo o tšoanang qalong.\n- **Onomatopoeia**: mantsoe a melumo: *buzz, bang, moo.*\n- **Hyperbole**: ho feteletsa haholo.`),

{ id: 'st5-lumeliso', grade: 5, outcome: 'LO 9, 10', title: L(`Greetings and respect`, `Lumeliso le tlhompho`),
  sections: [
    S(`How Basotho greet`, `Kamoo Basotho ba lumelisanang kateng`, `The younger person greets the older person first. To one man: *Lumela ntate.* To one woman: *Lumela 'mè.* To many people, or to an elder with respect: *Lumelang.* Answer: *E, ntate / E, 'mè.* Then ask: *Le phela joang?* – *Re phela hantle, le uena le phela joang?*`, `E monyenyane o lumelisa e moholo pele. Ho monna a le mong: *Lumela ntate.* Ho mosali a le mong: *Lumela 'mè.* Ho batho ba bangata, kapa ho e moholo ka tlhompho: *Lumelang.* Karabo: *E, ntate / E, 'mè.* Ebe u botsa: *Le phela joang?* – *Re phela hantle, le uena le phela joang?*`),
    S(`Respect in words and actions`, `Tlhompho lipuong le liketsong`, `- We use *le* (plural) when speaking to an elder: *Ntate, le kae?* not *u kae?*\n- We greet with the right hand, sometimes holding the right arm with the left hand.\n- We do not interrupt elders; we wait to be given a turn.\n- We say *Kea leboha* (thank you) and *Ka kopo* (please).\n- When leaving: *Sala hantle* (to the one staying) – *Tsamaea hantle* (to the one leaving).`, `- Re sebelisa *le* (bongata) ha re bua le e moholo: *Ntate, le kae?* eseng *u kae?*\n- Re lumelisa ka letsoho le letona, ka linako tse ling re tšoere letsoho le letona ka le letšehali.\n- Ha re kene baholo hanong; re emela ho fuoa sebaka.\n- Re re *Kea leboha* le *Ka kopo*.\n- Ha re tsamaea: *Sala hantle* (ho ea salang) – *Tsamaea hantle* (ho ea tsamaeang).`),
    S(`Family names of respect`, `Mabitso a tlhompho a lelapa`, `*Ntate-moholo* (grandfather), *Nkhono* (grandmother), *Ntate* (father, or any older man), *'Mè* (mother, or any older woman), *Abuti* (older brother/young man), *Ausi* (older sister/young woman), *Malome* (uncle, mother's brother), *Rakhali* (aunt, father's sister).`, `*Ntate-moholo*, *Nkhono*, *Ntate*, *'Mè*, *Abuti*, *Ausi*, *Malome* (moena oa 'mè), *Rakhali* (khaitseli ea ntate).`)
  ],
  words: [['greet', 'lumelisa'], ['thank you', 'kea leboha'], ['please', 'ka kopo'], ['respect', 'tlhompho'], ['grandmother', 'nkhono'], ['uncle (mother\'s brother)', 'malome'], ['goodbye (to one staying)', 'sala hantle']],

    Q(`Who greets first?`, `Ke mang ea lumelisang pele?`, [['the younger person', 'e monyenyane'], ['the older person', 'e moholo'], ['nobody', 'ha ho motho'], ['the visitor only', 'moeti feela']], 0),

{ id: 'st5-lilotho', grade: 5, outcome: 'LO 13, 15', title: L(`Riddles (lilotho) and traditional games`, `Lilotho le lipapali tsa setso`),
  sections: [
    S(`How to play lilotho`, `Mokhoa oa ho lothana`, `The asker begins: *"Ka u lotha!"* The other answers: *"Ka u lotholla!"* Then the riddle is said. If you cannot guess, you "pay" with a cow (a pretend one!) and the asker tells the answer. Riddles teach us to think and to look closely at nature.`, `Ea lothang o qala: *"Ka u lotha!"* E mong o araba: *"Ka u lotholla!"* Ebe lelotho lea boleloa. Haeba u sa khone ho le fumana, u "lefa" ka khomo ('me ke ea papali!) ebe ea lothang o bolela karabo. Lilotho li re ruta ho nahana le ho sheba tlhaho ka hloko.`),
    S(`Riddles about plants`, `Lilotho tseo likarabo tsa tsona e leng limela`, `- *Ngoana ea apereng likobo tse ngata; ha u li hlobola oa lla.* – **Eiee** (an onion: peeling it makes you cry)\n- *Ngoanana ea moriri o mosehla o ipatile ka har'a likobo tse tala.* – **Poone** (a mealie cob)\n- *Ntlo e tala ka ntle, e khubelu ka hare, e tletse bana ba batšo.* – **Lehapu** (a watermelon)\n- *Ke hola ke shebile letsatsi kamehla.* – **Soneblomo** (sunflower)`, `- *Ngoana ea apereng likobo tse ngata; ha u li hlobola oa lla.* – **Eiee**\n- *Ngoanana ea moriri o mosehla o ipatile ka har'a likobo tse tala.* – **Poone**\n- *Ntlo e tala ka ntle, e khubelu ka hare, e tletse bana ba batšo.* – **Lehapu**\n- *Ke hola ke shebile letsatsi kamehla.* – **Soneblomo**`),
    S(`Traditional games`, `Lipapali tsa setso`, `**Morabaraba** (a board game with "cows"), **liketoane** (throwing and catching stones), **mohobelo** and **mokhibo** (dances), **khati** (skipping rope with songs), **lesokoana** (a game with a stick). Try Morabaraba in the Games section!`, `**Morabaraba** (papali ea boto ka "likhomo"), **liketoane** (ho akhela le ho tšoasa majoana), **mohobelo** le **mokhibo** (litantši), **khati** (ho tlola thapo ka lipina), **lesokoana**. Leka Morabaraba karolong ea Lipapali!`)
  ],
  words: [['riddle', 'lelotho'], ['onion', 'eiee'], ['maize', 'poone'], ['watermelon', 'lehapu'], ['game', 'papali'], ['dance', 'tantši']],

    Q(`"A child wearing many blankets; when you take them off, you cry."`, `"Ngoana ea apereng likobo tse ngata; ha u li hlobola oa lla."`, [['onion', 'eiee'], ['maize', 'poone'], ['pumpkin', 'mokhopu'], ['potato', 'tapole']], 0),
