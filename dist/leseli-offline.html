/* ---------- quiz ---------- */
function renderQuiz(body, questions, meta) {
  if (!questions || !questions.length) { body.appendChild(h('p', { class: 'empty' }, T('noQuiz'))); return; }
  const qs = meta.noShuffle ? questions : shuffle(questions).slice(0, meta.max || 8);
  let i = 0, score = 0; const answers = [];
  const wrap = h('div'); body.appendChild(wrap);
  const lang = I18N.content();
  const draw = () => {
    wrap.innerHTML = '';
    if (i >= qs.length) return finish();
    const q = qs[i];
    wrap.appendChild(h('div', { class: 'q-progress', role: 'progressbar', 'aria-valuenow': i, 'aria-valuemax': qs.length }, h('i', { style: { width: (i / qs.length * 100) + '%' } })));
    wrap.appendChild(h('div', { class: 'small muted' }, `${T('question')} ${i + 1} / ${qs.length}`));
    const card = h('section', { class: 'card' }, biText('div', q.q, 'q-text', true));
    wrap.appendChild(card);
    const fb = h('div', { 'aria-live': 'assertive' });
    const after = (ok, correctText) => {
      if (ok) score++; answers.push(ok ? 1 : 0); react(ok);
      fb.innerHTML = '';
      fb.appendChild(h('div', { class: 'feedback ' + (ok ? 'good' : 'bad') }, icon(ok ? 'check' : 'x'), h('div', {}, ut('div', ok ? 'correct' : 'wrong'), !ok ? h('div', { 'data-read': '', lang: I18N.ui() }, T('answerIs') + ': ' + correctText) : null, q.x ? biText('div', q.x, 'small') : null)));
      fb.appendChild(h('button', { class: 'btn primary block', onclick: () => { i++; draw(); } }, i + 1 < qs.length ? T('next') : T('seeScore'), icon('next')));
      if (Store.s.settings.autoRead || Store.s.settings.vision) Speech.speakChunks(chunksOf(fb)); else Speech.say((ok ? T('correct') : T('wrong')), I18N.ui());
      setTimeout(() => fb.querySelector('.btn').focus(), 50);
    };
    if (q.o) {
      const opts = h('div', { class: 'options', role: 'group' });
      const order = q.keepOrder || q.o.length === 2 ? q.o.map((_, k) => k) : shuffle(q.o.map((_, k) => k));
      order.forEach((k, j) => {
        const [a, b] = tx2(q.o[k]);
        const btn = h('button', { class: 'opt', 'data-read': '', lang: lang === 'en' ? 'en' : 'st' }, h('span', { class: 'letter', 'aria-hidden': 'true' }, 'ABCDEF'[j]), h('span', {}, a, b ? h('div', { class: 'small muted', lang: 'en' }, b) : null));
        btn.onclick = () => {
          $$('.opt', opts).forEach(x => x.disabled = true);
          const ok = k === q.a; btn.classList.add(ok ? 'right' : 'wrong');
          opts.children[order.indexOf(q.a)].classList.add('right');
          after(ok, tx(q.o[q.a], lang === 'en' ? 'en' : 'st'));
        };
        opts.appendChild(btn);
      });
      card.appendChild(opts);
    } else if (q.n !== undefined) {
      card.appendChild(numberPad(val => after(String(val).trim().replace(/\s+/g, ' ') === String(q.n) || (!isNaN(+q.n) && +val === +q.n), String(q.n)), { allowFrac: /\//.test(String(q.n)), allowDot: /\./.test(String(q.n)), allowNeg: String(q.n).startsWith('-') }));
    }
    card.appendChild(h('div', { class: 'sec-tools' }, speakBtn(() => chunksOf(card))));
    wrap.appendChild(fb);
    if (Store.s.settings.autoRead || Store.s.settings.vision) setTimeout(() => Speech.speakChunks(chunksOf(card)), 300);
  };
  const finish = () => {
    const max = qs.length, pct = score / max, stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
    if (meta.onDone) return meta.onDone(score, max, answers, wrap);
    const pr = Store.lesson(meta.id); pr.attempts++; const before = pr.stars;
    if (score > pr.best) pr.best = score; pr.max = max; if (stars > pr.stars) { Store.addStars(stars - pr.stars); pr.stars = stars; }
    Store.log('quiz_done', { id: meta.id, score, max }); Store.save();
    const newB = Badges.check();
    if (stars >= 2) confetti();
    wrap.appendChild(h('section', { class: 'card result-big' }, ut('h2', 'yourScore'), h('div', { class: 'score' }, `${score}/${max}`), h('div', { class: 'stars', 'aria-label': stars + ' ' + T('stars') }, starStr(stars)),
      ut('p', stars === 3 ? 'excellent' : stars >= 1 ? 'goodWork' : 'keepTrying'),
      newB.map(b => h('p', { class: 'pill' }, b.emo + ' ' + T('newBadge') + ': ' + tx(b.name)))));
    add(wrap, [h('div', { class: 'stack' },
      h('button', { class: 'btn block', onclick: () => { i = 0; score = 0; answers.length = 0; draw(); } }, icon('refresh'), T('tryAgain')),
      h('button', { class: 'btn block', onclick: () => location.replace(`#/lesson/${meta.id}/notes`) }, icon('book'), T('notes')),
      nextLessonBtn(meta.id))]);
    Speech.say(T('yourScore') + ' ' + score + ' / ' + max + '. ' + T(stars === 3 ? 'excellent' : stars >= 1 ? 'goodWork' : 'keepTrying'), I18N.ui());
    if (before === 0 && stars > 0 && Store.s.current && Math.random() < .35) setTimeout(() => quickFeedback(meta.id), 1500);
  };
  draw();
}
function nextLessonBtn(id) {
  const l = Content.lesson(id); if (!l) return null;
  const list = Content.lessons(l.subject, l.grade); const k = list.findIndex(x => x.id === id);
  const n = list[k + 1]; if (!n) return h('a', { class: 'btn primary block', href: '#/subject/' + l.subject }, T('backToSubject'));

}

/* number pad with optional fraction "/" and space for mixed numbers */
function numberPad(onOk, opts) {
  opts = opts || {}; let val = '';
  const box = h('div', { class: 'answer-box', role: 'textbox', 'aria-live': 'polite', 'aria-label': T('yourAnswer') }, '?');
  const set = v => { val = v; box.textContent = val || '?'; };
  const keys = ['7', '8', '9', 'del', '4', '5', '6', 'ok', '1', '2', '3', '0', opts.allowFrac ? '/' : opts.allowDot ? '.' : opts.allowNeg ? '-' : '00', opts.allowFrac ? '␣' : null].filter(Boolean);
  const pad = h('div', { class: 'pad' });
  keys.forEach(k => pad.appendChild(h('button', { type: 'button', class: k === 'ok' ? 'ok' : k === 'del' ? 'del' : '', 'aria-label': k === 'del' ? T('delete') : k === 'ok' ? T('check') : k === '␣' ? T('space') : k, onclick: () => {
    if (k === 'del') set(val.slice(0, -1)); else if (k === 'ok') { if (val) { $$('button', pad).forEach(b => b.disabled = true); onOk(val.trim()); } }
    else if (val.length < 12) set(val + (k === '␣' ? ' ' : k));
    Platform.vibrate(10);
  } }, k === 'del' ? '⌫' : k === 'ok' ? '✓' : k)));
  // physical keyboard support
  const kb = e => { if (!document.body.contains(pad)) { document.removeEventListener('keydown', kb); return; } if (/^[0-9/.\- ]$/.test(e.key)) set(val + e.key); else if (e.key === 'Backspace') set(val.slice(0, -1)); else if (e.key === 'Enter' && val) pad.querySelector('.ok').click(); };
  document.addEventListener('keydown', kb);
  return h('div', {}, box, pad);
}

<script>
/* Interactive learning tools that sit inside lessons (section.tool = 'name').
   All are drawn with HTML/SVG, work with touch, need no internet, and every result is also
   written in words (for screen readers and for learners who cannot see colours). */
'use strict';

const Tools = {};
const toolCard = (titleKey, ...kids) => h('div', { class: 'tool' }, h('h3', {}, '🛠️ ', T(titleKey)), ...kids);
const live = () => h('div', { 'aria-live': 'polite', class: 'small', style: { marginTop: '8px' } });
const say2 = (el, en, st) => { el.innerHTML = ''; const m = I18N.content(); if (m !== 'en') el.appendChild(h('div', { lang: 'st', 'data-read': '' }, st)); if (m !== 'st') el.appendChild(h('div', { lang: 'en', 'data-read': '', class: m === 'both' ? 'muted' : '' }, en)); };

/* place value chart */
Tools.placevalue = function (o) {
  const inp = h('input', { type: 'number', value: o.n || 47305, min: 0, max: 9999999, 'aria-label': T('typeNumber') });
  const out = h('div'); const words = live();
  const draw = () => {
    const n = Math.max(0, Math.min(9999999, Math.floor(+inp.value || 0))); const s = String(n); const cols = Math.max(5, s.length);
    const names = [['ones', 'bonngoe'], ['tens', 'mashome'], ['hundreds', 'makholo'], ['thousands', 'likete'], ['ten thousands', 'mashome a likete'], ['hundred thousands', 'makholo a likete'], ['millions', 'limilione']];
    out.innerHTML = '';
    const t = h('table', { class: 'pv-table' }, h('tr', {}, Array.from({ length: cols }, (_, i) => h('th', {}, tx({ en: names[cols - 1 - i][0], st: names[cols - 1 - i][1] })))), h('tr', {}, s.padStart(cols, ' ').split('').map(d => h('td', {}, d.trim() || '0'))));
    out.appendChild(t);
    const parts = s.split('').map((d, i) => +d * 10 ** (s.length - 1 - i)).filter(Boolean);
    say2(words, `${fmt(n)} = ${parts.map(fmt).join(' + ')}`, `${fmt(n)} = ${parts.map(fmt).join(' + ')}`);
  };
  inp.oninput = draw; draw();
  return toolCard('tryIt', inp, out, words);
};

/* fraction bars – see equivalent fractions */
Tools.fractionbars = function () {
  const st = { a: 1, b: 2, c: 2, d: 4 };
  const area = h('div'); const res = live();
  const row = (k1, k2) => { const r = h('div', { class: 'slider-row' }); return r; };
  const bar = (n, d) => h('div', { class: 'fbar', role: 'img', 'aria-label': `${n}/${d}` }, Array.from({ length: d }, (_, i) => h('i', { class: i < n ? 'on' : '' })));
  const ctl = (key, max, label) => h('label', { class: 'slider-row' }, h('span', {}, label), h('input', { type: 'range', min: 1, max, value: st[key], oninput: e => { st[key] = +e.target.value; if (st.a > st.b) st.a = st.b; if (st.c > st.d) st.c = st.d; draw(); } }), h('b', { class: 'v-' + key }));
  const ctrls = h('div', {}, ctl('a', 12, T('top') + ' 1'), ctl('b', 12, T('bottom') + ' 1'), ctl('c', 12, T('top') + ' 2'), ctl('d', 12, T('bottom') + ' 2'));
  const draw = () => {

    const s = 16, ox = 40, oy = 170; let out = '';
    const iso = (x, y, z) => [ox + (x - y) * s * .87 + d.w * s * .87, oy - (x + y) * s * .5 - z * s];
    for (let z = 0; z < d.h; z++) for (let y = d.w - 1; y >= 0; y--) for (let x = d.l - 1; x >= 0; x--) {
      const p = (a, b, c) => iso(a, b, c).join(',');
      out += `<polygon points="${p(x, y, z + 1)} ${p(x + 1, y, z + 1)} ${p(x + 1, y + 1, z + 1)} ${p(x, y + 1, z + 1)}" fill="#f6b73c" stroke="#7a4b12" stroke-width=".8"/><polygon points="${p(x, y, z)} ${p(x + 1, y, z)} ${p(x + 1, y, z + 1)} ${p(x, y, z + 1)}" fill="#1f4fb5" stroke="#0b2e7a" stroke-width=".8"/><polygon points="${p(x, y, z)} ${p(x, y + 1, z)} ${p(x, y + 1, z + 1)} ${p(x, y, z + 1)}" fill="#4f7bd6" stroke="#0b2e7a" stroke-width=".8"/>`;
    }
    svg.innerHTML = `<svg viewBox="0 0 300 200" width="100%" aria-hidden="true">${out}</svg>`;
    say2(res, `${d.l} × ${d.w} × ${d.h} = ${d.l * d.w * d.h} cubes (cubic units)`, `${d.l} × ${d.w} × ${d.h} = ${d.l * d.w * d.h} likubiki`);
  };
  const sl = (k, lab) => h('label', { class: 'slider-row' }, h('span', {}, lab), h('input', { type: 'range', min: 1, max: 6, value: d[k], oninput: e => { d[k] = +e.target.value; e.target.nextSibling.textContent = d[k]; draw(); } }), h('b', {}, d[k]));
  draw();
  return toolCard('tryIt', svg, sl('l', tx({ en: 'length', st: 'bolelele' })), sl('w', tx({ en: 'width', st: 'bophara' })), sl('h', tx({ en: 'height', st: 'bophahamo' })), res);
};

/* Venn diagram: sets, intersection ∩, union ∪ */
Tools.venn = function (o) {
  const A = o.A || ['Lerato', 'Thabo', 'Palesa', 'Neo', 'Mpho'], B = o.B || ['Neo', 'Mpho', 'Teboho', 'Lineo'];
  const la = o.la || L('Football', 'Bolo ea maoto'), lb = o.lb || L('Netball', 'Netball');
  const both = A.filter(x => B.includes(x)), onlyA = A.filter(x => !B.includes(x)), onlyB = B.filter(x => !A.includes(x));
  const svg = svgEl(`<svg viewBox="0 0 320 200" width="100%" role="img" aria-label="Venn diagram"><rect x="2" y="2" width="316" height="196" rx="10" fill="#fff" stroke="#ccc"/><circle cx="120" cy="105" r="80" fill="rgba(31,79,181,.18)" stroke="#1f4fb5" stroke-width="2"/><circle cx="200" cy="105" r="80" fill="rgba(246,183,60,.3)" stroke="#c88a00" stroke-width="2"/><text x="70" y="22" font-size="13" font-weight="800" fill="#1f4fb5">A: ${esc(tx(la))}</text><text x="190" y="22" font-size="13" font-weight="800" fill="#8a5a00">B: ${esc(tx(lb))}</text>${onlyA.map((n, i) => `<text x="85" y="${70 + i * 18}" font-size="12" text-anchor="middle">${esc(n)}</text>`).join('')}${both.map((n, i) => `<text x="160" y="${90 + i * 18}" font-size="12" text-anchor="middle" font-weight="800">${esc(n)}</text>`).join('')}${onlyB.map((n, i) => `<text x="238" y="${70 + i * 18}" font-size="12" text-anchor="middle">${esc(n)}</text>`).join('')}</svg>`);
  const res = live();
  const show = k => k === 'i' ? say2(res, `A ∩ B (in BOTH sets) = { ${both.join(', ')} }`, `A ∩ B (ho li-set KA BOBELI) = { ${both.join(', ')} }`) : say2(res, `A ∪ B (ALL members, each written once) = { ${A.concat(onlyB).join(', ')} }`, `A ∪ B (litho TSOHLE, e 'ngoe le e 'ngoe hang feela) = { ${A.concat(onlyB).join(', ')} }`);
  return toolCard('tryIt', svg, h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => show('i') }, 'A ∩ B'), h('button', { class: 'btn', onclick: () => show('u') }, 'A ∪ B')), res);
};

/* number line for negative numbers */
Tools.numberline = function () {
  let pos = 0; const svg = h('div'); const res = live();
  const draw = () => { svg.innerHTML = `<svg viewBox="0 0 320 70" width="100%" aria-hidden="true"><line x1="10" y1="40" x2="310" y2="40" stroke="#333" stroke-width="2"/>${Array.from({ length: 21 }, (_, i) => { const v = i - 10, x = 10 + i * 15; return `<line x1="${x}" y1="34" x2="${x}" y2="46" stroke="#333"/><text x="${x}" y="62" font-size="9" text-anchor="middle" fill="${v < 0 ? '#b3261e' : v > 0 ? '#1f4fb5' : '#000'}">${v}</text>`; }).join('')}<circle cx="${10 + (pos + 10) * 15}" cy="40" r="8" fill="#00804a"/></svg>`; say2(res, `You are on ${pos}. ${pos < 0 ? 'Negative: below zero (like −5 °C on a cold Lesotho winter night).' : pos > 0 ? 'Positive: above zero.' : 'Zero.'}`, `U ho ${pos}. ${pos < 0 ? "Ka tlase ho zero (joaloka −5 °C bosiung ba mariha a Lesotho)." : pos > 0 ? 'Ka holimo ho zero.' : 'Zero.'}`); };
  draw();
  return toolCard('tryIt', svg, h('div', { class: 'row center' }, [-5, -1, 1, 5].map(v => h('button', { class: 'btn', onclick: () => { pos = Math.max(-10, Math.min(10, pos + v)); draw(); } }, (v > 0 ? '+' : '') + v))), res);
};

/* candle and jar: oxygen supports burning */
Tools.candle = function () {
  const svg = h('div'); const res = live(); let timer = null;
  const draw = (jar, flame) => { svg.innerHTML = `<svg viewBox="0 0 200 200" width="180" style="display:block;margin:0 auto" aria-hidden="true"><rect x="40" y="180" width="120" height="8" fill="#8b5a2b"/><rect x="88" y="120" width="24" height="60" fill="#fff8e1" stroke="#c9b37a"/><line x1="100" y1="120" x2="100" y2="112" stroke="#333" stroke-width="2"/>${flame > 0 ? `<ellipse cx="100" cy="${102}" rx="${6 * flame}" ry="${14 * flame}" fill="#ffb300"/><ellipse cx="100" cy="105" rx="${3 * flame}" ry="${7 * flame}" fill="#fff59d"/>` : '<path d="M100 110 q6 -14 0 -26 q-6 -10 2 -20" stroke="#999" fill="none" stroke-width="2"/>'}${jar ? `<path d="M${100 - jar} 180 V${80 - jar / 3} q0 -12 12 -12 h${2 * jar - 24} q12 0 12 12 V180" fill="rgba(160,200,255,.25)" stroke="#6b8fc7" stroke-width="3"/>` : ''}</svg>`; };
  const run = size => {
    clearInterval(timer); let f = 1; const secs = size === 'big' ? 9 : 4; let t = 0; draw(size === 'big' ? 60 : 36, f);
    say2(res, 'The jar is over the candle. The flame is using up the oxygen inside…', 'Nkho e koahetse kerese. Lelakabe le sebelisa oksijene e ka hare…');
    timer = setInterval(() => { t += .5; f = Math.max(0, 1 - Math.pow(t / secs, 3)); draw(size === 'big' ? 60 : 36, f); if (f <= 0) { clearInterval(timer); say2(res, `The candle went out after about ${secs} seconds. Fire needs OXYGEN. A ${size === 'big' ? 'BIG jar has more air, so it burned longer' : 'SMALL jar has less air, so it went out quickly'}.`, `Kerese e timile ka mor'a metsotsoana e ka bang ${secs}. Mollo o hloka OKSIJENE. ${size === 'big' ? 'Nkho e KHOLO e na le moea o mongata, kahoo e tukile nako e telele' : "Nkho e NYANE e na le moea o fokolang, kahoo e timile kapele"}.`); } }, 500);
  };
  draw(0, 1);
  return toolCard('experiment', svg, h('div', { class: 'row center' }, h('button', { class: 'btn', onclick: () => run('small') }, tx({ en: 'Small jar', st: 'Nkho e nyane' })), h('button', { class: 'btn', onclick: () => run('big') }, tx({ en: 'Big jar', st: 'Nkho e kholo' })), h('button', { class: 'btn ghost', onclick: () => { clearInterval(timer); draw(0, 1); res.innerHTML = ''; } }, T('reset'))), res);
};

/* simple electric circuit */
Tools.circuit = function () {
  let on = false; const svg = h('div'); const res = live();
  const draw = () => { svg.innerHTML = `<svg viewBox="0 0 260 170" width="100%" aria-hidden="true"><rect x="30" y="30" width="200" height="110" fill="none" stroke="${on ? '#e8761a' : '#555'}" stroke-width="4" stroke-dasharray="${on ? '0' : '0'}"/><rect x="15" y="65" width="30" height="40" fill="#333"/><rect x="22" y="58" width="16" height="7" fill="#999"/><text x="30" y="125" font-size="11" text-anchor="middle">🔋</text><circle cx="130" cy="30" r="18" fill="${on ? '#ffeb3b' : '#eee'}" stroke="#555" stroke-width="2"/>${on ? '<circle cx="130" cy="30" r="30" fill="rgba(255,235,59,.35)"/>' : ''}<line x1="110" y1="140" x2="${on ? 150 : 145}" y2="${on ? 140 : 118}" stroke="#555" stroke-width="5" stroke-linecap="round"/><rect x="100" y="132" width="60" height="16" fill="#fff"/><line x1="105" y1="140" x2="${on ? 155 : 148}" y2="${on ? 140 : 116}" stroke="#1f4fb5" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="140" r="5" fill="#1f4fb5"/><circle cx="155" cy="140" r="5" fill="#1f4fb5"/></svg>`; say2(res, on ? 'Switch CLOSED: the circuit is complete, electricity flows, the bulb lights.' : 'Switch OPEN: there is a gap, electricity cannot flow, the bulb is off.', on ? 'Switch E KOALIEHILE: potoloho e felletse, motlakase oa phalla, bolebe boa khanya.' : 'Switch E BULEHILE: ho na le sekheo, motlakase o ke ke oa phalla, bolebe bo timile.'); };
  draw();
  return toolCard('tryIt', svg, h('button', { class: 'btn primary block', onclick: () => { on = !on; draw(); Platform.vibrate(20); } }, tx({ en: 'Press the switch', st: 'Tobetsa switch' })), res);
};

/* profit calculator for small business (entrepreneurship) */
Tools.profit = function () {
  const f = { cost: 60, n: 12, price: 8 }; const res = live();
  const inp = (k, lab) => h('label', { class: 'slider-row' }, h('span', { class: 'small' }, lab), h('input', { type: 'number', value: f[k], min: 0, oninput: e => { f[k] = +e.target.value || 0; calc(); } }), h('span'));
  const calc = () => { const inc = f.n * f.price, p = inc - f.cost; say2(res, `Income = ${f.n} × M${f.price} = M${inc}. ${p >= 0 ? 'Profit' : 'Loss'} = M${inc} − M${f.cost} = M${Math.abs(p)}. ${p < 0 ? 'Raise the price or lower your costs.' : ''}`, `Chelete e kenang = ${f.n} × M${f.price} = M${inc}. ${p >= 0 ? 'Phaello' : 'Tahlehelo'} = M${inc} − M${f.cost} = M${Math.abs(p)}. ${p < 0 ? 'Nyolla theko kapa u fokotse litšenyehelo.' : ''}`); res.style.color = p >= 0 ? 'var(--green)' : 'var(--red)'; };
  calc();
  return toolCard('tryIt', inp('cost', tx({ en: 'Cost of materials (M)', st: 'Litšenyehelo (M)' })), inp('n', tx({ en: 'Items made', st: 'Lintho tse entsoeng' })), inp('price', tx({ en: 'Price each (M)', st: 'Theko e le ngoe (M)' })), res);
};

/* balance scale for equations */
Tools.balance = function () {
  const x = rnd(2, 9), b = rnd(1, 9); let guess = 1; const svg = h('div'); const res = live();
  const draw = () => { const left = guess + b, right = x + b, tilt = Math.max(-12, Math.min(12, (right - left) * 3)); svg.innerHTML = `<svg viewBox="0 0 300 160" width="100%" aria-hidden="true"><polygon points="150,150 135,120 165,120" fill="#555"/><g transform="rotate(${tilt} 150 70)"><line x1="40" y1="70" x2="260" y2="70" stroke="#333" stroke-width="5"/><rect x="40" y="40" width="70" height="28" rx="6" fill="#1f4fb5"/><text x="75" y="59" fill="#fff" text-anchor="middle" font-weight="800">x + ${b}</text><rect x="190" y="40" width="70" height="28" rx="6" fill="#f6b73c"/><text x="225" y="59" text-anchor="middle" font-weight="800">${x + b}</text></g><line x1="150" y1="70" x2="150" y2="122" stroke="#333" stroke-width="4"/></svg>`; say2(res, `If x = ${guess}: ${guess} + ${b} = ${left} ${left === right ? '= ' + right + '. BALANCED! x = ' + x : left < right ? '< ' + right + ' (too light)' : '> ' + right + ' (too heavy)'}`, `Haeba x = ${guess}: ${guess} + ${b} = ${left} ${left === right ? '= ' + right + '. E LEKANE! x = ' + x : left < right ? '< ' + right + ' (e bobebe haholo)' : '> ' + right + ' (e boima haholo)'}`); if (left === right) react(true); };
  draw();
  return toolCard('tryIt', svg, h('label', { class: 'slider-row' }, h('span', {}, 'x ='), h('input', { type: 'range', min: 0, max: 15, value: guess, oninput: e => { guess = +e.target.value; e.target.nextSibling.textContent = guess; draw(); } }), h('b', {}, guess)), res);
};

/* rain gauge reading */
Tools.raingauge = function () {
  const days = [['Mon', 'Mantaha', rnd(0, 12)], ['Tue', 'Labobeli', rnd(0, 25)], ['Wed', 'Laboraro', rnd(0, 5)], ['Thu', 'Labone', rnd(0, 30)], ['Fri', 'Labohlano', rnd(0, 10)]];
  const tot = days.reduce((a, d) => a + d[2], 0); const res = live();
  const bars = h('div', { class: 'bars', style: { marginBottom: '26px' } }, days.map(d => h('div', { style: { height: (d[2] * 3 + 2) + 'px' } }, h('em', {}, d[2]), h('span', {}, tx({ en: d[0], st: d[1].slice(0, 4) })))));
  say2(res, `Rain in mm each day. Total for the week = ${days.map(d => d[2]).join(' + ')} = ${tot} mm. Wettest day: ${days.reduce((a, b) => b[2] > a[2] ? b : a)[0]}.`, `Pula ka mm letsatsi le leng le le leng. Kakaretso ea beke = ${days.map(d => d[2]).join(' + ')} = ${tot} mm. Letsatsi le nang le pula e ngata: ${days.reduce((a, b) => b[2] > a[2] ? b : a)[1]}.`);
  return toolCard('tryIt', bars, res);
};

/* syllable builder for Sesotho reading (ho bopa mantsoe) */
Tools.syllables = function (o) {
  const parts = o.parts || ['ba', 'na', 'ntja', 'ko', 'lo', 'me', 'ho', 'pe', 'li', 'tšo', 'a', 'mo'];
  let word = []; const out = h('div', { class: 'big-num', 'aria-live': 'polite' }, '…');
  const known = (LESELI.words || []).map(w => w.st.toLowerCase());
  const res = live();
  const draw = () => { const w = word.join(''); out.textContent = w || '…'; if (known.includes(w)) { const e = LESELI.words.find(x => x.st.toLowerCase() === w); say2(res, `✔ "${w}" = ${e.en}`, `✔ "${w}" ke lentsoe! (${e.en})`); react(true); } else res.innerHTML = ''; };
  return toolCard('tryIt', out, h('div', { class: 'row center' }, parts.map(p => h('button', { class: 'btn', onclick: () => { word.push(p); Speech.say(word.join(''), 'st'); draw(); } }, p))), h('div', { class: 'row center', style: { marginTop: '8px' } }, h('button', { class: 'btn small', onclick: () => { word.pop(); draw(); } }, '⌫'), h('button', { class: 'btn small', onclick: () => { word = []; draw(); } }, T('clear'))), res);
};

</script>
<script>
/* Endless maths practice that adapts to the learner.
   3 right in a row -> harder; 2 wrong in a row -> easier. Every wrong answer shows the worked
   solution (MS) so the learner sees HOW. Skills follow the Grade 5-7 syllabus and the topics
   learners told us were hard (addition, subtraction, multiplication, long division, multiples, angles). */
'use strict';

const Skills = {
  add: { g: 5, emo: '➕', name: L('Addition (carrying)', 'Ho kopanya (ho fetisetsa)'),
    gen: lv => { const d = [2, 3, 4, 5, 5, 6][lv - 1] || 5; const a = rnd(10 ** (d - 1), 10 ** d - 1), b = rnd(10 ** (d - 1), 10 ** d - 1); return { q: `${fmt(a)} + ${fmt(b)}`, ans: a + b, solve: () => MS.add(a, b) }; } },
  sub: { g: 5, emo: '➖', name: L('Subtraction (borrowing)', 'Ho tlosa (ho alima)'),
    gen: lv => { const d = [2, 3, 4, 5, 5, 6][lv - 1] || 5; let a = rnd(10 ** (d - 1), 10 ** d - 1), b = rnd(10 ** (d - 2) || 1, a); if (lv >= 4 && Math.random() < .5) a = Math.round(a / 1000) * 1000 || 1000; if (b > a) b = rnd(1, a); return { q: `${fmt(a)} − ${fmt(b)}`, ans: a - b, solve: () => MS.sub(a, b) }; } },
  tables: { g: 5, emo: '✖️', name: L('Times tables', 'Litafole tsa ho atisa'),
    gen: lv => { const a = rnd(2, lv < 3 ? 5 : 10), b = rnd(2, 10 + (lv > 4 ? 2 : 0)); return { q: `${a} × ${b}`, ans: a * b, solve: () => MS.mul(a, b) }; } },
  mul: { g: 5, emo: '🧮', name: L('Long multiplication', 'Ho atisa ho holoanyane'),
    gen: lv => { const a = lv < 3 ? rnd(12, 99) : rnd(100, 999), b = lv < 2 ? rnd(2, 9) : rnd(11, lv < 4 ? 30 : 99); return { q: `${a} × ${b}`, ans: a * b, solve: () => MS.mul(a, b) }; } },
  div: { g: 5, emo: '➗', name: L('Long division', 'Ho arola (long division)'),
    gen: lv => { const d = lv < 3 ? rnd(2, 9) : rnd(2, lv < 5 ? 12 : 25); const q = lv < 2 ? rnd(11, 99) : rnd(100, lv < 4 ? 999 : 9999); const n = d * q; return { q: `${fmt(n)} ÷ ${d}`, ans: q, solve: () => MS.div(n, d) }; } },
  multiples: { g: 5, emo: '🔢', name: L('Multiples', 'Liatiso (multiples)'),
    gen: lv => { const n = rnd(2, 10), k = rnd(2, lv < 3 ? 6 : 12); const opts = shuffle([n * k, n * k + rnd(1, n - 1 || 1), n * k - 1, n * (k + 1) + 1]).filter((v, i, a) => a.indexOf(v) === i); return { q: L(`Which number is a multiple of ${n}?`, `Ke nomoro efe e leng seatiso sa ${n}?`), opts, ans: n * k, solve: () => MS.multiples(n, Math.max(k, 6)) }; } },
  round: { g: 5, emo: '🎯', name: L('Rounding to 1 000', 'Ho potoloha ho 1 000'),
    gen: lv => { const to = lv < 2 ? 10 : lv < 3 ? 100 : 1000; const n = rnd(to * 2, to * 99); return { q: L(`Round ${fmt(n)} to the nearest ${fmt(to)}`, `Potoloha ${fmt(n)} ho ${fmt(to)} e haufi`), ans: Math.round(n / to) * to, solve: () => MS.round(n, to) }; } },
  frac: { g: 5, emo: '🍕', name: L('Adding & subtracting fractions', 'Ho kopanya le ho tlosa likaroloana'),
    gen: lv => { const ds = lv < 2 ? [[4, 4], [5, 5], [8, 8]] : lv < 4 ? [[2, 4], [3, 6], [4, 8], [2, 3], [3, 4]] : [[3, 5], [4, 6], [6, 8], [2, 5]]; const [d1, d2] = pick(ds); let n1 = rnd(1, d1 - 1), n2 = rnd(1, d2 - 1); const op = n1 / d1 > n2 / d2 && Math.random() < .5 ? '-' : '+'; const r = MS.fracOp(MS.fr(n1, d1), MS.fr(n2, d2), op); return { q: `${n1}/${d1} ${op === '-' ? '−' : '+'} ${n2}/${d2}`, ans: r.answer, frac: true, solve: () => r }; } },
  mixed: { g: 5, emo: '🥧', name: L('Mixed fractions', 'Likaroloana tse kopaneng'),
    gen: () => { const d = pick([2, 3, 4, 5, 6, 8]); const a = MS.fr(rnd(1, d - 1), d, rnd(1, 4)), b = MS.fr(rnd(1, d - 1), d, rnd(1, 3)); const op = Math.random() < .5 ? '+' : '-'; const big = op === '-' && (a.w * d + a.n) < (b.w * d + b.n); const [x, y] = big ? [b, a] : [a, b]; const r = MS.fracOp(x, y, op); return { q: `${x.w} ${x.n}/${d} ${op === '-' ? '−' : '+'} ${y.w} ${y.n}/${d}`, ans: r.answer, frac: true, solve: () => r }; } },
  angles: { g: 5, emo: '📐', name: L('Angles in a triangle', 'Likhutlo tsa khutlo-tharo'),
    gen: () => { const a = rnd(20, 100), b = rnd(20, 160 - a); return { q: L(`A triangle has angles ${a}° and ${b}°. What is the third angle?`, `Khutlo-tharo e na le likhutlo tsa ${a}° le ${b}°. Sekhutlo sa boraro ke bokae?`), ans: 180 - a - b, solve: () => MS.triangle(a, b) }; } },
  units: { g: 5, emo: '📏', name: L('cm ↔ m, g ↔ kg', 'cm ↔ m, g ↔ kg'),
    gen: () => { const c = pick([['cm', 'm', 100], ['m', 'cm', 100], ['g', 'kg', 1000], ['kg', 'g', 1000], ['ml', 'l', 1000], ['m', 'km', 1000]]); const big = ['m', 'kg', 'l', 'km'].includes(c[0]) && c[0] !== 'm' || (c[0] === 'm' && c[1] === 'cm'); const v = big ? rnd(1, 9) : rnd(1, 9) * c[2] / pick([1, 2, 4, 10]); const r = MS.convert(v, c[0], c[1]); return { q: `${v} ${c[0]} = ? ${c[1]}`, ans: r.answer, dot: true, solve: () => r }; } },
  money: { g: 5, emo: '💰', name: L('Money (Maloti)', 'Chelete (Maloti)'),
    gen: () => { const item = pick([['bread', 'bohobe', 14], ['milk', 'lebese', 19], ['eggs (6)', 'mahe (6)', 24], ['maize meal 2 kg', 'phofo ea poone 2 kg', 32], ['apple', 'apole', 4], ['pen', 'pene', 6]]); const n = rnd(2, 9); const pay = Math.ceil(item[2] * n / 50) * 50 + (Math.random() < .5 ? 50 : 0); return Math.random() < .5 ? { q: L(`One ${item[0]} costs M${item[2]}. How much do ${n} cost?`, `${item[1]} se le seng se bitsa M${item[2]}. Tse ${n} li bitsa bokae?`), ans: item[2] * n, solve: () => MS.mul(item[2], n) }
      : { q: L(`You buy ${n} × ${item[0]} at M${item[2]} each and pay M${pay}. How much change?`, `U reka ${item[1]} tse ${n} ka M${item[2]} e 'ngoe 'me u lefa M${pay}. U fumana chelete e sala e kae?`), ans: pay - item[2] * n, solve: () => { const a = MS.mul(item[2], n), b = MS.sub(pay, item[2] * n); return { answer: pay - item[2] * n, steps: a.steps.concat(b.steps), layout: b.layout }; } }; } },
  percent: { g: 6, emo: '💯', name: L('Percentages', 'Liphesente'),
    gen: lv => { const p = pick(lv < 3 ? [10, 50, 25] : [5, 10, 15, 20, 25, 30, 40, 75]), of = pick([20, 40, 60, 80, 100, 120, 200, 240, 400]); return { q: L(`${p}% of ${of}`, `${p}% ea ${of}`), ans: p * of / 100, dot: true, solve: () => MS.percent(p, of) }; } },
  hcf: { g: 6, emo: '🔗', name: L('HCF and LCM', 'HCF le LCM'),
    gen: () => { const g = rnd(2, 6), a = g * rnd(2, 6), b = g * rnd(2, 7); const ask = Math.random() < .5 ? 'HCF' : 'LCM'; return { q: L(`${ask} of ${a} and ${b}`, `${ask} ea ${a} le ${b}`), ans: ask === 'HCF' ? MS.gcd(a, b) : MS.lcm(a, b), solve: () => MS.hcfLcm(a, b) }; } },
  integers: { g: 7, emo: '🌡️', name: L('Negative numbers', 'Linomoro tse ka tlase ho 0'),
    gen: () => { const a = rnd(-12, 12), b = rnd(-12, 12), op = pick(['+', '−']); const ans = op === '+' ? a + b : a - b; const s = x => x < 0 ? `(${x})` : x; return { q: `${s(a)} ${op} ${s(b)}`, ans, neg: true, solve: () => ({ answer: ans, steps: [{ en: `Start at ${a} on the number line. ${op === '+' ? (b >= 0 ? 'Adding a positive: move right ' + b : 'Adding a negative: move left ' + (-b)) : (b >= 0 ? 'Subtracting a positive: move left ' + b : 'Subtracting a negative is the same as adding: move right ' + (-b))}. You land on ${ans}.`, st: `Qala ho ${a} moleng oa linomoro. ${op === '+' ? (b >= 0 ? 'Ho kopanya e ntle: ea ka ho le letona ' + b : 'Ho kopanya e mpe: ea ka ho le letšehali ' + (-b)) : (b >= 0 ? 'Ho tlosa e ntle: ea ka ho le letšehali ' + b : 'Ho tlosa e mpe ho tšoana le ho kopanya: ea ka ho le letona ' + (-b))}. U fihla ho ${ans}.` }], layout: '' }) }; } },
  equations: { g: 7, emo: '⚖️', name: L('Solve for x', 'Fumana x'),
    gen: lv => { const x = rnd(1, 15), a = lv < 3 ? 1 : rnd(2, 6), b = rnd(1, 20); const c = a * x + b; return { q: `${a === 1 ? '' : a}x + ${b} = ${c}`, ans: x, solve: () => ({ answer: x, steps: [{ en: `Take ${b} away from both sides: ${a === 1 ? '' : a}x = ${c} − ${b} = ${c - b}.`, st: `Tlosa ${b} mahlakoreng ka bobeli: ${a === 1 ? '' : a}x = ${c} − ${b} = ${c - b}.` }].concat(a > 1 ? [{ en: `Divide both sides by ${a}: x = ${c - b} ÷ ${a} = ${x}.`, st: `Arola mahlakore ka bobeli ka ${a}: x = ${c - b} ÷ ${a} = ${x}.` }] : []).concat([{ en: `Check: ${a} × ${x} + ${b} = ${c} ✓`, st: `Hlahloba: ${a} × ${x} + ${b} = ${c} ✓` }]), layout: '' }) }; } },
  area: { g: 6, emo: '⬛', name: L('Area & perimeter', 'Sebaka le potoloho'),
    gen: () => { const l = rnd(3, 20), w = rnd(2, 15); const isA = Math.random() < .5; return { q: L(`A rectangle is ${l} m long and ${w} m wide. What is its ${isA ? 'area (m²)' : 'perimeter (m)'}?`, `Khutlo-nne e bolelele ba ${l} m le bophara ba ${w} m. ${isA ? 'Sebaka (area) sa eona ke bokae (m²)' : 'Potoloho (perimeter) ea eona ke bokae (m)'}?`), ans: isA ? l * w : 2 * (l + w), solve: () => ({ answer: isA ? l * w : 2 * (l + w), steps: isA ? [{ en: `Area = length × width = ${l} × ${w} = ${l * w} m²`, st: `Sebaka = bolelele × bophara = ${l} × ${w} = ${l * w} m²` }] : [{ en: `Perimeter = 2 × (length + width) = 2 × (${l} + ${w}) = ${2 * (l + w)} m`, st: `Potoloho = 2 × (bolelele + bophara) = 2 × (${l} + ${w}) = ${2 * (l + w)} m` }], layout: '' }) }; } }
};
LESELI.practiceFor = { maths: true };

Screens.practice = function (main, skill) {
  if (!skill || !Skills[skill]) {
    add(main, [ut('h1', 'practice'), ut('p', 'practiceIntro', { class: 'muted' })]);
    const g = Content.grade();

      const list = Object.entries(Skills).filter(([, s]) => s.g === gr); if (!list.length) return;

      main.appendChild(h('div', { class: 'grid' }, list.map(([id, s]) => { const st = (Store.prog().practice[id] || {}); return h('a', { class: 'tile', href: '#/practice/' + id, style: { minHeight: '104px' } }, h('span', { class: 'big-emoji', style: { fontSize: '30px' } }, s.emo), h('b', {}, tx(s.name)), h('small', {}, st.right ? '✔ ' + st.right + ' · ' + T('level') + ' ' + (st.level || 1) : '')); })));
    });
    return T('practice');
  }
  const S = Skills[skill], p = Store.prog();
  const st = p.practice[skill] || (p.practice[skill] = { level: 1, right: 0, wrong: 0, streak: 0, miss: 0 });
  let total = 0, good = 0;
  add(main, [h('div', { class: 'row between' }, h('h1', { style: { margin: 0 } }, S.emo + ' ' + tx(S.name)))]);

  const next = () => {

    const item = S.gen(st.level);
    const qObj = typeof item.q === 'string' ? item.q : item.q;
    const card = h('section', { class: 'card' }, typeof qObj === 'string' ? h('div', { class: 'big-num', 'data-read': '', lang: 'en', 'data-read-text': '' }, qObj.replace(/×/g, '×')) : biText('div', qObj, 'q-text'));
    area.appendChild(card);
    const fb = h('div', { 'aria-live': 'assertive' }); area.appendChild(fb);
    const done = (val) => {
      const norm = x => String(x).replace(/\s+/g, ' ').trim().replace(/^(\d+)\s(\d+)\/(\d+)$/, '$1 $2/$3');
      const ok = item.opts ? val === item.ans : (norm(val) === norm(item.ans) || Number(val) === Number(item.ans));
      total++; if (ok) { good++; st.right++; st.streak++; st.miss = 0; Store.addStars(st.streak % 5 === 0 ? 1 : 0); } else { st.wrong++; st.streak = 0; st.miss++; }
      let lvlMsg = null;
      if (ok && st.streak > 0 && st.streak % 3 === 0 && st.level < 6) { st.level++; lvlMsg = T('levelUp'); }
      if (!ok && st.miss >= 2 && st.level > 1) { st.level--; st.miss = 0; lvlMsg = T('levelDown'); }
      p.practice.right = (p.practice.right || 0) + (ok ? 1 : 0);
      Store.log('practice', { skill, ok, level: st.level }); Store.save(); react(ok); Badges.check();
      fb.appendChild(h('div', { class: 'feedback ' + (ok ? 'good' : 'bad') }, icon(ok ? 'check' : 'x'), h('div', {}, ut('div', ok ? 'correct' : 'wrong'), ok ? null : h('div', {}, T('answerIs') + ': ', h('b', {}, String(item.ans))), lvlMsg ? h('div', { class: 'small' }, lvlMsg) : null)));
      if (!ok || Math.random() < .25) fb.appendChild(workedBox(item.solve(), typeof item.q === 'string' ? item.q : null));
      fb.appendChild(h('button', { class: 'btn primary block', onclick: next }, T('next'), icon('next')));
      if (Store.s.settings.autoRead || Store.s.settings.vision) Speech.speakChunks(chunksOf(fb)); else Speech.say(ok ? T('correct') : T('wrong') + ' ' + T('answerIs') + ' ' + item.ans, I18N.ui());
      setTimeout(() => fb.querySelector('.btn.primary').focus(), 60);
    };
    if (item.opts) {
      const o = h('div', { class: 'options' }); item.opts.forEach((v, j) => o.appendChild(h('button', { class: 'opt', onclick: e => { $$('.opt', o).forEach(b => b.disabled = true); e.currentTarget.classList.add(v === item.ans ? 'right' : 'wrong'); done(v); } }, h('span', { class: 'letter' }, 'ABCD'[j]), String(v)))); card.appendChild(o);
    } else card.appendChild(numberPad(done, { allowFrac: item.frac, allowDot: item.dot, allowNeg: item.neg }));
    card.appendChild(h('div', { class: 'sec-tools' }, speakBtn(() => [{ text: (typeof item.q === 'string' ? item.q : tx(item.q, I18N.ui())).replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus '), lang: typeof item.q === 'string' ? 'en' : I18N.ui() }]),
      h('button', { class: 'btn small ghost', onclick: () => { fb.innerHTML = ''; fb.appendChild(workedBox(item.solve(), null)); } }, icon('bulb', null, 18), T('showMe'))));
    if (Store.s.settings.vision) card.querySelector('.sec-tools .btn').click();
  };
  next();
  return tx(S.name);
};

<script>
/* Thuso – Leseli's offline helper ("thuso" = help).
   Honest design: this is NOT a cloud chatbot. A phone with no data cannot run one, and learners'
   questions must not leave the phone. Thuso combines small, reliable offline skills:
     1. a step-by-step maths solver (MS.solve) for + − × ÷, fractions, rounding, angles, units, %...
     2. a bilingual word book (English ↔ Sesotho)
     3. a search engine over every lesson in Leseli (both languages) that answers with the best paragraph
     4. "quiz me" from the lesson you are in
     5. if it still cannot help: save the question (typed or voice) for the teacher.
   Every answer can be read aloud. */
'use strict';

const Tutor = {
  index: null,
  stop: new Set('the a an is are was of to in on and or what how why who which do does did can i you me my it this that for with be ke ka ho le la ea oa ba li se sa na eng joang hobaneng mang kae neng hore e a o u re ha me tse tsa please tell explain about thuso nthuse hlalosa bolela'.split(' ')),
  tok(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9šé' ]+/g, ' ').split(/\s+/).filter(w => w.length > 1 && !this.stop.has(w)).map(w => w.replace(/(ing|ed|es|s)$/, '')); },
  build() {
    const docs = [];
    Content.all().forEach(l => {
      docs.push({ l, i: -1, text: tx(l.title, 'en') + ' ' + tx(l.title, 'st') + ' ' + (l.words || []).flat().join(' '), boost: 2.2 });
      (l.sections || []).forEach((s, i) => docs.push({ l, i, text: [s.h && s.h.en, s.h && s.h.st, s.p && s.p.en, s.p && s.p.st, s.ex && s.ex.en, s.ex && s.ex.st].join(' '), boost: 1 }));
    });
    const df = {}; docs.forEach(d => { d.tf = {}; this.tok(d.text).forEach(w => d.tf[w] = (d.tf[w] || 0) + 1); Object.keys(d.tf).forEach(w => df[w] = (df[w] || 0) + 1); d.len = Object.values(d.tf).reduce((a, b) => a + b, 0); });
    this.index = { docs, df, N: docs.length };
  },
  rank(q, opts) {
    if (!this.index) this.build();
    opts = opts || {};
    const { docs, df, N } = this.index; const words = this.tok(q); if (!words.length) return [];
    return docs.map(d => {
      let s = 0;
      words.forEach(w => { let tf = d.tf[w] || 0; if (!tf && w.length > 4) { for (const k in d.tf) if (k.startsWith(w.slice(0, 5))) { tf += d.tf[k] * .6; } } if (tf) s += (tf / (tf + 1.2 * (.25 + .75 * d.len / 60))) * Math.log(1 + N / (df[w] || 1)); });
      s *= d.boost; if (opts.subject && d.l.subject === opts.subject) s *= 1.5; if (opts.lesson && d.l.id === opts.lesson) s *= 2; if (opts.grade && d.l.grade === opts.grade) s *= 1.2;
      return { d, s };
    }).filter(x => x.s > .4).sort((a, b) => b.s - a.s);
  },
  search(q, n) { const seen = new Set(), out = []; for (const r of this.rank(q)) { if (seen.has(r.d.l.id)) continue; seen.add(r.d.l.id); out.push({ lesson: r.d.l, score: r.s }); if (out.length >= (n || 5)) break; } return out; },
  isSesotho(q) { const st = (q.toLowerCase().match(/\b(ke|eng|joang|hobaneng|na|ka|ho|ea|oa|li|tsa|mang|kae|nthuse|hlalosa|lumela|kea|ha|ke eng|bolela)\b/g) || []).length; const en = (q.toLowerCase().match(/\b(what|how|why|is|the|a|of|who|where|when|explain|help|can|does)\b/g) || []).length; return st > en; },
  dict(word) {
    const w = word.toLowerCase().trim().replace(/[?.!'"]/g, '');
    const all = LESELI.words || [];
    return all.find(e => e.en.toLowerCase() === w || e.st.toLowerCase() === w) || all.find(e => e.en.toLowerCase().split(/[,/;] ?/).includes(w) || e.st.toLowerCase().split(/[,/;] ?/).includes(w)) || all.find(e => e.en.toLowerCase().startsWith(w) || e.st.toLowerCase().startsWith(w));
  },
  /* answer one message. ctx = {lesson, subject, grade, section}. returns {kind, en, st, steps?, layout?, links?, quiz?} */
  answer(text, ctx) {
    const q = text.trim(); const lq = q.toLowerCase(); ctx = ctx || {};
    const P = (en, st, extra) => Object.assign({ en, st }, extra || {});
    if (!q) return null;
    if (/^(hi|hello|hey|lumela|lumelang|helo|dumela)\b/.test(lq)) return P('Hello! I am Thuso. Ask me about any lesson, a maths sum like "345 x 23" or "625 ÷ 5", or a word to translate.', 'Lumela! Ke nna Thuso. Mpotse ka thuto efe kapa efe, palo e kang "345 x 23" kapa "625 ÷ 5", kapa lentsoe leo u batlang ho le fetolela.', { kind: 'hello' });
    if (/^(thanks|thank you|kea leboha|ke a leboha|rea leboha)/.test(lq)) return P('You are welcome! Keep learning.', 'Ha ho na taba! Tsoela pele ho ithuta.', { kind: 'thanks' });
    if (/^(help|thuso|nthuse|what can you do|o ka etsa eng)\??$/.test(lq)) return P('I can: 1) solve maths step by step (try "4 587 + 9 765", "1/2 + 1/3", "round 45 678", "triangle 50 60", "250 cm to m"); 2) translate words ("water in Sesotho", "pula ke eng ka Senyesemane"); 3) explain lesson topics ("what is oxygen?"); 4) quiz you ("quiz me"). If I cannot help, I will keep your question for your teacher.',
      'Nka: 1) rarolla lipalo mohato ka mohato (leka "4 587 + 9 765", "1/2 + 1/3", "round 45 678", "triangle 50 60"); 2) fetolela mantsoe ("water ka Sesotho", "pula ke eng ka Senyesemane"); 3) hlalosa lithuto ("oksijene ke eng?"); 4) u botsa lipotso ("mpotse"). Haeba ke sitoa, ke tla bolokela mosuoe potso ea hau.', { kind: 'help' });
    // quiz me
    if (/quiz me|test me|ask me|mpotse|nkhahlobe|potso/.test(lq) && !/\d/.test(lq)) {
      const pool = ctx.lesson ? (Content.lesson(ctx.lesson) || {}).quiz : Content.all().filter(l => !ctx.subject || l.subject === ctx.subject).filter(l => l.grade === (ctx.grade || Content.grade())).flatMap(l => l.quiz || []);
      const item = pool && pool.length ? pick(pool) : null;
      if (item) return P('Here is a question for you:', 'Potso ena ke ea hau:', { kind: 'quiz', quiz: item });
    }
    // translation
    let m = lq.match(/^(?:what is |what's )?(.+?) in (sesotho|english|senyesemane)\??$/) || lq.match(/^(?:translate|fetolela)\s+(.+?)$/) || lq.match(/^(.+?) ke eng ka (senyesemane|sesotho)\??$/) || lq.match(/^(?:sesotho|english) (?:for|ea|of) (.+?)\??$/) || lq.match(/^(?:ho thoe'?ng|re re'?ng) (.+?) ka (sesotho|senyesemane)\??$/);
    if (m) {
      const e = this.dict(m[1]);
      if (e) return P(`"${e.en}" in Sesotho is "${e.st}".`, `"${e.en}" ka Sesotho ke "${e.st}".`, { kind: 'word', word: e });
      return P(`I do not have "${m[1]}" in my word book yet. Ask your teacher, and they can add it.`, `Ha ke so be le "${m[1]}" bukeng ea ka ea mantsoe. Botsa mosuoe oa hau.`, { kind: 'unknown' });
    }
    // maths
    if (/\d/.test(q)) {
      const r = MS.solve(q);
      if (r) return P(`The answer is ${r.answer}${r.remainder ? ' remainder ' + r.remainder : ''}. Here is how:`, `Karabo ke ${r.answer}${r.remainder ? ", 'me ho sala " + r.remainder : ''}. Mokhoa ke ona:`, { kind: 'maths', steps: r.steps, layout: r.layout });
    }
    // single word → dictionary first
    if (!/\s/.test(lq.replace(/\?$/, '')) || /^(what does|meaning of|define)\s/.test(lq)) {
      const w = lq.replace(/^(what does|meaning of|define)\s+/, '').replace(/\s*(mean)?\??$/, '');
      const e = this.dict(w);
      if (e) {
        const res = this.rank(w, ctx)[0];
        return P(`"${e.en}" = "${e.st}" in Sesotho.` + (e.def ? ' ' + e.def.en : ''), `"${e.st}" = "${e.en}" ka Senyesemane.` + (e.def ? ' ' + e.def.st : ''), { kind: 'word', word: e, links: res ? [res.d.l] : [] });
      }
    }
    // knowledge search over lessons
    const res = this.rank(q, { lesson: ctx.lesson, subject: ctx.subject, grade: ctx.grade || Content.grade() });
    if (res.length && res[0].s > 1.2) {
      const best = res[0].d; const sec = best.i >= 0 ? best.l.sections[best.i] : best.l.sections[0];
      const links = []; res.forEach(r => { if (!links.includes(r.d.l) && links.length < 3) links.push(r.d.l); });
      const clip = s => { const t = plain(s || ''); return t.length > 520 ? t.slice(0, 500).replace(/\s\S*$/, '') + ' …' : t; };
      return P(clip(sec.p && sec.p.en), clip(sec.p && sec.p.st), { kind: 'explain', head: sec.h, links, lessonId: best.l.id, sectionIndex: best.i });
    }
    return P("I am not sure about that one yet. I can keep your question so your teacher can answer it. You can also type it differently, or use fewer words.",
      "Ha ke na bonnete ka eona. Nka bolokela mosuoe oa hau potso ena hore a e arabe. U ka boela ua e ngola ka tsela e 'ngoe, kapa ka mantsoe a fokolang.", { kind: 'unknown' });
  }
};

/* ---------- Thuso chat screen ---------- */
Screens.thuso = function (main, lessonId, secIdx) {
  const l = lessonId ? Content.lesson(lessonId) : null;
  const ctx = { lesson: l && l.id, subject: l && l.subject, grade: l ? l.grade : Content.grade(), section: secIdx };
  const lang = () => I18N.content() === 'en' ? 'en' : 'st';
  const chat = h('div', { class: 'chat', role: 'log', 'aria-live': 'polite' });
  add(main, [h('div', { class: 'row', style: { marginBottom: '10px' } }, h('span', { class: 'avatar' }, '🦉'), h('div', {}, h('h1', { style: { margin: 0 } }, 'Thuso'), h('div', { class: 'small muted' }, l ? T('askingAbout') + ': ' + tx(l.title) : T('thusoSub')))), chat]);
  const bot = (r) => {
    const both = I18N.content() === 'both';
    const m = h('div', { class: 'msg bot' }, h('div', { class: 'who' }, '🦉 Thuso'));
    if (r.head) m.appendChild(h('b', { lang: lang(), 'data-read': '' }, tx(r.head, lang())));
    m.appendChild(h('div', { lang: lang(), 'data-read': '' }, r[lang()]));
    if (both && r.kind !== 'maths') m.appendChild(h('div', { class: 'small muted', lang: 'en', 'data-read': '' }, r.en));
    if (r.layout) m.appendChild(h('pre', { class: 'calc', 'aria-hidden': 'true' }, r.layout));
    if (r.steps) m.appendChild(h('ol', { class: 'steps' }, r.steps.map(s => h('li', { lang: lang(), 'data-read': '' }, s[lang()], both ? h('div', { class: 'small muted', lang: 'en' }, s.en) : null))));
    const acts = h('div', { class: 'acts' }, speakBtn(() => chunksOf(m), { label: false }));
    if (r.word) acts.appendChild(h('button', { class: 'btn small', onclick: () => Speech.speakChunks([{ text: r.word.st, lang: 'st' }, { text: r.word.en, lang: 'en' }]) }, '🔤 ', T('sayWord')));
    (r.links || []).forEach(x => acts.appendChild(h('a', { class: 'btn small', href: '#/lesson/' + x.id }, icon('book', null, 16), tx(x.title))));
    if (r.kind === 'unknown') acts.appendChild(h('button', { class: 'btn small gold', onclick: e => { saveQ(r.q); e.currentTarget.disabled = true; } }, icon('send', null, 16), T('sendToTeacher')));
    m.appendChild(acts);
    if (r.quiz) {
      const qz = r.quiz, qc = h('div', { class: 'stack', style: { marginTop: '8px' } }, biText('div', qz.q, 'q-text', true));
      if (qz.o) qz.o.forEach((o, k) => qc.appendChild(h('button', { class: 'opt', onclick: e => { $$('.opt', qc).forEach(b => b.disabled = true); const ok = k === qz.a; e.currentTarget.classList.add(ok ? 'right' : 'wrong'); react(ok); bot({ en: ok ? 'Correct! Well done. ' + (qz.x ? qz.x.en : '') : 'Not quite. The answer is: ' + qz.o[qz.a].en + '. ' + (qz.x ? qz.x.en : ''), st: ok ? 'U nepile! ' + (qz.x ? qz.x.st : '') : 'Che. Karabo ke: ' + qz.o[qz.a].st + '. ' + (qz.x ? qz.x.st : ''), kind: 'fb' }); } }, tx(o, lang()))));
      else if (qz.n !== undefined) qc.appendChild(numberPad(v => { const ok = String(v) === String(qz.n); react(ok); bot({ en: ok ? 'Correct!' : 'The answer is ' + qz.n + '.', st: ok ? 'U nepile!' : 'Karabo ke ' + qz.n + '.', kind: 'fb' }); }, { allowFrac: /\//.test(String(qz.n)) }));
      m.appendChild(qc);
    }
    chat.appendChild(m); m.scrollIntoView({ behavior: 'smooth', block: 'end' });
    if (Store.s.settings.autoRead || Store.s.settings.vision) Speech.speakChunks(chunksOf(m));
  };
  const me = t => { chat.appendChild(h('div', { class: 'msg me' }, t)); };
  const ask = t => {
    t = t.trim(); if (!t) return; me(t);
    const r = Tutor.answer(t, ctx); r.q = t;
    Store.log('thuso', { kind: r.kind, lesson: ctx.lesson || null });
    setTimeout(() => { bot(r); Badges.check(); }, 250);
  };
  const saveQ = text => { Store.s.questions.push({ id: uid(), t: Date.now(), l: Store.lid(), text, lesson: ctx.lesson || null, answered: false }); Store.save(); Store.log('teacher_q', { type: 'text' }); toast(T('savedForTeacher')); };
  // greeting
  bot(l ? { en: `Ask me anything about "${tx(l.title, 'en')}". Tap a suggestion or type below.`, st: `Mpotse eng kapa eng ka "${tx(l.title, 'st')}". Tobetsa khothaletso kapa u ngole ka tlase.` }

    h('button', { class: 'btn ghost block', onclick: close, style: { marginTop: '8px' } }, T('cancel'))]));

<script>
/* Games – learning through play. Morabaraba is the Basotho/Southern African "cattle" strategy
   game (Grade 6 Creativity: "play advanced versions of indigenous games"). */
'use strict';

const Games = {};

/* ---------- Morabaraba ---------- */
Games.morabaraba = function (main) {
  // points: ring r (0 outer..2 inner), position p (0 TL,1 TM,2 TR,3 MR,4 BR,5 BM,6 BL,7 ML)
  const xy = [];
  [[20, 280], [70, 230], [120, 180]].forEach(([a, b]) => { const m = (a + b) / 2; [[a, a], [m, a], [b, a], [b, m], [b, b], [m, b], [a, b], [a, m]].forEach(p => xy.push(p)); });
  const adj = Array.from({ length: 24 }, () => []);
  const link = (a, b) => { adj[a].push(b); adj[b].push(a); };
  for (let r = 0; r < 3; r++) for (let p = 0; p < 8; p++) link(r * 8 + p, r * 8 + (p + 1) % 8);
  for (let r = 0; r < 2; r++) for (let p = 0; p < 8; p++) link(r * 8 + p, (r + 1) * 8 + p); // includes diagonals at corners (Morabaraba)
  const mills = [];
  for (let r = 0; r < 3; r++) [[0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0]].forEach(t => mills.push(t.map(p => r * 8 + p)));
  for (let p = 0; p < 8; p++) mills.push([p, 8 + p, 16 + p]);

  let board, hand, onBoard, turn, phase, sel, vsPhone = true, over = false;
  const reset = () => { board = Array(24).fill(0); hand = { 1: 12, 2: 12 }; onBoard = { 1: 0, 2: 0 }; turn = 1; phase = 'play'; sel = null; over = false; draw(); };
  const inMill = (i, b) => mills.some(m => m.includes(i) && m.every(k => b[k] === b[i]));
  const makesMill = (i, who, b, from) => mills.some(m => m.includes(i) && m.every(k => k === i ? true : (k !== from && b[k] === who)));
  const removable = who => { const opp = 3 - who; const all = board.map((v, i) => v === opp ? i : -1).filter(i => i >= 0); const free = all.filter(i => !inMill(i, board)); return free.length ? free : all; };
  const moves = who => {
    const out = []; const flying = hand[who] === 0 && onBoard[who] === 3;
    if (hand[who] > 0) { board.forEach((v, i) => { if (!v) out.push([null, i]); }); return out; }
    board.forEach((v, i) => { if (v !== who) return; (flying ? board.map((x, k) => k) : adj[i]).forEach(k => { if (!board[k]) out.push([i, k]); }); });
    return out;
  };
  const status = h('div', { class: 'card', 'aria-live': 'polite', style: { textAlign: 'center', fontWeight: 700 } });
  const svgBox = h('div', { class: 'board-wrap' });
  const name = w => w === 1 ? tx({ en: 'You (white)', st: 'Uena (tse tšoeu)' }) + (vsPhone ? '' : ' 1') : vsPhone ? tx({ en: 'Phone (black)', st: 'Fono (tse ntšo)' }) : tx({ en: 'Player 2 (black)', st: 'Sebapali sa 2 (tse ntšo)' });
  const say = (en, st) => { status.innerHTML = ''; status.appendChild(h('div', { 'data-read': '', lang: I18N.ui() }, tx({ en, st }))); status.appendChild(h('div', { class: 'small muted' }, `⚪ ${tx({ en: 'in hand', st: 'matsohong' })}: ${hand[1]} · ${tx({ en: 'on board', st: 'boteng' })}: ${onBoard[1]}   ⚫ ${hand[2]} · ${onBoard[2]}`)); };
  const draw = () => {
    let s = `<svg viewBox="0 0 300 300" width="100%" role="img" aria-label="Morabaraba board"><rect width="300" height="300" rx="14" fill="#e9d3a5"/>`;
    [[20, 260], [70, 160], [120, 60]].forEach(([a, w]) => s += `<rect x="${a}" y="${a}" width="${w}" height="${w}" fill="none" stroke="#5b3a12" stroke-width="3"/>`);
    for (let p = 0; p < 8; p++) s += `<line x1="${xy[p][0]}" y1="${xy[p][1]}" x2="${xy[16 + p][0]}" y2="${xy[16 + p][1]}" stroke="#5b3a12" stroke-width="3"/>`;
    xy.forEach(([x, y], i) => {
      const v = board[i];
      s += `<g data-i="${i}" role="button" tabindex="0" aria-label="${i + 1}: ${v === 1 ? 'white' : v === 2 ? 'black' : 'empty'}"><circle cx="${x}" cy="${y}" r="20" fill="transparent"/>` + (v ? `<circle cx="${x}" cy="${y}" r="13" fill="${v === 1 ? '#fff' : '#222'}" stroke="${sel === i ? '#00c26a' : phase === 'remove' && turn === 3 - v && removable(turn).includes(i) ? '#e53935' : '#5b3a12'}" stroke-width="${sel === i || phase === 'remove' ? 5 : 2}"/>` : `<circle cx="${x}" cy="${y}" r="6" fill="#5b3a12"/>`) + '</g>';
    });
    svgBox.innerHTML = s + '</svg>';
    $$('g[data-i]', svgBox).forEach(g => { g.addEventListener('click', () => tap(+g.dataset.i)); g.addEventListener('keydown', e => { if (e.key === 'Enter') tap(+g.dataset.i); }); });
    if (over) return;
    if (phase === 'remove') say(`${name(turn)}: you made a row of 3 (a mill)! Tap a ${turn === 1 ? 'black' : 'white'} cow to take it.`, `${name(turn)}: u entse mola oa 3! Tobetsa khomo ea ${turn === 1 ? 'ntšo' : 'tšoeu'} ho e nka.`);
    else if (hand[turn] > 0) say(`${name(turn)}: place a cow on an empty point.`, `${name(turn)}: beha khomo sebakeng se se nang letho.`);
    else say(`${name(turn)}: ${sel === null ? 'choose one of your cows to move' : 'tap where it should go'}${onBoard[turn] === 3 ? ' (3 cows left: you can FLY anywhere!)' : ''}.`, `${name(turn)}: ${sel === null ? 'khetha khomo ea hau eo u batlang ho e tsamaisa' : 'tobetsa moo e lokelang ho ea teng'}${onBoard[turn] === 3 ? ' (likhomo tse 3 li setse: e ka fofela kae kapa kae!)' : ''}.`);
  };

  const doRemove = i => { board[i] = 0; onBoard[3 - turn]--; react(true); if (hand[3 - turn] === 0 && onBoard[3 - turn] < 3) return end(turn); phase = 'play'; nextTurn(); };

/* ---------- Word match memory ---------- */
Games.match = function (main) {
  const pool = (LESELI.words || []).filter(w => w.en.length < 14 && w.st.length < 14);
  let pairs, open = [], done = 0, tries = 0; const grid = h('div', { class: 'mem-grid' }); const info = h('p', { class: 'muted', 'aria-live': 'polite' });
  const start = () => {
    pairs = shuffle(pool).slice(0, 6); done = 0; tries = 0; open = [];
    const cards = shuffle(pairs.flatMap((w, k) => [{ k, t: w.en, lang: 'en' }, { k, t: w.st, lang: 'st' }]));
    grid.innerHTML = '';
    cards.forEach(c => { const b = h('button', { class: 'mem-card', 'aria-label': T('hiddenCard') }, '?'); b.onclick = () => flip(b, c); grid.appendChild(b); });
    info.textContent = tx({ en: 'Find each English word and its Sesotho partner.', st: 'Fumana lentsoe la Senyesemane le molekane oa lona oa Sesotho.' });
  };
  const flip = (b, c) => {
    if (b.classList.contains('open') || b.classList.contains('done') || open.length === 2) return;
    b.classList.add('open'); b.textContent = c.t; b.setAttribute('aria-label', c.t); Speech.say(c.t, c.lang); open.push([b, c]);

  };
  add(main, [h('h1', {}, '🃏 ' + T('wordMatch')), info, grid, h('button', { class: 'btn block', style: { marginTop: '12px' }, onclick: start }, icon('refresh'), T('newGame'))]);

};

/* ---------- Spelling bee (English letters) ---------- */
Games.spell = function (main) {

    const kb = h('div', { class: 'pad', style: { gridTemplateColumns: 'repeat(7,1fr)' } }, 'abcdefghijklmnopqrstuvwxyz'.split('').map(ch => h('button', { style: { fontSize: '1.1em', minHeight: '46px' }, onclick: () => { if (typed.length < w.en.length) { typed += ch; Speech.say(ch, 'en'); ans.textContent = typed + ' ' + '_ '.repeat(w.en.length - typed.length); if (typed.length === w.en.length) check(); } } }, ch)).concat([h('button', { class: 'del', onclick: () => { typed = typed.slice(0, -1); ans.textContent = typed + ' ' + '_ '.repeat(w.en.length - typed.length); } }, '⌫')]));

/* ---------- Quick maths ---------- */
Games.quickmaths = function (main) {
  let score = 0, left = 60, timer = null, cur = null;
  const box = h('div'); add(main, [h('h1', {}, '⚡ ' + T('quickMaths')), box]);
  const gen = () => { const op = pick(['+', '−', '×', '÷']); let a = rnd(2, 12), b = rnd(2, 12); if (op === '+') { a = rnd(10, 99); b = rnd(10, 99); return [`${a} + ${b}`, a + b]; } if (op === '−') { a = rnd(20, 99); b = rnd(1, a); return [`${a} − ${b}`, a - b]; } if (op === '×') return [`${a} × ${b}`, a * b]; return [`${a * b} ÷ ${a}`, b]; };
  const start = () => {
    score = 0; left = 60; box.innerHTML = ''; const t = h('div', { class: 'pill red', style: { fontSize: '1.1em' } }); const s = h('div', { class: 'pill green', style: { fontSize: '1.1em' } }); const q = h('div', { class: 'big-num', 'aria-live': 'polite' });
    const ask = () => { cur = gen(); q.textContent = cur[0] + ' = ?'; };
    const pad = numberPadReusable(v => { const ok = +v === cur[1]; if (ok) score++; react(ok); s.textContent = '✔ ' + score; ask(); });
    add(box, [h('div', { class: 'row between' }, t, s), h('section', { class: 'card' }, q, pad)]); ask();
    s.textContent = '✔ 0'; t.textContent = '⏱ 60';
    timer = setInterval(() => { left--; t.textContent = '⏱ ' + left; if (left <= 0 || !document.body.contains(box)) { clearInterval(timer); finish(); } }, 1000);
  };
  const finish = () => { if (!document.body.contains(box)) return; const best = Math.max(score, Store.prog().qmBest || 0); Store.prog().qmBest = best; Store.save(); Store.log('game_end', { game: 'quickmaths', score }); box.innerHTML = ''; add(box, [h('div', { class: 'card result-big' }, h('div', { class: 'score' }, score), h('p', {}, tx({ en: 'Best: ', st: 'E molemo ka ho fetisisa: ' }) + best), h('button', { class: 'btn primary', onclick: start }, T('playAgain')))]); if (score >= 10) confetti(); };
  box.appendChild(h('button', { class: 'btn primary block', onclick: start }, icon('play'), T('start')));
};
function numberPadReusable(onOk) {
  let val = ''; const box = h('div', { class: 'answer-box' }, '?');
  const pad = h('div', { class: 'pad' }, ['7', '8', '9', 'del', '4', '5', '6', 'ok', '1', '2', '3', '0'].map(k => h('button', { class: k === 'ok' ? 'ok' : k === 'del' ? 'del' : '', onclick: () => { if (k === 'del') val = val.slice(0, -1); else if (k === 'ok') { if (val) onOk(val); val = ''; } else if (val.length < 6) val += k; box.textContent = val || '?'; } }, k === 'del' ? '⌫' : k === 'ok' ? '✓' : k)));
  return h('div', {}, box, pad);
}

<script>
/* Teacher area (PIN protected): dashboard, learners, voice-question inbox, record lesson narration

   share content packs, and the Monitoring & Evaluation (M&E) toolkit with KPIs and exports. */
'use strict';

const Teacher = {
  unlockedUntil: 0,
  unlocked() { return Date.now() < this.unlockedUntil; },
  unlock() { this.unlockedUntil = Date.now() + 20 * 60 * 1000; },
  learnerName(id) { const l = Store.s.learners.find(x => x.id === id); return l ? l.name : (id === 'guest' ? T('guest') : '—'); },
  learnerCode(id) { const l = Store.s.learners.find(x => x.id === id); return l ? l.code : 'G'; },
  /* ---------- KPIs (used on screen and in exports) ---------- */
  kpis() {

    const learners = S.learners;
    const active = learners.filter(l => S.events.some(e => e.l === l.id && now - e.t < wk && ['open_lesson', 'quiz_done', 'practice', 'thuso', 'story'].includes(e.e)));
    const everActive = learners.filter(l => S.events.some(e => e.l === l.id && ['quiz_done', 'practice'].includes(e.e)));

    const basePct = avg(base.map(c => c.baseline.score / c.baseline.max)), endPct = avg(paired.map(c => c.endline.score / c.endline.max)), pairBase = avg(paired.map(c => c.baseline.score / c.baseline.max));

  }
};

Screens.teacher = function (main, sub, arg) {

  add(main, [t('class', '🧑‍🏫', 'classMode', 'classModeSub'), t('inbox', '🎤', 'inbox', 'inboxSub'), t('narrate', '🎙️', 'narrate', 'narrateSub'), t('learners', '👧🏾', 'learners', 'learnersSub'),
    t('me', '📊', 'mne', 'mneSub'), t('sus', '📝', 'susTitle', 'susSub'), t('edit', '✏️', 'editContent', 'editSub'), t('create', '➕', 'createLesson', 'createSub'), t('reports', '⚑', 'reportsTitle', 'reportsSub'), t('drawings', '🎨', 'drawingsTitle', 'drawingsSub'), t('data', '💾', 'dataTitle', 'dataSub')]);
  return T('teacherArea');

/* ---------- learners ---------- */

    h('button', { class: 'btn block', onclick: () => Platform.shareText('leseli-learners-' + today() + '.csv', learnersCSV(), 'text/csv') }, icon('download'), T('learnersCsv')),
    h('button', { class: 'btn block', onclick: () => Platform.shareText('leseli-events-' + today() + '.csv', eventsCSV(), 'text/csv') }, icon('download'), T('eventsCsv')),
    h('button', { class: 'btn block', onclick: () => Platform.shareText('leseli-feedback-' + today() + '.csv', feedbackCSV(), 'text/csv') }, icon('download'), T('feedbackCsv')))]);
  return T('mne');
}
const csv = rows => rows.map(r => r.map(v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
function learnersCSV() {
  return csv([['code', 'grade', 'gender', 'lessons_done', 'quiz_attempts', 'avg_quiz_pct', 'stars', 'practice_right', 'baseline', 'baseline_max', 'endline', 'endline_max', 'minutes', 'days_active', 'thuso_questions', 'teacher_questions']].concat(Store.s.learners.map(l => {
    const p = Store.s.progress[l.id] || { lessons: {}, stars: 0, days: [], practice: {} }; const q = Store.s.events.filter(e => e.l === l.id && e.e === 'quiz_done'); const c = Store.s.checks[l.id] || {};
    return [l.code, l.grade, l.gender || '', Object.values(p.lessons).filter(x => x.stars > 0).length, q.length, q.length ? Math.round(q.reduce((a, e) => a + e.d.score / e.d.max, 0) / q.length * 100) : '', p.stars, (p.practice || {}).right || 0, c.baseline ? c.baseline.score : '', c.baseline ? c.baseline.max : '', c.endline ? c.endline.score : '', c.endline ? c.endline.max : '',
      Math.round(Store.s.events.filter(e => e.l === l.id && e.e === 'time').reduce((a, e) => a + e.d.secs, 0) / 60), (p.days || []).length, Store.s.events.filter(e => e.l === l.id && e.e === 'thuso').length, Store.s.questions.filter(x => x.l === l.id).length];
  })));
}
function eventsCSV() { return csv([['time', 'learner_code', 'event', 'details']].concat(Store.s.events.map(e => [new Date(e.t).toISOString(), Teacher.learnerCode(e.l), e.e, e.d ? JSON.stringify(e.d) : '']))); }
function feedbackCSV() { return csv([['time', 'learner_code', 'grade', 'gender', 'rating_1to3', 'easy_1to3', 'note', 'vision_mode', 'hearing_mode']].concat(Store.s.feedback.map(f => [new Date(f.t).toISOString(), Teacher.learnerCode(f.l), f.grade || '', f.gender || '', f.rating || '', f.easy || '', f.note || '', f.vision ? 1 : 0, f.hearing ? 1 : 0])).concat([[], ['teacher_SUS', 'score', 'answers']]).concat(Store.s.sus.map(s => [new Date(s.t).toISOString(), s.score, s.answers.join(' ')]))); }
function summaryText(k) {
  return `LESELI – Moshoeshoe II Primary School – M&E summary (${today()})\n` +
    `Learners registered: ${k.registered}; active this week: ${k.active} (girls ${k.girls}, boys ${k.boys})\n` +
    `Lessons completed: ${k.lessonsDone}; minutes reading lessons: ${k.mins}; practice answers: ${k.practice}; Thuso questions: ${k.thuso}\n` +
    `Average quiz score: ${pct(k.avgQuiz)}; on 'hard' topics: ${pct(k.avgHard)}\n` +
    `Starting check: ${pct(k.basePct)} (n=${k.baseN}); paired final check: ${k.paired ? pct(k.pairBase) + ' -> ' + pct(k.endPct) + ' (n=' + k.paired + ')' : 'not yet'}\n` +
    `Learner happiness: ${pct(k.happy)} happy; easy to use: ${pct(k.easy)} (n=${k.fbN}); teacher SUS: ${k.sus ? Math.round(k.sus) : '-'} (n=${k.susN})\n` +
    `Accessibility features used in ${pct(k.access)} of sessions; Sesotho used in ${pct(k.stShare)} of sessions\n` +
    `Class-mode lessons: ${k.classSessions}; learner questions answered: ${pct(k.answered)} of ${k.questions}\n` +
    `(No names included. Learner codes only.)`;
}

/* ---------- System Usability Scale for teachers (Sesotho + English) ---------- */
function tSUS(main) {
  const items = [
    L('I think that I would like to use Leseli often.', 'Ke nahana hore nka rata ho sebelisa Leseli khafetsa.'),
    L('I found Leseli unnecessarily complex.', 'Ke fumane Leseli e rarahane ho feta tlhokahalo.'),
    L('I thought Leseli was easy to use.', 'Ke nahanne hore Leseli e bonolo ho e sebelisa.'),
    L('I think I would need help from a technical person to use Leseli.', 'Ke nahana hore nka hloka thuso ea setsebi ho sebelisa Leseli.'),
    L('The parts of Leseli work well together.', 'Likarolo tsa Leseli li sebetsa hantle hammoho.'),
    L('There was too much inconsistency in Leseli.', 'Ho ne ho e-na le ho se tsitse ho hongata ho Leseli.'),
    L('Most people would learn to use Leseli very quickly.', 'Batho ba bangata ba ka ithuta ho sebelisa Leseli kapele haholo.'),
    L('I found Leseli very awkward to use.', 'Ke fumane Leseli e le thata haholo ho e sebelisa.'),
    L('I felt very confident using Leseli.', 'Ke ikutloile ke na le boitšepo bo boholo ha ke sebelisa Leseli.'),
    L('I needed to learn a lot of things before I could get going with Leseli.', 'Ke ile ka hloka ho ithuta lintho tse ngata pele ke qala ho sebelisa Leseli.')];
  const ans = Array(10).fill(0);
  add(main, [ut('h1', 'susTitle'), ut('p', 'susWhy', { class: 'muted' })]);
  items.forEach((it, i) => { const seg = h('div', { class: 'seg', style: { display: 'flex' } }, [1, 2, 3, 4, 5].map(v => h('button', { style: { flex: 1 }, 'aria-pressed': 'false', 'aria-label': v + '/5', onclick: e => { ans[i] = v; $$('button', seg).forEach(b => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); } }, v))); main.appendChild(h('section', { class: 'card' }, h('b', {}, (i + 1) + '. '), biText('span', it), h('div', { class: 'row between small muted', style: { margin: '6px 0' } }, h('span', {}, tx({ en: '1 = strongly disagree', st: '1 = ha ke lumele ho hang' })), h('span', {}, tx({ en: '5 = strongly agree', st: '5 = ke lumela haholo' }))), seg)); });
  main.appendChild(h('button', { class: 'btn primary block', onclick: () => {
    if (ans.includes(0)) return toast(T('answerAll'));
    const score = ans.reduce((a, v, i) => a + (i % 2 === 0 ? v - 1 : 5 - v), 0) * 2.5;
    Store.s.sus.push({ t: Date.now(), score, answers: ans }); Store.log('sus', { score }); Store.save();
    modal((s, c) => add(s, [h('h2', {}, 'SUS = ' + score), h('p', {}, score >= 68 ? tx({ en: 'Above average usability. Thank you!', st: 'Ho sebelisoa ho hantle ho feta karolelano. Kea leboha!' }) : tx({ en: 'Below average – please also tell the team what was hard.', st: 'Ka tlase ho karolelano – ka kopo bolella sehlopha se neng se le thata.' })), h('button', { class: 'btn primary block', onclick: () => { c(); go('teacher'); } }, T('done'))]));
  } }, T('send')));
  return T('susTitle');
}

function tReports(main) {
  add(main, [ut('h1', 'reportsTitle')]);
  if (!Store.s.reports.length) main.appendChild(h('p', { class: 'empty' }, T('nothingYet')));
  Store.s.reports.slice().reverse().forEach(r => { const l = Content.lesson(r.lesson); main.appendChild(h('section', { class: 'card' }, h('b', {}, l ? tx(l.title) : r.lesson), h('p', {}, r.text), h('div', { class: 'row' }, l ? h('a', { class: 'btn small', href: '#/teacher/edit/' + r.lesson }, icon('pencil', null, 16), T('editContent')) : null, h('button', { class: 'btn small warn', onclick: () => { Store.s.reports = Store.s.reports.filter(x => x !== r); Store.save(); App.render(); } }, icon('trash', null, 16))))); });
  return T('reportsTitle');
}
function tDrawings(main) {
  add(main, [ut('h1', 'drawingsTitle')]);
  if (!Store.s.drawings.length) main.appendChild(h('p', { class: 'empty' }, T('nothingYet')));
  main.appendChild(h('div', { class: 'grid' }, Store.s.drawings.slice().reverse().map(d => h('figure', { class: 'card', style: { margin: 0, padding: '6px' } }, h('img', { src: d.d, alt: 'drawing', style: { width: '100%', borderRadius: '8px' } }), h('figcaption', { class: 'small' }, Teacher.learnerName(d.l) + ' · ' + new Date(d.t).toLocaleDateString())))));
  return T('drawingsTitle');
}

/* ---------- backup / restore / PIN ---------- */
function tData(main) {
  add(main, [ut('h1', 'dataTitle'), ut('p', 'dataWhy', { class: 'muted' })]);
  const file = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' }, onchange: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.learners || !d.settings) throw 0; confirmBox(T('restoreSure'), () => { Store.s = Object.assign(Store.s, d); Store.save(); toast(T('saved')); App.applySettings(); go('teacher'); }); } catch (err) { toast(T('badFile')); } }; r.readAsText(f); } });
  add(main, [h('section', { class: 'card stack' },
    h('button', { class: 'btn block', onclick: () => Platform.shareText('leseli-backup-' + today() + '.json', JSON.stringify(Store.s), 'application/json') }, icon('download'), T('backup')),
    h('button', { class: 'btn block', onclick: () => file.click() }, icon('upload'), T('restore')), file,
    h('button', { class: 'btn block', onclick: () => { Store.s.pin = null; Store.save(); App.render(); } }, icon('lock'), T('changePin')),
    h('button', { class: 'btn warn block', onclick: () => confirmBox(T('wipeSure'), () => { localStorage.clear(); try { indexedDB.deleteDatabase('leseli-audio'); } catch (e) {} location.hash = ''; location.reload(); }) }, icon('trash'), T('wipeAll'))),
    h('section', { class: 'card small' }, h('b', {}, T('storageUsed') + ': '), Math.round(JSON.stringify(Store.s).length / 1024) + ' KB · ' + Store.s.events.length + ' ' + T('events'))]);
  return T('dataTitle');
}

/* ---------- starting check / final check (baseline & endline for M&E) ---------- */
const Checks = {
  run(main, kind) {
    const l = Store.learner(); const g = l ? l.grade : Content.grade();
    const qs = (LESELI.checks || {})[g] || [];
    add(main, [h('h1', {}, (kind === 'baseline' ? '📝 ' : '🏁 ') + T(kind)), ut('p', 'checkIntro', { class: 'muted' })]);
    if (!Store.s.current) { main.appendChild(h('p', { class: 'card' }, T('checkNeedsLearner'))); return; }
    const prev = (Store.s.checks[Store.lid()] || {})[kind];
    if (prev) main.appendChild(h('p', { class: 'pill' }, T('doneBefore') + ': ' + prev.score + '/' + prev.max));
    const startBtn = h('button', { class: 'btn primary block', onclick: () => {
      startBtn.remove();
      renderQuiz(main, qs, { noShuffle: true, max: 99, onDone: (score, max, answers, wrap) => {
        const c = Store.s.checks[Store.lid()] || (Store.s.checks[Store.lid()] = {});
        c[kind] = { score, max, answers, grade: g, date: Date.now() }; Store.log('check', { kind, score, max, grade: g }); Store.save();
        wrap.appendChild(h('section', { class: 'card result-big' }, ut('h2', 'thanks'), h('div', { class: 'score' }, score + '/' + max), ut('p', kind === 'baseline' ? 'baselineDone' : 'endlineDone')));
        if (kind === 'endline' && c.baseline) wrap.appendChild(h('p', { class: 'card', style: { textAlign: 'center', fontWeight: 800 } }, T('baseline') + ' ' + c.baseline.score + ' → ' + T('endline') + ' ' + score));
        wrap.appendChild(h('a', { class: 'btn primary block', href: '#/home' }, T('home')));
        confetti();
      } });
    } }, T('start'));
    main.appendChild(startBtn);
  }
};
