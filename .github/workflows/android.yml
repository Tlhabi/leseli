# Builds the Leseli Android APK on GitHub's computers – no Android Studio needed.
# Push to GitHub, open the "Actions" tab, click the latest run, download "Leseli-APK".
name: Build Android APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check content and package the web app
        run: node tools/build.js && node tools/test-math.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Leseli-debug.apk
          cp android/app/build/outputs/apk/release/*.apk out/Leseli.apk
          cp dist/leseli-offline.html out/
      - uses: actions/upload-artifact@v4
        with: { name: Leseli-APK, path: out/ }
      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'out/*' }
