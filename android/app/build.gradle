plugins { id 'com.android.application' }

android {
    namespace 'ls.leseli.app'
    compileSdk 34
    defaultConfig {
        applicationId "ls.leseli.app"
        minSdk 21          // Android 5.0 – works on old, cheap phones
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing: create a keystore once (see docs/TECHNICAL.md) and fill keystore.properties.
            def kp = rootProject.file('keystore.properties')
            if (kp.exists()) {
                def p = new Properties(); p.load(new FileInputStream(kp))
                signingConfig signingConfigs.create('release') {
                    storeFile file(p['storeFile']); storePassword p['storePassword']; keyAlias p['keyAlias']; keyPassword p['keyPassword']
                }
            } else {
                signingConfig signingConfigs.debug   // lets the pilot APK install without a keystore
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

/* Always package the newest web app: copies ../../app into assets/www before every build. */
tasks.register('syncWebApp', Copy) {
    from(rootProject.file('../app')) { exclude 'sw.js' }
    into file('src/main/assets/www')
}
preBuild.dependsOn syncWebApp
